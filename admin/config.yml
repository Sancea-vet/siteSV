backend:
  name: github
  repo: "Sancea-vet/siteSV"
  branch: main
  # Origine des endpoints OAuth /auth et /callback.
  # À repasser sur https://sanceavet.fr quand le domaine sera réactivé
  # (et à réaligner avec l'URL de callback de l'app OAuth GitHub).
  base_url: https://sv-33m.pages.dev
  auth_scope: repo          # aligné avec auth.js
  editorial_workflow: true
  editor:
    preview: true

# local_backend: true   ← à commenter/supprimer en prod

media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  - name: "blog"
    label: "Blog"
    label_singular: "Article"
    files:
      - file: "data/posts.json"
        label: "Articles du blog"
        name: "posts"
        fields:
          - label: "Articles"
            name: "posts"
            widget: list
            required: false          # autorise d'enregistrer une liste vide
            summary: "{{fields.title}}"
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - label: "Slug (adresse web)"
                name: "slug"
                widget: "string"
                required: false
                hint: "Facultatif : laissez vide pour générer l'adresse automatiquement à partir du titre. Pour un meilleur référencement, vous pouvez saisir votre propre slug (minuscules, chiffres et tirets, sans accents ni espaces). Ex : conseils-vaccination-chat"
                pattern: ['^$|^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Uniquement des minuscules, chiffres et tirets (ex : mon-article), ou laissez vide']
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
              - { label: "Catégorie", name: "category", widget: "string" }
              - { label: "Image", name: "image", widget: "image", required: false }
              - label: "Vidéo — lien YouTube / Vimeo"
                name: "videoUrl"
                widget: "string"
                required: false
                hint: "Facultatif : collez l'adresse d'une vidéo YouTube ou Vimeo (ex : https://www.youtube.com/watch?v=abc123). Le lecteur s'affichera dans l'article, juste sous le chapô. Solution recommandée : aucun fichier lourd n'est stocké sur le site."
              - label: "Vidéo — fichier MP4"
                name: "videoFile"
                widget: "file"
                required: false
                accept: "video/mp4,video/webm,.mp4,.webm"
                media_folder: "/assets/video"
                public_folder: "/assets/video"
                media_libraries:
                  default:
                    config:
                      max_file_size: 25000000   # ~25 Mo, sous la limite de 25 Mio/fichier de Cloudflare Pages
                hint: "Facultatif : pour une courte vidéo tournée à la clinique. 25 Mo maximum (limite de l'hébergement) — au-delà, passez par YouTube et utilisez le champ « lien » ci-dessus. Si les deux champs sont remplis, c'est le fichier qui est affiché."
              - { label: "Extrait", name: "excerpt", widget: "text" }
              - { label: "Durée de lecture", name: "timeToRead", widget: "string", required: false }
              - { label: "Contenu", name: "body", widget: "markdown" }