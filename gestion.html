    // ─── Onglet Règles ─────────────────────────────────────────
    function ReglesTab({rules,setRules,vets,setVets,openDays,setOpenDays,horaireTimes,setHoraireTimes}){
      const [rType,        setRType]        = useState('min_per_slot');
      const [slot,         setSlot]         = useState('matin');
      const [dType,        setDType]        = useState('weekday');
      const [parity,       setParity]       = useState('all');
      const [minN,         setMinN]         = useState(2);
      const [minHoraire,   setMinHoraire]   = useState('');  // '' = global, 'matin_A/B' ou 'aprem_A/B' = par sous-créneau
      const [vetId,        setVetId]        = useState('');
      const [dow,          setDow]          = useState(1);
      const [horaire,      setHoraire]      = useState('matin_A');
      const [fixedDayRule, setFixedDayRule] = useState(false);

      const JOURS_FR=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

      const addRule=()=>{
        const base={id:uid(),type:rType,slot,dayType:dType,weekParity:parity};
        if(rType==='min_per_slot') setRules(prev=>{
          const hFilter = minHoraire || undefined;
          const exists=prev.find(r=>r.type==='min_per_slot'&&r.slot===slot&&r.dayType===dType&&r.weekParity===parity&&(r.horaire||undefined)===(hFilter));
          const rule = hFilter ? {...base,min:minN,horaire:hFilter} : {...base,min:minN};
          return exists?prev.map(r=>r===exists?{...r,min:minN}:r):[...prev,rule];
        });
        else if(rType==='horaire_rule') setRules(prev=>{
          const rule = fixedDayRule
            ? {...base, dayType:'all', weekParity:'all', dayOfWeek:+dow, horaire}
            : {...base, horaire};
          const exists = prev.find(r =>
            r.type==='horaire_rule' &&
            r.slot===slot &&
            (fixedDayRule ? r.dayOfWeek === +dow : r.dayType===dType && r.weekParity===parity)
          );
          return exists ? prev.map(r => r===exists ? rule : r) : [...prev, rule];
        });
        else if(rType==='vet_slot_rule' && vetId) setRules(prev=>{
          const rule = fixedDayRule
            ? {...base, dayType:'all', weekParity:'all', dayOfWeek:+dow, horaire, vetId}
            : {...base, horaire, vetId};
          const exists = prev.find(r =>
            r.type==='vet_slot_rule' &&
            r.slot===slot &&
            r.vetId===vetId &&
            r.horaire===horaire &&
            (fixedDayRule ? r.dayOfWeek === +dow : r.dayType===dType && r.weekParity===parity)
          );
          return exists ? prev.map(r => r===exists ? rule : r) : [...prev, rule];
        });
        else if(rType==='never_slot'&&vetId) setRules(prev=>{
          if(prev.some(r=>r.type==='never_slot'&&r.vetId===vetId&&r.slot===slot&&r.dayOfWeek===+dow&&r.weekParity===parity)) return prev;
          return [...prev,{...base,vetId,dayOfWeek:+dow}];
        });
      };

      const pLabel=p=>p==='even'?'Paire':p==='odd'?'Impaire':'Toutes';
      const sLabel=s=>s==='matin'?'Matin':s==='aprem'?'Après-midi':'Tous';
      const labelOf=r=>{
        const pl=<span className={'parity-badge '+(r.weekParity==='even'?'parity-even':r.weekParity==='odd'?'parity-odd':'parity-all')} style={{margin:'0 3px'}}>{pLabel(r.weekParity)}</span>;
        const sl=<span className={'slot-badge '+(r.slot==='matin'?'slot-matin':r.slot==='aprem'?'slot-aprem':'slot-all')} style={{margin:'0 3px'}}>{sLabel(r.slot)}</span>;
        if(r.type==='min_per_slot'){
          const hLbl = r.horaire ? <span style={{margin:'0 3px',fontWeight:700,color:'#0d9488'}}>{HORAIRES[r.horaire]?.short||r.horaire}</span> : null;
          return <span>📊 Min. {r.min} véto(s) — {sl}{hLbl?' → ':''}{hLbl} — S. {pl}</span>;
        }
        if(r.type==='horaire_rule'){
          const h=HORAIRES[r.horaire];
          const fixedDay = r.dayOfWeek !== undefined ? <span style={{margin:'0 3px'}}>Jour fixe {JS_FULL[r.dayOfWeek]}</span> : pl;
          return <span>🕐 {sl} → {h?h.label:'?'} — {r.dayOfWeek !== undefined ? fixedDay : <>S. {pl}</>}</span>;
        }
        if(r.type==='vet_slot_rule'){
          const h=HORAIRES[r.horaire];
          const vetName = vets.find(v=>v.id===r.vetId)?.name || 'Vétérinaire';
          const fixedDay = r.dayOfWeek !== undefined ? <span style={{margin:'0 3px'}}>Jour fixe {JS_FULL[r.dayOfWeek]}</span> : pl;
          return <span>👩‍⚕️ {vetName} — {sl} → {h?h.label:'?'} — {r.dayOfWeek !== undefined ? fixedDay : <>S. {pl}</>}</span>;
        }
        if(r.type==='never_slot'){
          const vetName = vets.find(v=>v.id===r.vetId)?.name || 'Vétérinaire';
          const dayLabel = r.dayOfWeek !== undefined ? ` ${JS_FULL[r.dayOfWeek]}` : '';
          return <span>🚫 {vetName} — {sl} —{dayLabel} — S. {pl}</span>;
        }
        return <span>{r.type}</span>;
      };

      const byType=(t)=>rules.filter(r=>r.type===t);

      return(
        <div style={{maxWidth:740}}>
          <h2 className="section-title">Règles & Contraintes</h2>
          <p className="section-desc">Règles par créneau (matin/après-midi) et par parité de semaine.</p>

          {/* Jours ouverture */}
          <div className="g-card" style={{marginBottom:16}}>
            <h3 style={{fontSize:13,fontWeight:600,marginBottom:12,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.06em'}}>Jours d'ouverture</h3>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {JOURS_FR.map((j,i)=>(
                <button key={i} onClick={()=>setOpenDays(prev=>{const n=[...prev];n[i]=!n[i];return n;})}
                  className={'day-toggle '+(openDays[i]?'on':'off')}>{j}</button>
              ))}
            </div>
          </div>

          {/* ── Temps de travail vétérinaire ── */}
          <div className="g-card" style={{marginBottom:16}}>
            <h3 style={{fontSize:13,fontWeight:600,marginBottom:4,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.06em'}}>
              📅 Temps de travail vétérinaire
            </h3>
            <p style={{fontSize:12,color:'#9ca3af',marginBottom:14,lineHeight:1.6}}>
              Jours de travail annuels et semaines de congés par vétérinaire → jours/semaine moyens à planifier.
              Le générateur répartit les jours proportionnellement à cette cible, et l'onglet Planning indique
              s'il reste du temps véto à consommer une fois les astreintes et couvertures minimales assurées.
            </p>
            <div style={{display:'flex',flexDirection:'column',gap:8}}>
              {vets.map(v=>{
                const sw = 52 - (v.semainesConges ?? 0);
                const js = (v.joursAnnuels && sw > 0) ? v.joursAnnuels / sw : null;
                return (
                  <div key={v.id} style={{display:'flex',alignItems:'flex-end',gap:12,padding:'10px 14px',
                    background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:10,flexWrap:'wrap'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,minWidth:120,paddingBottom:9}}>
                      <div style={{width:10,height:10,borderRadius:'50%',background:v.color,flexShrink:0}}/>
                      <span style={{fontWeight:600,fontSize:13,color:'#1f2937'}}>{v.name}</span>
                    </div>
                    <div>
                      <span className="g-label">Jours travaillés / an</span>
                      <input type="number" min="0" max="365" step="1" value={v.joursAnnuels ?? ''} placeholder="ex : 200"
                        onChange={e=>{const val=e.target.value; setVets(prev=>prev.map(x=>x.id===v.id?{...x,joursAnnuels:val===''?undefined:Math.max(0,+val)}:x));}}
                        className="g-input" style={{width:110}}/>
                    </div>
                    <div>
                      <span className="g-label">Semaines de congés</span>
                      <input type="number" min="0" max="26" step="1" value={v.semainesConges ?? ''} placeholder="ex : 5"
                        onChange={e=>{const val=e.target.value; setVets(prev=>prev.map(x=>x.id===v.id?{...x,semainesConges:val===''?undefined:Math.max(0,+val)}:x));}}
                        className="g-input" style={{width:110}}/>
                    </div>
                    <div style={{marginLeft:'auto',textAlign:'right'}}>
                      <span className="g-label">Jours / semaine</span>
                      <div style={{fontSize:17,fontWeight:700,color:js?'#0d9488':'#9ca3af',paddingBottom:2}}>
                        {js ? js.toFixed(2).replace(/\.?0+$/,'') : '—'}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* ── Horaires des créneaux ── */}
          <div className="g-card" style={{marginBottom:16}}>
            <h3 style={{fontSize:13,fontWeight:600,marginBottom:4,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.06em'}}>
              ⏰ Horaires des créneaux
            </h3>
            <p style={{fontSize:12,color:'#9ca3af',marginBottom:14}}>
              Modifiez les heures de début et fin de chaque créneau. La logique de génération du planning reste inchangée.
            </p>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(280px,1fr))',gap:12}}>
              {[
                {id:'matin_A', label:'🌅 Matin A', color:'#f59e0b'},
                {id:'matin_B', label:'🌄 Matin B', color:'#0891b2'},
                {id:'aprem_A', label:'🌇 Après-midi A', color:'#8b5cf6'},
                {id:'aprem_B', label:'🌆 Après-midi B', color:'#ec4899'},
              ].map(({id, label, color})=>{
                const ht = horaireTimes[id];
                const toTime = h => `${String(Math.floor(h)).padStart(2,'0')}:${String(Math.round((h%1)*60)).padStart(2,'0')}`;
                const toDecimal = s => { const [h,m]=s.split(':').map(Number); return h+m/60; };
                const dur = ht.end - ht.start;
                const slot = id.startsWith('matin') ? 'matin' : 'aprem';
                const defaultHt = DEFAULT_HORAIRE_TIMES[id];
                const isModified = ht.start !== defaultHt.start || ht.end !== defaultHt.end;
                return (
                  <div key={id} style={{background:'#fafafa',border:'1.5px solid #e2e8f0',borderRadius:12,
                    padding:'12px 14px',borderLeft:`4px solid ${color}`}}>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>
                      <span style={{fontSize:12,fontWeight:700,color}}>{label}</span>
                      <div style={{display:'flex',gap:6,alignItems:'center'}}>
                        <span style={{fontSize:10,background:slot==='matin'?'#fef3c7':'#ede9fe',
                          color:slot==='matin'?'#92400e':'#5b21b6',borderRadius:6,padding:'1px 6px',fontWeight:600}}>
                          {slot==='matin'?'Matin':'Après-midi'}
                        </span>
                        {isModified&&(
                          <button onClick={()=>setHoraireTimes(prev=>({...prev,[id]:DEFAULT_HORAIRE_TIMES[id]}))}
                            style={{fontSize:10,background:'#fef2f2',color:'#ef4444',border:'1px solid #fecaca',
                              borderRadius:6,padding:'1px 7px',cursor:'pointer',fontFamily:"'Inter',sans-serif"}}>
                            ↺ Reset
                          </button>
                        )}
                      </div>
                    </div>
                    <div style={{display:'flex',gap:8,alignItems:'center'}}>
                      <div style={{flex:1}}>
                        <span className="g-label">Début</span>
                        <input type="time" step="900" value={toTime(ht.start)}
                          onChange={e=>{
                            const v = toDecimal(e.target.value);
                            if(isNaN(v) || v >= ht.end) return;
                            setHoraireTimes(prev=>({...prev,[id]:{...prev[id],start:v}}));
                          }}
                          className="g-input" style={{width:'100%'}}/>
                      </div>
                      <div style={{paddingTop:18,color:'#9ca3af',fontWeight:700,fontSize:16}}>→</div>
                      <div style={{flex:1}}>
                        <span className="g-label">Fin</span>
                        <input type="time" step="900" value={toTime(ht.end)}
                          onChange={e=>{
                            const v = toDecimal(e.target.value);
                            if(isNaN(v) || v <= ht.start) return;
                            setHoraireTimes(prev=>({...prev,[id]:{...prev[id],end:v}}));
                          }}
                          className="g-input" style={{width:'100%'}}/>
                      </div>
                    </div>
                    <div style={{fontSize:11,color:'#6b7280',marginTop:8,textAlign:'center',
                      background:'#fff',borderRadius:6,padding:'4px 8px',border:'1px solid #f1f5f9'}}>
                      <strong style={{color}}>{formatHTime(ht.start)}</strong>
                      <span style={{margin:'0 6px',color:'#d1d5db'}}>→</span>
                      <strong style={{color}}>{formatHTime(ht.end)}</strong>
                      <span style={{marginLeft:8,color:'#9ca3af'}}>({dur.toFixed(2).replace(/\.?0+$/,'')}h)</span>
                    </div>
                  </div>
                );
              })}
            </div>
            <button onClick={()=>setHoraireTimes(DEFAULT_HORAIRE_TIMES)}
              className="btn-ghost" style={{marginTop:12,fontSize:12,color:'#6b7280'}}>
              ↺ Réinitialiser tous les horaires par défaut
            </button>
          </div>

          {/* Règle fixe : créneaux obligatoires */}
          <div className="g-card" style={{marginBottom:16,border:'1.5px solid #99f6e4',background:'#f0fdfa'}}>
            <h3 style={{fontSize:13,fontWeight:600,marginBottom:8,color:'#0d9488',textTransform:'uppercase',letterSpacing:'.06em'}}>
              🔒 Règle fixe — non modifiable
            </h3>
            <div className="rule-row" style={{background:'#fff'}}>
              <span style={{flex:1,fontSize:13}}>
                🏥 <strong>Tous les créneaux ouverts doivent être couverts</strong> — la clinique ouvre et ferme toujours aux mêmes horaires (matin ET après-midi obligatoires chaque jour d'ouverture)
              </span>
              <span className="slot-badge slot-all">Fixe</span>
            </div>
          </div>

          {/* Règles horaires */}
          <div className="g-card" style={{marginBottom:16}}>
            <h3 style={{fontSize:13,fontWeight:600,marginBottom:4,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.06em'}}>
              Horaires par parité <span className="parity-badge parity-even" style={{marginLeft:6}}>Paire</span><span className="parity-badge parity-odd" style={{marginLeft:4}}>Impaire</span>
            </h3>
            <p style={{fontSize:12,color:'#9ca3af',marginBottom:10}}>Définissez quel créneau s'applique selon que la semaine est paire ou impaire.</p>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {byType('horaire_rule').map(r=>(
                <div key={r.id} className="rule-row">
                  <span style={{flex:1,fontSize:13}}>{labelOf(r)}</span>
                  <button onClick={()=>setRules(p=>p.filter(x=>x.id!==r.id))} className="btn-danger-soft">Suppr.</button>
                </div>
              ))}
              {byType('horaire_rule').length===0&&<p style={{fontSize:12,color:'#9ca3af'}}>Aucune règle d'horaire</p>}
            </div>
          </div>

          {/* Règles vétérinaires sur créneaux */}
          <div className="g-card" style={{marginBottom:16}}>
            <h3 style={{fontSize:13,fontWeight:600,marginBottom:10,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.06em'}}>Affectation vétérinaire par créneau</h3>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {byType('vet_slot_rule').map(r=>(
                <div key={r.id} className="rule-row">
                  <span style={{flex:1,fontSize:13}}>{labelOf(r)}</span>
                  <button onClick={()=>setRules(p=>p.filter(x=>x.id!==r.id))} className="btn-danger-soft">Suppr.</button>
                </div>
              ))}
              {byType('vet_slot_rule').length===0&&<p style={{fontSize:12,color:'#9ca3af'}}>Aucune affectation vétérinaire</p>}
            </div>
          </div>

          {/* Règles couverture */}
          <div className="g-card" style={{marginBottom:16}}>
            <h3 style={{fontSize:13,fontWeight:600,marginBottom:10,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.06em'}}>Couverture minimale par créneau</h3>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {byType('min_per_slot').map(r=>(
                <div key={r.id} className="rule-row">
                  <span style={{flex:1,fontSize:13}}>{labelOf(r)}</span>
                  <button onClick={()=>setRules(p=>p.filter(x=>x.id!==r.id))} className="btn-danger-soft">Suppr.</button>
                </div>
              ))}
              {byType('min_per_slot').length===0&&<p style={{fontSize:12,color:'#9ca3af'}}>Aucune règle de couverture</p>}
            </div>
          </div>

          {/* Règles exclusion */}
          <div className="g-card" style={{marginBottom:16}}>
            <h3 style={{fontSize:13,fontWeight:600,marginBottom:10,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.06em'}}>Exclusions fixes</h3>
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              {byType('never_slot').map(r=>(
                <div key={r.id} className="rule-row">
                  <span style={{flex:1,fontSize:13}}>{labelOf(r)}</span>
                  <button onClick={()=>setRules(p=>p.filter(x=>x.id!==r.id))} className="btn-danger-soft">Suppr.</button>
                </div>
              ))}
              {byType('never_slot').length===0&&<p style={{fontSize:12,color:'#9ca3af'}}>Aucune exclusion</p>}
            </div>
          </div>

          {/* Ajouter une règle */}
          <div className="g-card">
            <h3 style={{fontSize:13,fontWeight:600,marginBottom:16,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.06em'}}>Ajouter une règle</h3>
            <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
              <div>
                <span className="g-label">Type</span>
                <select value={rType} onChange={e=>setRType(e.target.value)} className="g-input">
                  <option value="min_per_slot">Couverture minimale</option>
                  <option value="horaire_rule">Horaire par parité</option>
                  <option value="vet_slot_rule">Affectation vétérinaire</option>
                  <option value="never_slot">Exclusion créneau</option>
                </select>
              </div>
              <div>
                <span className="g-label">Créneau</span>
                <select value={slot} onChange={e=>{
                  const nextSlot = e.target.value;
                  setSlot(nextSlot);
                  const nextHoraire = Object.values(HORAIRES).find(h=>h.slot===nextSlot)?.id || 'matin_A';
                  setHoraire(nextHoraire);
                  setMinHoraire('');
                }} className="g-input">
                  <option value="matin">Matin</option>
                  <option value="aprem">Après-midi</option>
                  {rType==='never_slot'&&<option value="all">Les deux</option>}
                </select>
              </div>
              <div>
                <span className="g-label">Semaine</span>
                <select value={parity} onChange={e=>setParity(e.target.value)} className="g-input">
                  <option value="all">Toutes</option>
                  <option value="even">Paire</option>
                  <option value="odd">Impaire</option>
                </select>
              </div>
              {rType==='min_per_slot'&&<>
                <div>
                  <span className="g-label">Jours</span>
                  <select value={dType} onChange={e=>setDType(e.target.value)} className="g-input">
                    <option value="weekday">Semaine</option>
                    <option value="weekend">Week-end</option>
                    <option value="all">Tous</option>
                  </select>
                </div>
                <div>
                  <span className="g-label">Par type A/B</span>
                  <select value={minHoraire} onChange={e=>setMinHoraire(e.target.value)} className="g-input">
                    <option value="">Global ({slot==='matin'?'A+B':'A+B'})</option>
                    {Object.values(HORAIRES).filter(h=>h.slot===slot).map(h=>(
                      <option key={h.id} value={h.id}>{h.id.endsWith('_A')?'Type A':'Type B'} — {h.short}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <span className="g-label">Minimum</span>
                  <input type="number" min={1} max={10} value={minN} onChange={e=>setMinN(+e.target.value||1)}
                    className="g-input" style={{width:70}}/>
                </div>
              </>}
              {(rType==='horaire_rule'||rType==='vet_slot_rule')&&<>
                <div>
                  <span className="g-label">Mode</span>
                  <label style={{display:'flex',alignItems:'center',gap:6,fontSize:13,color:'#374151'}}>
                    <input type="checkbox" checked={fixedDayRule} onChange={e=>setFixedDayRule(e.target.checked)} />
                    Jour fixe
                  </label>
                </div>
                {!fixedDayRule ? (
                  <div>
                    <span className="g-label">Jours</span>
                    <select value={dType} onChange={e=>setDType(e.target.value)} className="g-input">
                      <option value="all">Tous</option>
                      <option value="weekday">Semaine</option>
                      <option value="weekend">Week-end</option>
                    </select>
                  </div>
                ) : (
                  <div>
                    <span className="g-label">Jour fixe</span>
                    <select value={dow} onChange={e=>setDow(e.target.value)} className="g-input">
                      {JS_FULL.map((d,i)=><option key={i} value={i}>{d}</option>)}
                    </select>
                  </div>
                )}
                <div>
                  <span className="g-label">Horaire appliqué</span>
                  <select value={horaire} onChange={e=>setHoraire(e.target.value)} className="g-input">
                    {Object.values(HORAIRES).filter(h=>h.slot===slot).map(h=>(
                      <option key={h.id} value={h.id}>{h.label}</option>
                    ))}
                  </select>
                </div>
                {rType==='vet_slot_rule'&&<>
                  <div>
                    <span className="g-label">Vétérinaire</span>
                    <select value={vetId} onChange={e=>setVetId(e.target.value)} className="g-input">
                      <option value="">Choisir…</option>
                      {vets.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
                    </select>
                  </div>
                </>}
              </>}
              {rType==='never_slot'&&<>
                <div>
                  <span className="g-label">Vétérinaire</span>
                  <select value={vetId} onChange={e=>setVetId(e.target.value)} className="g-input">
                    <option value="">Choisir…</option>
                    {vets.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
                  </select>
                </div>
                <div>
                  <span className="g-label">Jour exclu</span>
                  <select value={dow} onChange={e=>setDow(e.target.value)} className="g-input">
                    {JS_FULL.map((d,i)=><option key={i} value={i}>{d}</option>)}
                  </select>
                </div>
              </>}
              <button onClick={addRule} className="btn-teal">Ajouter</button>
            </div>
          </div>
        </div>
      );
    }

    // ─── Onglet Sync ───────────────────────────────────────────
    function SyncTab({validated,totalAlerts,planning,vets,year,month,gclientId,setGclientId,calId,setCalId,onExportICS,onExportCSV,onExportASVICS,onExportASVXLSX,asvPlanning,astreintes,freepbxWebhook,setFreepbxWebhook}){
      const planDays=Object.keys(planning).filter(k=>planning[k]).length;
      const hasP=planDays>0;
      const monthPrefix=`${year}-${String(month+1).padStart(2,'0')}-`;
      const hasASVP=asvPlanning&&Object.keys(asvPlanning).some(k=>k.startsWith(monthPrefix));

      // ── Synchronisation Google Calendar (OAuth + API) ──────────
      const [syncState, setSyncState] = useState('idle'); // idle|loading|auth|sync|done|warn|error
      const [syncMsg,   setSyncMsg]   = useState('');
      const [syncMode,  setSyncMode]  = useState('perVet'); // perVet : chacun son agenda | team : agenda commun
      const [sendInvites, setSendInvites] = useState(true);
      const [inclAstr,    setInclAstr]    = useState(true);
      const busy = syncState==='loading'||syncState==='auth'||syncState==='sync';
      const vetsSansEmail = vets.filter(v=>!v.email||!v.email.includes('@'));

      const _fmtT=h=>{const hh=Math.floor(h),mn=Math.round((h-hh)*60);return `${String(hh).padStart(2,'0')}:${String(mn).padStart(2,'0')}:00`;};
      const _addDays=(dateKey,n)=>{const[y,m2,d2]=dateKey.split('-').map(Number);const dt=new Date(y,m2-1,d2+n);return dk(dt.getFullYear(),dt.getMonth(),dt.getDate());};
      const SYNC_PRIV={private:{sanceavetSync:'1'}};

      // Liste brute des affectations du mois (créneaux + astreintes)
      const collectAssignments=()=>{
        const items=[];
        Object.keys(planning).filter(k=>k.startsWith(monthPrefix)).sort().forEach(dateKey=>{
          const dp=planning[dateKey]; if(!dp) return;
          ['matin','aprem'].forEach(slot=>{
            toSlotArr(dp[slot]).forEach(subSlot=>{
              if(!subSlot||!subSlot.vets||!subSlot.vets.length) return;
              const t=HORAIRE_TIMES[subSlot.horaire]||(slot==='matin'?{start:8.5,end:12}:{start:13.5,end:19});
              items.push({kind:'slot',dateKey,slot,horaire:subSlot.horaire,vetIds:subSlot.vets,start:t.start,end:t.end,nextDay:false});
            });
          });
        });
        if(inclAstr){
          Object.keys(astreintes||{}).filter(k=>k.startsWith(monthPrefix)).sort().forEach(dateKey=>{
            const a=astreintes[dateKey]||{};
            if(a.midi) items.push({kind:'astr',dateKey,label:'midi',vetIds:[a.midi],start:12,end:14,nextDay:false});
            if(a.soir) items.push({kind:'astr',dateKey,label:'soir',vetIds:[a.soir],start:19,end:8.5,nextDay:true});
          });
        }
        return items;
      };

      const itemTimes=it=>({
        start:{dateTime:`${it.dateKey}T${_fmtT(it.start)}`,timeZone:'Europe/Paris'},
        end:{dateTime:`${it.nextDay?_addDays(it.dateKey,1):it.dateKey}T${_fmtT(it.end)}`,timeZone:'Europe/Paris'},
      });

      // Mode « agenda commun » : un événement par créneau, tous les vétos invités
      const buildTeamEvents=()=>{
        const vetsById=Object.fromEntries(vets.map(v=>[v.id,v]));
        return collectAssignments().map(it=>{
          const names=it.vetIds.map(id=>vetsById[id]?.name||id).join(', ');
          const summary=it.kind==='astr'
            ? `📞 Astreinte ${it.label} – ${names}`
            : (it.slot==='matin'?'🌅 Matin ':'🌇 Après-midi ')+(HORAIRES[it.horaire]?.short||'')+' – '+names;
          return {
            summary, ...itemTimes(it),
            attendees:it.vetIds.map(id=>vetsById[id]?.email).filter(e=>e&&e.includes('@')).map(email=>({email})),
            extendedProperties:SYNC_PRIV,
            description:'Planning Sancéa Vet — synchronisé automatiquement depuis l\'outil de gestion.',
          };
        });
      };

      // Mode « chacun le sien » : événements individuels écrits dans l'agenda de chaque véto
      const buildPerVetEvents=()=>{
        const vetsById=Object.fromEntries(vets.map(v=>[v.id,v]));
        const byVet={};
        collectAssignments().forEach(it=>{
          it.vetIds.forEach(vid=>{
            const v=vetsById[vid]; if(!v||!v.email||!v.email.includes('@')) return;
            const others=it.vetIds.filter(id=>id!==vid).map(id=>vetsById[id]?.name||id);
            const summary=it.kind==='astr'
              ? `📞 Astreinte ${it.label} · Sancéa Vet`
              : (it.slot==='matin'?'🌅 Matin':'🌇 Après-midi')+' · Sancéa Vet';
            (byVet[vid]=byVet[vid]||[]).push({
              summary, ...itemTimes(it),
              extendedProperties:SYNC_PRIV,
              description:(others.length?`Avec : ${others.join(', ')}\n`:'')+'Planning Sancéa Vet — synchronisé automatiquement.',
            });
          });
        });
        return byVet;
      };

      // Supprime les événements créés par une synchro précédente sur un agenda donné
      const purgeCalendar=async(calendarId)=>{
        const mm=String(month+1).padStart(2,'0');
        const nY=month===11?year+1:year, nM=month===11?0:month+1;
        const timeMin=`${year}-${mm}-01T00:00:00Z`;
        const timeMax=`${nY}-${String(nM+1).padStart(2,'0')}-03T00:00:00Z`;
        const oldIds=[]; let pageToken;
        do {
          const res=await window.gapi.client.calendar.events.list({
            calendarId, privateExtendedProperty:'sanceavetSync=1',
            timeMin, timeMax, maxResults:2500, pageToken,
          });
          (res.result.items||[]).forEach(ev=>oldIds.push(ev.id));
          pageToken=res.result.nextPageToken;
        } while(pageToken);
        for(let i=0;i<oldIds.length;i++){
          try { await window.gapi.client.calendar.events.delete({calendarId, eventId:oldIds[i], sendUpdates:'none'}); }
          catch(e){ /* événement déjà supprimé côté Google */ }
          await sleep(60);
        }
        return oldIds.length;
      };

      const insertEvents=async(calendarId,events,sendUpdates,onProgress)=>{
        let done=0, failed=0;
        for(const ev of events){
          if(onProgress) onProgress(done+failed+1,events.length);
          try {
            await window.gapi.client.calendar.events.insert({calendarId, sendUpdates, resource:ev});
            done++;
          } catch(e){ failed++; console.error('Insertion échouée', e); }
          await sleep(120);
        }
        return {done,failed};
      };

      const runSync = async () => {
        try {
          setSyncState('loading'); setSyncMsg('Chargement des bibliothèques Google…');
          await ensureGoogleApis();

          setSyncState('auth'); setSyncMsg('Connexion au compte Google — validez la fenêtre qui s\'ouvre…');
          const tokenResp = await new Promise((resolve,reject)=>{
            try {
              const tc = window.google.accounts.oauth2.initTokenClient({
                client_id: gclientId.trim(),
                scope: 'https://www.googleapis.com/auth/calendar.events',
                callback: r => (r&&r.access_token) ? resolve(r) : reject(new Error(r&&r.error ? r.error : 'Autorisation refusée')),
                error_callback: e => reject(new Error(e&&e.message ? e.message : 'Fenêtre de connexion fermée ou bloquée')),
              });
              tc.requestAccessToken();
            } catch(e){ reject(e); }
          });
          window.gapi.client.setToken({access_token: tokenResp.access_token});
          setSyncState('sync');

          if(syncMode==='perVet'){
            // ── Chacun son agenda : écrit directement dans l'agenda de chaque véto
            const byVet=buildPerVetEvents();
            const vetIds=Object.keys(byVet);
            if(!vetIds.length){
              setSyncState('error');
              setSyncMsg('❌ Aucun événement à synchroniser pour '+MOIS[month]+' '+year+' — vérifiez le planning et les emails des vétos (onglet Équipe).');
              return;
            }
            const results=[]; let anyFail=false;
            for(const vid of vetIds){
              const v=vets.find(x=>x.id===vid);
              const events=byVet[vid];
              try {
                setSyncMsg(`${v.name} : remplacement des anciens événements…`);
                const purged=await purgeCalendar(v.email);
                const {done,failed}=await insertEvents(v.email,events,'none',
                  (i,n)=>setSyncMsg(`${v.name} : création des événements ${i}/${n}…`));
                if(failed){ anyFail=true; results.push(`⚠ ${v.name} : ${done}/${events.length} événement(s) créé(s)`); }
                else results.push(`✓ ${v.name} : ${done} événement(s)`+(purged?` (${purged} remplacé(s))`:''));
              } catch(e){
                anyFail=true;
                console.error('Agenda inaccessible pour', v.email, e);
                results.push(`✖ ${v.name} (${v.email}) : agenda inaccessible — le véto doit partager son agenda avec le compte connecté (droit « Apporter des modifications aux événements »)`);
              }
            }
            setSyncState(anyFail?'warn':'done');
            setSyncMsg((anyFail
              ? '⚠ Synchronisation terminée avec des avertissements :'
              : '✓ Synchronisation terminée — chaque véto ne voit que ses propres créneaux :')
              +'\n'+results.join('\n'));
          } else {
            // ── Agenda commun : un événement par créneau, vétos invités
            const calendarId=(calId||'primary').trim()||'primary';
            const events=buildTeamEvents();
            if(!events.length){ setSyncState('error'); setSyncMsg('❌ Aucun événement à synchroniser pour '+MOIS[month]+' '+year+'.'); return; }
            setSyncMsg('Remplacement des anciens événements Sancéa Vet…');
            const purged=await purgeCalendar(calendarId);
            const {done,failed}=await insertEvents(calendarId,events,sendInvites?'all':'none',
              (i,n)=>setSyncMsg(`Création des événements… ${i}/${n}`));
            if(failed){
              setSyncState('warn');
              setSyncMsg(`⚠ Synchronisation partielle : ${done} événement(s) créé(s), ${failed} échec(s) — voir la console.`);
            } else {
              setSyncState('done');
              setSyncMsg(`✓ ${done} événement(s) synchronisé(s) sur Google Calendar`+(purged?` (${purged} ancien(s) remplacé(s))`:'')+`. Chaque véto invité retrouve le planning dans son agenda.`);
            }
          }
        } catch(e){
          console.error(e);
          setSyncState('error');
          setSyncMsg('❌ '+((e&&e.result&&e.result.error&&e.result.error.message)||(e&&e.message)||'Erreur inconnue'));
        }
      };
      return(
        <div style={{maxWidth:720}}>
          <h2 className="section-title">Synchronisation Google Calendar</h2>
          <p className="section-desc">Publiez le planning (matin + après-midi) dans les agendas Google Workspace.</p>
          <div className={validated&&totalAlerts===0?'sync-ok':'sync-warn'} style={{marginBottom:20}}>
            {!hasP&&'⚠ Aucun planning généré.'}
            {hasP&&!validated&&'⚠ Planning non validé — cliquez sur "Valider" dans Planning.'}
            {hasP&&validated&&totalAlerts>0&&'⚠ Planning validé avec '+totalAlerts+' alerte(s).'}
            {hasP&&validated&&totalAlerts===0&&'✓ Planning validé — '+planDays+' jours planifiés, prêt à synchroniser.'}
          </div>
          <div className="g-card" style={{marginBottom:20}}>
            <h3 style={{fontSize:15,fontWeight:600,marginBottom:6,color:'#1f2937'}}>📥 Export .ics — Vétos</h3>
            <p style={{fontSize:13,color:'#6b7280',marginBottom:14}}>
              2 événements par jour (matin + après-midi) avec les horaires. Compatible Google Calendar, Outlook, Apple Calendar.
            </p>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              <button onClick={onExportICS} disabled={!hasP} className="btn-teal">
                ↓ Télécharger planning-{MOIS[month]}-{year}.ics
              </button>
              <button onClick={onExportCSV} disabled={!hasP} className="btn-outline" style={{borderColor:'#7c3aed',color:'#7c3aed'}}>
                ↓ Télécharger planning-{MOIS[month]}-{year}.csv
              </button>
            </div>
          </div>

          {/* ── Export ASV ─────────────────────────────────────── */}
          <div className="g-card" style={{marginBottom:20,border:'1.5px solid #99f6e4'}}>
            <h3 style={{fontSize:15,fontWeight:600,marginBottom:6,color:'#0d9488'}}>👩‍⚕️ Export planning ASV</h3>
            <p style={{fontSize:13,color:'#6b7280',marginBottom:14,lineHeight:1.6}}>
              Exportez le planning ASV pour le partager sur l'adresse commune ou l'afficher en salle de repos.<br/>
              <strong>.ics</strong> — à importer ou s'abonner dans Google Calendar / Outlook / Apple Calendar.<br/>
              <strong>Excel</strong> — une feuille par semaine, horaires lisibles (8h00-12h30 / 13h30-19h00).
            </p>
            {!hasASVP&&(
              <div style={{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:8,
                padding:'10px 14px',fontSize:13,color:'#92400e',marginBottom:12}}>
                ⚠️ Aucun planning ASV généré pour {MOIS[month]} {year} — rendez-vous dans l'onglet 👩‍⚕️ Planning ASV.
              </div>
            )}
            <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
              <button onClick={onExportASVICS} disabled={!hasASVP} className="btn-teal"
                style={{display:'flex',alignItems:'center',gap:7}}>
                📅 Télécharger planning-asv-{MOIS[month]}-{year}.ics
              </button>
              <button onClick={onExportASVXLSX} disabled={!hasASVP}
                className="btn-outline"
                style={{borderColor:'#16a34a',color:'#16a34a',display:'flex',alignItems:'center',gap:7}}>
                📊 Télécharger planning-asv-{MOIS[month]}-{year}.xlsx
              </button>
            </div>
            {hasASVP&&(
              <p style={{fontSize:11,color:'#9ca3af',marginTop:10,lineHeight:1.6}}>
                💡 Pour partager via Google Calendar : importez le <code style={{background:'#f1f5f9',padding:'1px 4px',borderRadius:3}}>.ics</code> dans un agenda partagé, 
                ou activez l'abonnement URL pour que l'équipe ASV reçoive les mises à jour automatiquement.
              </p>
            )}
          </div>

          <div className="g-card" style={{marginBottom:20,border:'1.5px solid #a5b4fc'}}>
            <h3 style={{fontSize:15,fontWeight:600,marginBottom:6,color:'#1f2937'}}>🔗 Synchronisation Google Calendar des vétos</h3>
            <p style={{fontSize:13,color:'#6b7280',marginBottom:14,lineHeight:1.6}}>
              Publie le planning de <strong>{MOIS[month]} {year}</strong> dans Google Calendar.
              Une nouvelle synchronisation remplace les événements créés précédemment (pas de doublons).
            </p>
            <div style={{marginBottom:14}}>
              <span className="g-label">Mode de synchronisation</span>
              <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:6,fontSize:13,color:'#374151'}}>
                <label style={{display:'flex',alignItems:'flex-start',gap:8,cursor:'pointer',lineHeight:1.5}}>
                  <input type="radio" name="syncMode" checked={syncMode==='perVet'} onChange={()=>setSyncMode('perVet')} disabled={busy} style={{marginTop:2}}/>
                  <span><strong>Agenda individuel — chacun le sien</strong> (recommandé) : chaque véto ne reçoit <strong>que ses propres créneaux</strong> directement dans son agenda Google, avec un titre court (ex. « 🌅 Matin · Sancéa Vet »). Les collègues du créneau sont indiqués dans la description.</span>
                </label>
                <label style={{display:'flex',alignItems:'flex-start',gap:8,cursor:'pointer',lineHeight:1.5}}>
                  <input type="radio" name="syncMode" checked={syncMode==='team'} onChange={()=>setSyncMode('team')} disabled={busy} style={{marginTop:2}}/>
                  <span><strong>Agenda commun</strong> : un événement par créneau dans l'agenda choisi ci-dessous, avec tous les vétos du créneau invités.</span>
                </label>
              </div>
            </div>
            <div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap'}}>
              <div style={{flex:'2 1 280px'}}>
                <span className="g-label">Client ID OAuth</span>
                <input value={gclientId} onChange={e=>setGclientId(e.target.value)}
                  placeholder="xxxx.apps.googleusercontent.com" className="g-input" style={{width:'100%'}}/>
              </div>
              {syncMode==='team'&&(
                <div style={{flex:'1 1 140px'}}>
                  <span className="g-label">ID agenda commun</span>
                  <input value={calId} onChange={e=>setCalId(e.target.value)} placeholder="primary"
                    className="g-input" style={{width:'100%'}}/>
                </div>
              )}
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:14,fontSize:13,color:'#374151'}}>
              {syncMode==='team'&&(
                <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
                  <input type="checkbox" checked={sendInvites} onChange={e=>setSendInvites(e.target.checked)} disabled={busy}/>
                  Envoyer les invitations par email aux vétérinaires (notification Google Calendar)
                </label>
              )}
              <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
                <input type="checkbox" checked={inclAstr} onChange={e=>setInclAstr(e.target.checked)} disabled={busy}/>
                Inclure les astreintes (midi 12h–14h, soir 19h–8h30 le lendemain)
              </label>
            </div>
            {syncMode==='perVet'&&(
              <div style={{background:'#f0f9ff',border:'1px solid #bae6fd',borderRadius:8,
                padding:'10px 14px',fontSize:13,color:'#075985',marginBottom:12,lineHeight:1.6}}>
                ℹ️ Les événements sont écrits <strong>directement dans l'agenda Google de chaque véto</strong> (identifié par son email de l'onglet Équipe).
                Prérequis : chaque véto doit partager son agenda avec le compte Google que vous connectez —
                Google Agenda → Paramètres → « Partager avec des personnes » → droit <strong>« Apporter des modifications aux événements »</strong>.
                Avec Google Workspace, l'administrateur peut activer ce partage pour tout le domaine.
              </div>
            )}
            {vetsSansEmail.length>0&&(
              <div style={{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:8,
                padding:'10px 14px',fontSize:13,color:'#92400e',marginBottom:12}}>
                ⚠️ Email manquant ou invalide pour : <strong>{vetsSansEmail.map(v=>v.name).join(', ')}</strong> —
                à renseigner dans l'onglet 👥 Équipe pour qu'ils reçoivent les invitations.
              </div>
            )}
            {hasP&&!validated&&(
              <div style={{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:8,
                padding:'10px 14px',fontSize:13,color:'#92400e',marginBottom:12}}>
                ⚠️ Le planning n'est pas encore validé — pensez à cliquer « Valider » dans l'onglet Planning avant de synchroniser.
              </div>
            )}
            <button disabled={!gclientId||!hasP||busy} className="btn-teal" onClick={runSync}>
              {busy?'⏳ Synchronisation en cours…':'🔗 Connecter & Synchroniser '+MOIS[month]+' '+year}
            </button>
            {syncMsg&&(
              <div style={{marginTop:12,padding:'10px 14px',borderRadius:8,fontSize:13,lineHeight:1.6,whiteSpace:'pre-line',
                background:syncState==='done'?'#f0fdf4':syncState==='error'?'#fef2f2':syncState==='warn'?'#fffbeb':'#f0f9ff',
                border:'1px solid '+(syncState==='done'?'#bbf7d0':syncState==='error'?'#fecaca':syncState==='warn'?'#fde68a':'#bae6fd'),
                color:syncState==='done'?'#166534':syncState==='error'?'#b91c1c':syncState==='warn'?'#92400e':'#075985'}}>
                {syncMsg}
              </div>
            )}
            <details style={{marginTop:14}}>
              <summary style={{fontSize:12,color:'#6b7280',cursor:'pointer',fontWeight:600}}>⚙️ Configuration requise (une seule fois, dans Google Cloud Console)</summary>
              <ol style={{fontSize:12,color:'#6b7280',lineHeight:1.8,margin:'8px 0 0 18px'}}>
                <li>Créez un projet sur <code style={{background:'#f1f5f9',padding:'1px 4px',borderRadius:3}}>console.cloud.google.com</code> et activez l'API <strong>Google Calendar</strong>.</li>
                <li>Créez un identifiant <strong>OAuth 2.0 – Application Web</strong> et ajoutez l'URL de ce site dans « Origines JavaScript autorisées ».</li>
                <li>Collez le Client ID ci-dessus — il est sauvegardé automatiquement.</li>
                <li>« ID agenda » : <code style={{background:'#f1f5f9',padding:'1px 4px',borderRadius:3}}>primary</code> pour votre agenda, ou l'ID d'un agenda partagé de la clinique (Paramètres de l'agenda → ID de l'agenda).</li>
              </ol>
            </details>
          </div>
          {/* FreePBX */}
          <div className="g-card" style={{marginBottom:20}}>
            <h3 style={{fontSize:15,fontWeight:600,marginBottom:6,color:'#1f2937'}}>📞 Export FreePBX (astreintes)</h3>
            <p style={{fontSize:13,color:'#6b7280',marginBottom:14,lineHeight:1.6}}>
              Génère un JSON de configuration de renvoi d'appel pour FreePBX.<br/>
              À connecter ultérieurement via l'API REST FreePBX / Asterisk AGI.
            </p>
            <FreePBXExport planning={planning} astreintes={astreintes} vets={vets} year={year} month={month}
              freepbxWebhook={freepbxWebhook} setFreepbxWebhook={setFreepbxWebhook}/>
          </div>

          <div className="sync-info">
            <strong style={{display:'block',marginBottom:6,color:'#0d9488'}}>💡 Fonctionnement</strong>
            <strong>Agenda individuel</strong> : chaque véto ne voit que ses propres créneaux et astreintes dans son agenda,
            avec des titres courts et lisibles ; ses collègues du créneau sont listés dans la description de l'événement.<br/>
            <strong>Agenda commun</strong> : chaque créneau (matin / après-midi) crée un événement d'équipe avec tous les vétos invités.
          </div>
        </div>
      );
    }

    // ─── Onglet Statistiques ───────────────────────────────────
    function StatsTab({vets,yearlyData,currentYear,currentMonth,currentPlanning,validated,setYearlyData,astreintes}){
      const [viewYear, setViewYear] = useState(currentYear);

      // Agrège les demi-journées par véto pour une année donnée
      const aggregate = useCallback((yr)=>{
        const months = yearlyData[yr] || {};
        const counts = Object.fromEntries(vets.map(v=>[v.id,{
          matin:0,aprem:0,
          matinH:{matin_A:0,matin_B:0},
          apremH:{aprem_A:0,aprem_B:0},
          astrDays:0,
          astrBlocsWEJF:0,
          days:new Set()
        }]));
        const dk_=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const yHols=getFrenchHolidays(parseInt(yr));

        Object.values(months).forEach(({planning:p, astreintes:a})=>{
          if(a){
            const sortedKeys=Object.keys(a).sort();
            sortedKeys.forEach(key=>{
              const {midi}=a[key];
              if(!midi||!counts[midi]) return;
              const [ky,km,kd]=key.split('-').map(Number);
              const dow2=new Date(ky,km-1,kd).getDay();
              const isHol2=yHols.has(key);
              const isClosed2=isWE(dow2)||isHol2;
              counts[midi].astrDays++;
              if(isClosed2){
                const prev=new Date(ky,km-1,kd-1);
                const prevKey=dk_(prev.getFullYear(),prev.getMonth(),prev.getDate());
                const prevDow=prev.getDay();
                const prevClosed=isWE(prevDow)||yHols.has(prevKey);
                if(!prevClosed) counts[midi].astrBlocsWEJF++;
              } else {
                const next=new Date(ky,km-1,kd+1);
                const nextKey=dk_(next.getFullYear(),next.getMonth(),next.getDate());
                const nextDow=next.getDay();
                const nextClosed=isWE(nextDow)||yHols.has(nextKey);
                if(nextClosed) counts[midi].astrBlocsWEJF++;
              }
            });
          }
          Object.entries(p||{}).forEach(([dk,dp])=>{
            if(!dp) return;
            ['matin','aprem'].forEach(slot=>{
              const slotArr=toSlotArr(dp[slot]);
              slotArr.forEach(subSlot=>{
                if(!subSlot||!subSlot.vets||!subSlot.vets.length) return;
                subSlot.vets.forEach(vid=>{
                  if(!counts[vid]) return;
                  counts[vid][slot]++;
                  counts[vid].days.add(dk);
                  if(slot==='matin'  && counts[vid].matinH[subSlot.horaire]!==undefined) counts[vid].matinH[subSlot.horaire]++;
                  if(slot==='aprem'  && counts[vid].apremH[subSlot.horaire]!==undefined) counts[vid].apremH[subSlot.horaire]++;
                });
              });
            });
          });
        });
        return counts;
      },[vets,yearlyData]);

      const data      = useMemo(()=>aggregate(viewYear),[aggregate,viewYear]);
      const months    = yearlyData[viewYear]||{};
      const hasMonths = Object.keys(months).length>0;
      const years     = [...new Set([...Object.keys(yearlyData).map(Number), currentYear])].sort((a,b)=>b-a);

      // Total équipe pour le graphique
      const maxTotal  = useMemo(()=>Math.max(1,...vets.map(v=>(data[v.id]?.matin||0)+(data[v.id]?.aprem||0))),[data,vets]);
      const totalDJ   = useMemo(()=>vets.reduce((s,v)=>s+(data[v.id]?.matin||0)+(data[v.id]?.aprem||0),0),[data,vets]);

      const removeMonth=(yr,mk)=>{
        setYearlyData(prev=>{
          const yr2={...prev[yr]};
          delete yr2[mk];
          return {...prev,[yr]:yr2};
        });
      };

      // ── Export des statistiques (CSV / Excel) ────────────────
      const monthsLabels=Object.entries(months).sort((a,b)=>+a[0]-+b[0]).map(([,m])=>m.label).join(', ');

      const buildStatsRows=()=>{
        const rows=[];
        rows.push(['Vétérinaire','Matins',`Matin ${HORAIRES.matin_A.short}`,`Matin ${HORAIRES.matin_B.short}`,
          'Après-midis',`Après-midi ${HORAIRES.aprem_A.short}`,`Après-midi ${HORAIRES.aprem_B.short}`,
          'Total demi-journées','Équiv. jours complets','Astreintes (jours)','Blocs WE/JF']);
        vets.forEach(v=>{
          const d=data[v.id]||{matin:0,aprem:0,matinH:{matin_A:0,matin_B:0},apremH:{aprem_A:0,aprem_B:0}};
          const total=d.matin+d.aprem;
          rows.push([v.name,d.matin,d.matinH.matin_A,d.matinH.matin_B,
            d.aprem,d.apremH.aprem_A,d.apremH.aprem_B,
            total,+(total/2).toFixed(1),d.astrDays||0,d.astrBlocsWEJF||0]);
        });
        const sum=f=>vets.reduce((s,v)=>s+f(data[v.id]||{}),0);
        rows.push(['Total équipe',sum(d=>d.matin||0),sum(d=>d.matinH?.matin_A||0),sum(d=>d.matinH?.matin_B||0),
          sum(d=>d.aprem||0),sum(d=>d.apremH?.aprem_A||0),sum(d=>d.apremH?.aprem_B||0),
          totalDJ,+(totalDJ/2).toFixed(1),sum(d=>d.astrDays||0),sum(d=>d.astrBlocsWEJF||0)]);
        return rows;
      };

      const exportStatsCSV=()=>{
        const rows=buildStatsRows();
        const esc=v=>{const s=v==null?'':String(v);return /;|\n|\r|"/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
        const csv='\ufeff'+[
          `Statistiques Sancéa Vet — ${viewYear}`,
          `Mois inclus;${esc(monthsLabels)}`,
          '',
          ...rows.map(r=>r.map(esc).join(';'))
        ].join('\r\n');
        const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download=`stats-vetos-${viewYear}.csv`;a.click();
        URL.revokeObjectURL(url);
      };

      const exportStatsXLSX=async()=>{
        let XL;
        try { XL=await ensureXLSX(); }
        catch(e){ alert('SheetJS non chargé – vérifiez votre connexion.'); return; }
        const rows=buildStatsRows();
        const aoa=[[`Statistiques annuelles Sancéa Vet — ${viewYear}`],[`Mois inclus : ${monthsLabels}`],[],...rows];
        const ws=XL.utils.aoa_to_sheet(aoa);
        ws['!cols']=[{wch:22},...rows[0].slice(1).map(()=>({wch:17}))];
        ws['!merges']=[
          {s:{r:0,c:0},e:{r:0,c:rows[0].length-1}},
          {s:{r:1,c:0},e:{r:1,c:rows[0].length-1}},
        ];
        const wb=XL.utils.book_new();
        XL.utils.book_append_sheet(wb,ws,`Stats ${viewYear}`);
        try {
          const out=XL.write(wb,{bookType:'xlsx',type:'array'});
          const blob=new Blob([out],{type:'application/octet-stream'});
          const url=URL.createObjectURL(blob);
          const a=document.createElement('a');
          a.href=url;a.download=`stats-vetos-${viewYear}.xlsx`;a.click();
          setTimeout(()=>URL.revokeObjectURL(url),200);
        } catch(e){
          console.error('Erreur export XLSX stats:',e);
          alert('❌ Erreur lors de l\'export Excel : '+e.message);
        }
      };

      return(
        <div style={{maxWidth:900}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12}}>
            <div>
              <h2 className="section-title">Statistiques annuelles</h2>
              <p className="section-desc">Compteur de demi-journées par vétérinaire, calculé sur les mois validés.</p>
            </div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <button onClick={exportStatsCSV} disabled={!hasMonths} className="btn-ghost"
                title="Export CSV (séparateur ;) — s'ouvre dans Excel / Google Sheets"
                style={{fontSize:12,padding:'6px 14px',color:'#7c3aed',borderColor:'#c4b5fd'}}>
                ⬇ Export CSV {viewYear}
              </button>
              <button onClick={exportStatsXLSX} disabled={!hasMonths} className="btn-teal"
                title="Export Excel — tableau complet avec totaux équipe"
                style={{fontSize:12,padding:'6px 14px'}}>
                📊 Export Excel {viewYear}
              </button>
            </div>
          </div>

          {/* Sélecteur année + mois validés */}
          <div style={{display:'flex',gap:12,alignItems:'flex-start',marginBottom:24,flexWrap:'wrap'}}>
            <div className="g-card" style={{flex:'0 0 auto',padding:'14px 20px'}}>
              <span className="g-label">Année</span>
              <div style={{display:'flex',gap:6,marginTop:4}}>
                {years.map(y=>(
                  <button key={y} onClick={()=>setViewYear(y)}
                    className={viewYear===y?'btn-teal':'btn-ghost'}
                    style={{padding:'5px 14px',fontSize:13}}>
                    {y}
                  </button>
                ))}
              </div>
            </div>

            <div className="g-card" style={{flex:'1 1 300px',padding:'14px 20px'}}>
              <span className="g-label">Mois validés pour {viewYear}</span>
              <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:4}}>
                {hasMonths ? Object.entries(months).sort((a,b)=>+a[0]-+b[0]).map(([mk,{label}])=>(
                  <span key={mk} style={{display:'inline-flex',alignItems:'center',gap:5,
                    background:'#f0fdf4',border:'1px solid #bbf7d0',color:'#166534',
                    borderRadius:20,padding:'3px 10px',fontSize:12,fontWeight:500}}>
                    ✓ {label}
                    <button onClick={()=>removeMonth(viewYear,mk)}
                      style={{background:'none',border:'none',cursor:'pointer',color:'#6b7280',fontSize:13,padding:0,lineHeight:1}}>×</button>
                  </span>
                )) : (
                  <span style={{fontSize:12,color:'#9ca3af'}}>
                    {validated&&currentYear===viewYear
                      ? 'Le mois en cours n\'est pas encore sauvegardé — cliquez Valider dans Planning'
                      : 'Aucun mois validé — validez un planning depuis l\'onglet Planning'}
                  </span>
                )}
              </div>
            </div>
          </div>

          {!hasMonths ? (
            <div style={{textAlign:'center',padding:'48px 0',color:'#9ca3af'}}>
              <div style={{fontSize:40,marginBottom:12}}>📋</div>
              <p style={{fontSize:14}}>Générez et validez un planning pour voir les statistiques.</p>
            </div>
          ) : (
            <>
              {/* Résumé global */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:12,marginBottom:24}}>
                <div className="g-card" style={{textAlign:'center',padding:'16px 12px'}}>
                  <div style={{fontSize:28,fontWeight:700,color:'#0d9488',fontFamily:"'Playfair Display',serif"}}>{totalDJ}</div>
                  <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>Demi-journées total</div>
                </div>
                <div className="g-card" style={{textAlign:'center',padding:'16px 12px'}}>
                  <div style={{fontSize:28,fontWeight:700,color:'#0d9488',fontFamily:"'Playfair Display',serif"}}>
                    {(totalDJ/2).toFixed(1)}
                  </div>
                  <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>Équiv. jours complets</div>
                </div>
                <div className="g-card" style={{textAlign:'center',padding:'16px 12px'}}>
                  <div style={{fontSize:28,fontWeight:700,color:'#0d9488',fontFamily:"'Playfair Display',serif"}}>{Object.keys(months).length}</div>
                  <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>Mois planifiés</div>
                </div>
                <div className="g-card" style={{textAlign:'center',padding:'16px 12px'}}>
                  <div style={{fontSize:28,fontWeight:700,color:'#0d9488',fontFamily:"'Playfair Display',serif"}}>
                    {vets.length ? (totalDJ/vets.length).toFixed(1) : 0}
                  </div>
                  <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>Moy. DJ / véto</div>
                </div>
              </div>

              {/* Tableau détaillé */}
              <div className="g-card" style={{marginBottom:20,padding:0,overflow:'hidden'}}>
                <div style={{padding:'16px 20px',borderBottom:'1px solid #f1f5f9'}}>
                  <h3 style={{fontSize:14,fontWeight:600,color:'#374151'}}>Détail par vétérinaire — {viewYear}</h3>
                </div>
                <div style={{overflowX:'auto'}}>
                  <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                    <thead>
                      <tr style={{background:'#f8fafc'}}>
                        <th style={{padding:'10px 20px',textAlign:'left',fontWeight:600,color:'#6b7280',fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',whiteSpace:'nowrap'}}>Vétérinaire</th>
                        <th style={{padding:'10px 12px',textAlign:'center',fontWeight:600,color:'#92400e',fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',background:'#fef9ec',whiteSpace:'nowrap'}}>🌅 Matins</th>
                        <th style={{padding:'10px 12px',textAlign:'center',fontWeight:600,color:'#92400e',fontSize:10,background:'#fef9ec',whiteSpace:'nowrap'}}>8h30–12h30</th>
                        <th style={{padding:'10px 12px',textAlign:'center',fontWeight:600,color:'#92400e',fontSize:10,background:'#fef9ec',whiteSpace:'nowrap'}}>8h30–11h30</th>
                        <th style={{padding:'10px 12px',textAlign:'center',fontWeight:600,color:'#4c1d95',fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',background:'#f5f3ff',whiteSpace:'nowrap'}}>🌇 Après-midis</th>
                        <th style={{padding:'10px 12px',textAlign:'center',fontWeight:600,color:'#4c1d95',fontSize:10,background:'#f5f3ff',whiteSpace:'nowrap'}}>13h–17h</th>
                        <th style={{padding:'10px 12px',textAlign:'center',fontWeight:600,color:'#4c1d95',fontSize:10,background:'#f5f3ff',whiteSpace:'nowrap'}}>14h30–18h30</th>
                        <th style={{padding:'10px 12px',textAlign:'center',fontWeight:600,color:'#374151',fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',whiteSpace:'nowrap'}}>Total DJ</th>
                        <th style={{padding:'10px 12px',textAlign:'center',fontWeight:600,color:'#374151',fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',whiteSpace:'nowrap'}}>Équiv. jours</th>
                        <th style={{padding:'10px 12px',textAlign:'center',fontWeight:600,color:'#7c3aed',fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',background:'#f5f3ff',whiteSpace:'nowrap'}}>🌙 Nuits semaine</th>
                        <th style={{padding:'10px 12px',textAlign:'center',fontWeight:600,color:'#b45309',fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',background:'#fef3c7',whiteSpace:'nowrap'}}>🗓 Blocs WE/JF</th>
                        <th style={{padding:'10px 20px',textAlign:'left',fontWeight:600,color:'#374151',fontSize:11,textTransform:'uppercase',letterSpacing:'.05em',whiteSpace:'nowrap'}}>Répartition</th>
                      </tr>
                    </thead>
                    <tbody>
                      {vets.map((v,i)=>{
                        const d=data[v.id]||{matin:0,aprem:0,matinH:{matin_A:0,matin_B:0},apremH:{aprem_A:0,aprem_B:0}};
                        const total=d.matin+d.aprem;
                        const pct=maxTotal>0?Math.round(total/maxTotal*100):0;
                        return(
                          <tr key={v.id} style={{borderTop:'1px solid #f1f5f9',background:i%2===0?'#fff':'#fafafa'}}>
                            <td style={{padding:'12px 20px'}}>
                              <div style={{display:'flex',alignItems:'center',gap:8}}>
                                <div style={{width:10,height:10,borderRadius:'50%',background:v.color,flexShrink:0}}/>
