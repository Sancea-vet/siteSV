                            <td style={{padding:'12px',textAlign:'center',background:'#fef9ec44',color:'#6b7280',fontSize:12}}>
                              {d.matinH.matin_A}
                            </td>
                            <td style={{padding:'12px',textAlign:'center',background:'#fef9ec44',color:'#6b7280',fontSize:12}}>
                              {d.matinH.matin_B}
                            </td>
                            <td style={{padding:'12px',textAlign:'center',background:'#f5f3ff44'}}>
                              <span style={{fontWeight:700,color:'#4c1d95',fontSize:15}}>{d.aprem}</span>
                            </td>
                            <td style={{padding:'12px',textAlign:'center',background:'#f5f3ff44',color:'#6b7280',fontSize:12}}>
                              {d.apremH.aprem_A}
                            </td>
                            <td style={{padding:'12px',textAlign:'center',background:'#f5f3ff44',color:'#6b7280',fontSize:12}}>
                              {d.apremH.aprem_B}
                            </td>
                            <td style={{padding:'12px',textAlign:'center'}}>
                              <span style={{fontWeight:700,color:'#1f2937',fontSize:16}}>{total}</span>
                            </td>
                            <td style={{padding:'12px',textAlign:'center'}}>
                              <span style={{fontWeight:600,color:'#0d9488'}}>{(total/2).toFixed(1)}</span>
                            </td>
                            <td style={{padding:'12px',textAlign:'center',background:'#f5f3ff44'}}>
                              <span style={{fontWeight:700,color:'#7c3aed',fontSize:15}}>{d.astrDays||0}</span>
                            </td>
                            <td style={{padding:'12px',textAlign:'center',background:'#fef3c744'}}>
                              <span style={{fontWeight:700,color:'#b45309',fontSize:15}}>{d.astrBlocsWEJF||0}</span>
                            </td>
                            <td style={{padding:'12px 20px'}}>
                              <div style={{display:'flex',gap:2,alignItems:'center'}}>
                                {/* Barre matin */}
                                <div style={{flex:d.matin||0,background:'#f59e0b',height:10,borderRadius:'4px 0 0 4px',minWidth:d.matin?4:0,transition:'flex .3s'}}/>
                                {/* Barre aprem */}
                                <div style={{flex:d.aprem||0,background:'#8b5cf6',height:10,borderRadius:'0 4px 4px 0',minWidth:d.aprem?4:0,transition:'flex .3s'}}/>
                                {/* Vide */}
                                <div style={{flex:Math.max(0,maxTotal-total),background:'#f1f5f9',height:10,borderRadius:4,minWidth:4}}/>
                                <span style={{fontSize:11,color:'#9ca3af',marginLeft:6,minWidth:30}}>{pct}%</span>
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                    <tfoot>
                      <tr style={{borderTop:'2px solid #e2e8f0',background:'#f8fafc'}}>
                        <td style={{padding:'10px 20px',fontWeight:700,color:'#374151',fontSize:13}}>Total équipe</td>
                        <td style={{padding:'10px 12px',textAlign:'center',fontWeight:700,color:'#92400e',background:'#fef9ec44'}}>
                          {vets.reduce((s,v)=>s+(data[v.id]?.matin||0),0)}
                        </td>
                        <td style={{padding:'10px 12px',textAlign:'center',color:'#6b7280',background:'#fef9ec44',fontSize:12}}>
                          {vets.reduce((s,v)=>s+(data[v.id]?.matinH?.matin_A||0),0)}
                        </td>
                        <td style={{padding:'10px 12px',textAlign:'center',color:'#6b7280',background:'#fef9ec44',fontSize:12}}>
                          {vets.reduce((s,v)=>s+(data[v.id]?.matinH?.matin_B||0),0)}
                        </td>
                        <td style={{padding:'10px 12px',textAlign:'center',fontWeight:700,color:'#4c1d95',background:'#f5f3ff44'}}>
                          {vets.reduce((s,v)=>s+(data[v.id]?.aprem||0),0)}
                        </td>
                        <td style={{padding:'10px 12px',textAlign:'center',color:'#6b7280',background:'#f5f3ff44',fontSize:12}}>
                          {vets.reduce((s,v)=>s+(data[v.id]?.apremH?.aprem_A||0),0)}
                        </td>
                        <td style={{padding:'10px 12px',textAlign:'center',color:'#6b7280',background:'#f5f3ff44',fontSize:12}}>
                          {vets.reduce((s,v)=>s+(data[v.id]?.apremH?.aprem_B||0),0)}
                        </td>
                        <td style={{padding:'10px 12px',textAlign:'center',fontWeight:700,color:'#1f2937',fontSize:15}}>{totalDJ}</td>
                        <td style={{padding:'10px 12px',textAlign:'center',fontWeight:700,color:'#0d9488'}}>{(totalDJ/2).toFixed(1)}</td>
                        <td style={{padding:'10px 12px',textAlign:'center',fontWeight:700,color:'#7c3aed',background:'#f5f3ff44'}}>
                          {vets.reduce((s,v)=>s+(data[v.id]?.astrDays||0),0)}
                        </td>
                        <td style={{padding:'10px 12px',textAlign:'center',fontWeight:700,color:'#b45309',background:'#fef3c744'}}>
                          {vets.reduce((s,v)=>s+(data[v.id]?.astrBlocsWEJF||0),0)}
                        </td>
                        <td style={{padding:'10px 20px'}}>
                          <div style={{display:'flex',gap:10,fontSize:11,color:'#6b7280',flexWrap:'wrap'}}>
                            <span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:10,height:10,background:'#f59e0b',borderRadius:2,display:'inline-block'}}/>Matin</span>
                            <span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:10,height:10,background:'#8b5cf6',borderRadius:2,display:'inline-block'}}/>Après-midi</span>
                            <span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:10,height:10,background:'#7c3aed',borderRadius:2,display:'inline-block'}}/>Nuits sem.</span>
                            <span style={{display:'flex',alignItems:'center',gap:4}}><span style={{width:10,height:10,background:'#b45309',borderRadius:2,display:'inline-block'}}/>Blocs WE/JF</span>
                          </div>
                        </td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>

              {/* Graphique barres horizontal */}
              <div className="g-card">
                <h3 style={{fontSize:14,fontWeight:600,color:'#374151',marginBottom:16}}>Comparaison de charge — {viewYear}</h3>
                <div style={{display:'flex',flexDirection:'column',gap:10}}>
                  {[...vets].sort((a,b)=>{
                    const ta=(data[a.id]?.matin||0)+(data[a.id]?.aprem||0);
                    const tb=(data[b.id]?.matin||0)+(data[b.id]?.aprem||0);
                    return tb-ta;
                  }).map(v=>{
                    const d=data[v.id]||{matin:0,aprem:0};
                    const total=d.matin+d.aprem;
                    const wMatin=maxTotal>0?d.matin/maxTotal*100:0;
                    const wAprem=maxTotal>0?d.aprem/maxTotal*100:0;
                    return(
                      <div key={v.id} style={{display:'flex',alignItems:'center',gap:12}}>
                        <div style={{width:110,fontSize:12,fontWeight:500,color:'#374151',textAlign:'right',flexShrink:0,display:'flex',alignItems:'center',gap:6,justifyContent:'flex-end'}}>
                          <div style={{width:8,height:8,borderRadius:'50%',background:v.color,flexShrink:0}}/>
                          {v.name.replace('Dr. ','')}
                        </div>
                        <div style={{flex:1,display:'flex',gap:2,height:22,borderRadius:6,overflow:'hidden',background:'#f1f5f9'}}>
                          <div style={{width:wMatin+'%',background:'#fbbf24',transition:'width .4s',display:'flex',alignItems:'center',justifyContent:'center',minWidth:wMatin>5?'auto':0}}>
                            {wMatin>8&&<span style={{fontSize:9,fontWeight:700,color:'#78350f'}}>{d.matin}</span>}
                          </div>
                          <div style={{width:wAprem+'%',background:'#a78bfa',transition:'width .4s',display:'flex',alignItems:'center',justifyContent:'center',minWidth:wAprem>5?'auto':0}}>
                            {wAprem>8&&<span style={{fontSize:9,fontWeight:700,color:'#3b0764'}}>{d.aprem}</span>}
                          </div>
                        </div>
                        <div style={{width:56,textAlign:'right',fontSize:12,fontWeight:700,color:'#1f2937',flexShrink:0}}>
                          {total} <span style={{fontSize:10,color:'#9ca3af',fontWeight:400}}>DJ</span>
                        </div>
                        <div style={{width:44,textAlign:'right',fontSize:11,color:'#0d9488',fontWeight:600,flexShrink:0}}>
                          {(total/2).toFixed(1)}<span style={{fontSize:9,color:'#9ca3af',fontWeight:400}}> j</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div style={{display:'flex',gap:16,marginTop:14,fontSize:11,color:'#6b7280'}}>
                  <span style={{display:'flex',alignItems:'center',gap:5}}><span style={{width:12,height:12,background:'#fbbf24',borderRadius:3,display:'inline-block'}}/>Matins</span>
                  <span style={{display:'flex',alignItems:'center',gap:5}}><span style={{width:12,height:12,background:'#a78bfa',borderRadius:3,display:'inline-block'}}/>Après-midis</span>
                  <span style={{marginLeft:'auto',color:'#9ca3af'}}>DJ = demi-journées</span>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }


    // ─── Composant export FreePBX ──────────────────────────────
    function FreePBXExport({planning,astreintes,vets,year,month,freepbxWebhook,setFreepbxWebhook}){
      const [copied,   setCopied]   = useState(false);
      const [kvStatus, setKvStatus] = useState(null); // null | 'loading' | 'ok' | 'error'
      const [kvMsg,    setKvMsg]    = useState('');
      const [n8nStatus,setN8nStatus]= useState(null);
      const [n8nMsg,   setN8nMsg]   = useState('');
      const [webhookInput, setWebhookInput] = useState(freepbxWebhook || '');

      const buildConfig = () => {
        const config = {
          generated: new Date().toISOString(),
          month: MOIS[month]+' '+year,
          routing: []
        };
        for(let d=1;d<=daysInMonth(year,month);d++){
          const key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const a=astreintes[key]||{};
          const mV=vets.find(v=>v.id===a.midi);
          const sV=vets.find(v=>v.id===a.soir);
          if(!mV&&!sV) continue;
          config.routing.push({
            date: key,
            midi: mV?{name:mV.name,phone:mV.phone||'',email:mV.email||''}:null,
            soir: sV?{name:sV.name,phone:sV.phone||'',email:sV.email||''}:null,
          });
        }
        return JSON.stringify(config, null, 2);
      };

      const hasAstr = Object.keys(astreintes).length > 0;
      const configStr = hasAstr ? buildConfig() : '';

      const copy=()=>{navigator.clipboard.writeText(configStr).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});};
      const download=()=>{
        const blob=new Blob([configStr],{type:'application/json'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download='freepbx-astreintes-'+MOIS[month]+'-'+year+'.json';a.click();
        URL.revokeObjectURL(url);
      };

      // ── Publish dans KV (/api/freepbx) ───────────────────────
      const publishKV = async () => {
        setKvStatus('loading'); setKvMsg('');
        try {
          const res = await fetch('/api/freepbx', {
            method: 'PUT',
            headers: {'Content-Type':'application/json'},
            body: configStr,
          });
          if(!res.ok) throw new Error(`HTTP ${res.status}`);
          setKvStatus('ok');
          setKvMsg('Publié · GET /api/freepbx accessible par FreePBX/AGI');
        } catch(e) {
          setKvStatus('error');
          setKvMsg(e.message);
        }
        setTimeout(()=>{setKvStatus(null);setKvMsg('');},6000);
      };

      // ── Push via n8n webhook ──────────────────────────────────
      const pushN8n = async () => {
        const url = webhookInput.trim();
        if(!url){setN8nStatus('error');setN8nMsg('URL webhook vide');setTimeout(()=>{setN8nStatus(null);setN8nMsg('');},4000);return;}
        // Persist l'URL
        if(setFreepbxWebhook) setFreepbxWebhook(url);
        setN8nStatus('loading'); setN8nMsg('');
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: configStr,
          });
          if(!res.ok) throw new Error(`HTTP ${res.status}`);
          setN8nStatus('ok');
          setN8nMsg('Reçu par n8n ✓ — vérifiez l\'exécution du workflow dans n8n');
        } catch(e) {
          setN8nStatus('error');
          setN8nMsg(e.message);
        }
        setTimeout(()=>{setN8nStatus(null);setN8nMsg('');},6000);
      };

      const statusStyle = (s) => ({
        marginTop:8, padding:'8px 12px', borderRadius:8, fontSize:12, fontWeight:500,
        background: s==='ok'?'#f0fdf4':s==='error'?'#fef2f2':'#f0fdfa',
        border: `1px solid ${s==='ok'?'#bbf7d0':s==='error'?'#fecaca':'#99f6e4'}`,
        color: s==='ok'?'#166534':s==='error'?'#dc2626':'#0d9488',
      });

      if(!hasAstr) return(
        <div style={{fontSize:13,color:'#9ca3af',fontStyle:'italic'}}>
          Générez les astreintes depuis l'onglet Planning (bouton 🌙 Astreintes) puis revenez ici.
        </div>
      );

      return(
        <div>
          {/* ── Télécharger / Copier ─────────────────────────── */}
          <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap'}}>
            <button onClick={download} className="btn-outline" style={{borderColor:'#7c3aed',color:'#7c3aed',borderRadius:50}}>
              ↓ freepbx-astreintes-{MOIS[month]}-{year}.json
            </button>
            <button onClick={copy} className="btn-ghost" style={{fontSize:12}}>
              {copied?'✓ Copié !':'Copier JSON'}
            </button>
          </div>
          <div className="code-block" style={{maxHeight:160,overflow:'auto',marginBottom:16}}>
            <pre>{configStr.slice(0,900)}{configStr.length>900?'\n…':''}</pre>
          </div>

          {/* ── Option 1 : Publish KV ────────────────────────── */}
          <div style={{background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:12,padding:'14px 16px',marginBottom:14}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <span style={{fontSize:13,fontWeight:700,color:'#374151'}}>📤 Option 1 — Publier dans KV</span>
              <span style={{fontSize:11,background:'#dbeafe',color:'#1d4ed8',borderRadius:6,padding:'1px 7px',fontWeight:600}}>endpoint GET public</span>
            </div>
            <p style={{fontSize:12,color:'#6b7280',marginBottom:10,lineHeight:1.6}}>
              Écrit le JSON dans <code style={{background:'#f1f5f9',padding:'1px 5px',borderRadius:3,color:'#374151'}}>/api/freepbx</code> (Cloudflare KV).<br/>
              FreePBX ou un script AGI/cron sur ton serveur récupère périodiquement via <strong>GET /api/freepbx</strong> et met à jour les renvois.
            </p>
            <button onClick={publishKV} disabled={kvStatus==='loading'} className="btn-teal"
              style={{background:'#1d4ed8',fontSize:13}}>
              {kvStatus==='loading'?'Publication…':'📤 Publier dans /api/freepbx'}
            </button>
            {kvStatus&&<div style={statusStyle(kvStatus)}>{kvStatus==='loading'?'⏳ En cours…':kvStatus==='ok'?'✓ ':kvStatus==='error'?'✗ ':''}{kvMsg}</div>}
            {kvStatus===null&&<p style={{fontSize:11,color:'#9ca3af',marginTop:6}}>
              Nécessite la route <code style={{fontSize:11}}>/api/freepbx</code> GET/PUT dans ton Cloudflare Worker (voir snippet ci-dessous).
            </p>}
          </div>

          {/* ── Option 2 : Push via n8n ──────────────────────── */}
          <div style={{background:'#fdf4ff',border:'1px solid #e9d5ff',borderRadius:12,padding:'14px 16px',marginBottom:14}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
              <span style={{fontSize:13,fontWeight:700,color:'#374151'}}>🔄 Option 2 — Push via n8n webhook</span>
              <span style={{fontSize:11,background:'#fae8ff',color:'#86198f',borderRadius:6,padding:'1px 7px',fontWeight:600}}>n8n → FreePBX REST</span>
            </div>
            <p style={{fontSize:12,color:'#6b7280',marginBottom:10,lineHeight:1.6}}>
              Envoie le JSON en POST à un webhook n8n. Ce dernier peut appeler l'API REST FreePBX,
              envoyer une notification, ou écrire dans Asterisk directement.
            </p>
            <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap',alignItems:'flex-end'}}>
              <div style={{flex:'1 1 300px'}}>
                <span className="g-label">URL webhook n8n</span>
                <input value={webhookInput} onChange={e=>setWebhookInput(e.target.value)}
                  placeholder="https://n8n.sanceavet.fr/webhook/freepbx-astreintes"
                  className="g-input" style={{width:'100%',fontFamily:'monospace',fontSize:12}}/>
              </div>
              <button onClick={pushN8n} disabled={n8nStatus==='loading'} className="btn-teal"
                style={{background:'#7c3aed',flexShrink:0,fontSize:13}}>
                {n8nStatus==='loading'?'Envoi…':'🔄 Push vers n8n'}
              </button>
            </div>
            {n8nStatus&&<div style={statusStyle(n8nStatus)}>{n8nStatus==='loading'?'⏳ En cours…':n8nStatus==='ok'?'✓ ':n8nStatus==='error'?'✗ ':''}{n8nMsg}</div>}
            {webhookInput&&!n8nStatus&&<p style={{fontSize:11,color:'#9ca3af',marginTop:4}}>
              URL sauvegardée automatiquement dans KV.
            </p>}
          </div>

          {/* ── Snippet Worker ───────────────────────────────── */}
          <details style={{marginTop:4}}>
            <summary style={{fontSize:12,color:'#7c3aed',cursor:'pointer',fontWeight:600,padding:'4px 0'}}>
              💡 Snippet Worker Cloudflare à ajouter pour l'Option 1
            </summary>
            <div className="code-block" style={{marginTop:8}}>
              <pre>{`// Dans ton Cloudflare Worker (après la gestion de /api/data)
if (url.pathname === '/api/freepbx') {
  if (request.method === 'OPTIONS') {
    return new Response(null, { headers: CORS });
  }
  if (request.method === 'GET') {
    const val = await env.PLANNING_KV.get('freepbx_config');
    if (!val) return new Response('{}', { headers: { 'Content-Type': 'application/json', ...CORS } });
    return new Response(val, { headers: { 'Content-Type': 'application/json', ...CORS } });
  }
  if (request.method === 'PUT') {
    const body = await request.text();
    await env.PLANNING_KV.put('freepbx_config', body);
    return new Response(JSON.stringify({ ok: true }), { headers: { 'Content-Type': 'application/json', ...CORS } });
  }
}`}</pre>
            </div>
            <p style={{fontSize:11,color:'#9ca3af',marginTop:6,lineHeight:1.6}}>
              Ensuite sur FreePBX, un script AGI ou cron appelle{' '}
              <code style={{fontSize:11}}>GET https://&lt;ton-domaine&gt;/api/freepbx</code>{' '}
              et met à jour les destinations de renvoi via la CLI Asterisk ou l'API REST FreePBX.
            </p>
          </details>

          <p style={{fontSize:11,color:'#9ca3af',marginTop:10,lineHeight:1.6}}>
            Format : <code style={{color:'#7c3aed',background:'#f5f3ff',padding:'1px 4px',borderRadius:3}}>routing[].date</code> +{' '}
            <code style={{color:'#7c3aed',background:'#f5f3ff',padding:'1px 4px',borderRadius:3}}>midi.phone</code> +{' '}
            <code style={{color:'#7c3aed',background:'#f5f3ff',padding:'1px 4px',borderRadius:3}}>soir.phone</code>
          </p>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(p){super(p);this.state={err:null};}
      static getDerivedStateFromError(e){return {err:e};}
      render(){
        if(this.state.err) return(
          <div style={{padding:40,fontFamily:"'Inter',sans-serif",textAlign:'center',maxWidth:600,margin:'80px auto'}}>
            <div style={{fontSize:48,marginBottom:16}}>⚠️</div>
            <h2 style={{color:'#dc2626',marginBottom:8}}>Erreur de rendu</h2>
            <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:12,padding:16,
              marginBottom:20,fontSize:13,color:'#991b1b',textAlign:'left',fontFamily:'monospace',wordBreak:'break-all'}}>
              {this.state.err.message}
            </div>
            <button onClick={()=>this.setState({err:null})}
              style={{padding:'10px 24px',background:'#0d9488',color:'#fff',border:'none',borderRadius:8,
                fontSize:14,fontWeight:600,cursor:'pointer'}}>
              Réessayer
            </button>
          </div>
        );
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('gestion-root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
