    // ─── Panel indisponibilités ASV ────────────────────────────
    function ASVIndispoPanel({asvs,year,month,numDays,asvUnavailRanges,setAsvUnavailRanges}){
      const [open, setOpen]=useState(false);
      const [asvId,setAsvId]=useState('');
      const [fromDate,setFromDate]=useState('');
      const [toDate,setToDate]=useState('');
      const [fromTime,setFromTime]=useState(0);
      const [toTime,setToTime]=useState(24);

      // Options 15min de 0h à 24h
      const timeOpts=[];
      for(let h=0;h<=24;h+=0.25) timeOpts.push(h);
      const fmtT = h=>{
        const hh=Math.floor(h), mm=Math.round((h-hh)*60);
        return `${String(hh).padStart(2,'0')}h${String(mm).padStart(2,'0')}`;
      };

      const monthStr=`${year}-${String(month+1).padStart(2,'0')}`;
      // Pad day number to YYYY-MM-DD
      const dayKey=(d)=>`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

      const doAdd=()=>{
        if(!asvId||!fromDate||!toDate) return;
        if(fromDate>toDate) return;
        if(fromDate===toDate&&fromTime>=toTime) return;
        setAsvUnavailRanges(prev=>[...prev,{
          id:uid(), asvId, fromDate, toDate,
          fromTime: +fromTime, toTime: +toTime
        }]);
        setFromDate(''); setToDate(''); setFromTime(0); setToTime(24);
      };
      const doRemove=(id)=>setAsvUnavailRanges(prev=>prev.filter(r=>r.id!==id));

      // Indispos dans ce mois ou chevauchant
      const visible=asvUnavailRanges.filter(r=>{
        const mStart=dayKey(1), mEnd=dayKey(numDays);
        return r.fromDate<=mEnd && r.toDate>=mStart;
      });

      return(
        <div className="g-card" style={{marginBottom:16}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:open?14:0}}>
            <h3 style={{fontSize:13,fontWeight:600,color:'#374151'}}>
              🚫 Indisponibilités ASV
              {visible.length>0&&<span style={{marginLeft:7,background:'#fef2f2',color:'#ef4444',
                border:'1px solid #fecaca',borderRadius:10,padding:'1px 7px',fontSize:11,fontWeight:700}}>
                {visible.length}
              </span>}
            </h3>
            <button onClick={()=>setOpen(v=>!v)} className="btn-ghost" style={{fontSize:12,padding:'5px 12px'}}>
              {open?'▲ Masquer':'▼ Afficher / Ajouter'}
            </button>
          </div>

          {open&&(
            <>
              {/* Formulaire ajout */}
              <div style={{background:'#f8fafc',borderRadius:10,padding:14,marginBottom:14,border:'1px solid #e2e8f0'}}>
                <p style={{fontSize:12,fontWeight:600,color:'#6b7280',marginBottom:10,textTransform:'uppercase',letterSpacing:'.05em'}}>
                  Ajouter une indisponibilité
                </p>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end'}}>
                  <div>
                    <span className="g-label">ASV</span>
                    <select value={asvId} onChange={e=>setAsvId(e.target.value)} className="g-input" style={{minWidth:130}}>
                      <option value=''>Choisir…</option>
                      {asvs.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <span className="g-label">Date début</span>
                    <input type="date" value={fromDate} onChange={e=>setFromDate(e.target.value)}
                      className="g-input" style={{width:145}}
                      min={`${year}-01-01`} max={`${year+1}-12-31`}/>
                  </div>
                  <div>
                    <span className="g-label">Heure début (15min)</span>
                    <select value={fromTime} onChange={e=>setFromTime(+e.target.value)} className="g-input">
                      {timeOpts.filter(h=>h<24).map(h=><option key={h} value={h}>{fmtT(h)}</option>)}
                    </select>
                  </div>
                  <div>
                    <span className="g-label">Date fin</span>
                    <input type="date" value={toDate} onChange={e=>setToDate(e.target.value)}
                      className="g-input" style={{width:145}}
                      min={fromDate||`${year}-01-01`} max={`${year+1}-12-31`}/>
                  </div>
                  <div>
                    <span className="g-label">Heure fin (15min)</span>
                    <select value={toTime} onChange={e=>setToTime(+e.target.value)} className="g-input">
                      {timeOpts.filter(h=>h>0).map(h=><option key={h} value={h}>{fmtT(h)}</option>)}
                    </select>
                  </div>
                  <button onClick={doAdd} className="btn-teal"
                    disabled={!asvId||!fromDate||!toDate||fromDate>toDate||(fromDate===toDate&&+fromTime>=+toTime)}>
                    Ajouter
                  </button>
                </div>
                <p style={{fontSize:11,color:'#9ca3af',marginTop:8}}>
                  💡 Granularité 15 min · Peut s'étendre sur plusieurs jours · L'ASV est automatiquement exclue lors de la génération
                </p>
              </div>

              {/* Liste indispos */}
              {visible.length===0?(
                <p style={{fontSize:13,color:'#9ca3af',fontStyle:'italic'}}>Aucune indisponibilité pour ce mois.</p>
              ):(
                <div style={{display:'flex',flexDirection:'column',gap:6}}>
                  {visible.map(r=>{
                    const a=asvs.find(x=>x.id===r.asvId);
                    const singleDay=r.fromDate===r.toDate;
                    return(
                      <div key={r.id} style={{display:'flex',alignItems:'center',gap:10,
                        padding:'8px 14px',background:'#fff',border:'1.5px solid #e2e8f0',
                        borderRadius:10,borderLeft:'4px solid '+(a?.color||'#e2e8f0')}}>
                        <div style={{width:10,height:10,borderRadius:'50%',background:a?.color||'#ccc',flexShrink:0}}/>
                        <span style={{fontWeight:600,color:'#1f2937',fontSize:13,minWidth:70}}>{a?.name||'?'}</span>
                        <span style={{fontSize:12,color:'#6b7280',flex:1}}>
                          {singleDay?(
                            <>{r.fromDate} · {fmtT(r.fromTime)} → {fmtT(r.toTime)}</>
                          ):(
                            <>{r.fromDate} {fmtT(r.fromTime)} → {r.toDate} {fmtT(r.toTime)}</>
                          )}
                        </span>
                        <button onClick={()=>doRemove(r.id)} className="btn-danger-soft">✕</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    // ─── Onglet Règles ─────────────────────────────────────────
    function ReglesTab({rules,setRules,vets,openDays,setOpenDays}){
      const [rType,        setRType]        = useState('min_per_slot');
      const [slot,         setSlot]         = useState('matin');
      const [dType,        setDType]        = useState('weekday');
      const [parity,       setParity]       = useState('all');
      const [minN,         setMinN]         = useState(2);
      const [vetId,        setVetId]        = useState('');
      const [dow,          setDow]          = useState(1);
      const [horaire,      setHoraire]      = useState('matin_A');
      const [fixedDayRule, setFixedDayRule] = useState(false);

      const JOURS_FR=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

      const addRule=()=>{
        const base={id:uid(),type:rType,slot,dayType:dType,weekParity:parity};
        if(rType==='min_per_slot') setRules(prev=>{
          const exists=prev.find(r=>r.type==='min_per_slot'&&r.slot===slot&&r.dayType===dType&&r.weekParity===parity);
          return exists?prev.map(r=>r===exists?{...r,min:minN}:r):[...prev,{...base,min:minN}];
        });
        else if(rType==='horaire_rule') setRules(prev=>{
          const rule = fixedDayRule
            ? {...base, dayType:'all', weekParity:'all', dayOfWeek:+dow, horaire}
            : {...base, horaire};
          const exists = prev.find(r =>
            r.type==='horaire_rule' &&
            r.slot===slot &&
            (fixedDayRule ? r.dayOfWeek === +dow : r.dayType===dType && r.weekParity===parity)
          );
          return exists ? prev.map(r => r===exists ? rule : r) : [...prev, rule];
        });
        else if(rType==='vet_slot_rule' && vetId) setRules(prev=>{
          const rule = fixedDayRule
            ? {...base, dayType:'all', weekParity:'all', dayOfWeek:+dow, horaire, vetId}
            : {...base, horaire, vetId};
          const exists = prev.find(r =>
            r.type==='vet_slot_rule' &&
            r.slot===slot &&
            r.vetId===vetId &&
            r.horaire===horaire &&
            (fixedDayRule ? r.dayOfWeek === +dow : r.dayType===dType && r.weekParity===parity)
          );
          return exists ? prev.map(r => r===exists ? rule : r) : [...prev, rule];
        });
        else if(rType==='never_slot'&&vetId) setRules(prev=>{
          if(prev.some(r=>r.type==='never_slot'&&r.vetId===vetId&&r.slot===slot&&r.dayOfWeek===+dow&&r.weekParity===parity)) return prev;
          return [...prev,{...base,vetId,dayOfWeek:+dow}];
        });
      };

      const pLabel=p=>p==='even'?'Paire':p==='odd'?'Impaire':'Toutes';
      const sLabel=s=>s==='matin'?'Matin':s==='aprem'?'Après-midi':'Tous';
      const labelOf=r=>{
        const pl=<span className={'parity-badge '+(r.weekParity==='even'?'parity-even':r.weekParity==='odd'?'parity-odd':'parity-all')} style={{margin:'0 3px'}}>{pLabel(r.weekParity)}</span>;
        const sl=<span className={'slot-badge '+(r.slot==='matin'?'slot-matin':r.slot==='aprem'?'slot-aprem':'slot-all')} style={{margin:'0 3px'}}>{sLabel(r.slot)}</span>;
        if(r.type==='min_per_slot') return <span>📊 Min. {r.min} véto(s) — {sl} — S. {pl}</span>;
        if(r.type==='horaire_rule'){
          const h=HORAIRES[r.horaire];
          const fixedDay = r.dayOfWeek !== undefined ? <span style={{margin:'0 3px'}}>Jour fixe {JS_FULL[r.dayOfWeek]}</span> : pl;
          return <span>🕐 {sl} → {h?h.label:'?'} — {r.dayOfWeek !== undefined ? fixedDay : <>S. {pl}</>}</span>;
        }
        if(r.type==='vet_slot_rule'){
          const h=HORAIRES[r.horaire];
          const vetName = vets.find(v=>v.id===r.vetId)?.name || 'Vétérinaire';
          const fixedDay = r.dayOfWeek !== undefined ? <span style={{margin:'0 3px'}}>Jour fixe {JS_FULL[r.dayOfWeek]}</span> : pl;
          return <span>👩‍⚕️ {vetName} — {sl} → {h?h.label:'?'} — {r.dayOfWeek !== undefined ? fixedDay : <>S. {pl}</>}</span>;
        }
        if(r.type==='never_slot'){
          const vetName = vets.find(v=>v.id===r.vetId)?.name || 'Vétérinaire';
          const dayLabel = r.dayOfWeek !== undefined ? ` ${JS_FULL[r.dayOfWeek]}` : '';
          return <span>🚫 {vetName} — {sl} —{dayLabel} — S. {pl}</span>;
        }
        return <span>{r.type}</span>;
      };

      const byType=(t)=>rules.filter(r=>r.type===t);

      return(
        <div style={{maxWidth:740}}>
          <h2 className="section-title">Règles & Contraintes</h2>
          <p className="section-desc">Règles par créneau (matin/après-midi) et par parité de semaine.</p>

          {/* Jours ouverture */}

    // ─── Onglet Sync ───────────────────────────────────────────
    function SyncTab({validated,totalAlerts,planning,vets,year,month,gclientId,setGclientId,calId,setCalId,onExportICS,astreintes}){
      const [copied, setCopied] = useState(false);
      const planDays=Object.keys(planning).filter(k=>planning[k]).length;
      const hasP=planDays>0;
      const s1='<'+'script src="https://accounts.google.com/gsi/client"><'+'/script>';
      const s2='<'+'script src="https://apis.google.com/js/api.js"><'+'/script>';
      const code=s1+'\n'+s2+'\n\nconst GC_CONFIG = {\n  clientId:   "'+(gclientId||'VOTRE_CLIENT_ID.apps.googleusercontent.com')+'",\n  calendarId: "'+(calId||'primary')+'",\n};\n\nfunction connectGoogle() {\n  google.accounts.oauth2.initTokenClient({\n    client_id: GC_CONFIG.clientId,\n    scope: "https://www.googleapis.com/auth/calendar.events",\n    callback: token => { gapi.client.setToken(token); syncPlanning(); },\n  }).requestAccessToken();\n}\n\nasync function syncPlanning() {\n  await gapi.client.load("calendar","v3");\n  for (const [date, dp] of Object.entries(planningData)) {\n    for (const slot of ["matin","aprem"]) {\n      const s = dp[slot]; if (!s||!s.vets.length) continue;\n      const names  = s.vets.map(id => vetsById[id].name).join(", ");\n      const emails = s.vets.map(id => vetsById[id].email).filter(Boolean);\n      await gapi.client.calendar.events.insert({\n        calendarId: GC_CONFIG.calendarId,\n        resource: {\n          summary:   (slot==="matin"?"Matin ":"Après-midi ") + horaires[s.horaire] + " – " + names,\n          start:     { date },\n          end:       { date },\n          attendees: emails.map(email => ({ email })),\n        },\n      });\n    }\n  }\n}';
      const copy=()=>{navigator.clipboard.writeText(code).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});};
      return(
        <div style={{maxWidth:720}}>
          <h2 className="section-title">Synchronisation Google Calendar</h2>
          <p className="section-desc">Publiez le planning (matin + après-midi) dans les agendas Google Workspace.</p>
          <div className={validated&&totalAlerts===0?'sync-ok':'sync-warn'} style={{marginBottom:20}}>
            {!hasP&&'⚠ Aucun planning généré.'}
            {hasP&&!validated&&'⚠ Planning non validé — cliquez sur "Valider" dans Planning.'}
            {hasP&&validated&&totalAlerts>0&&'⚠ Planning validé avec '+totalAlerts+' alerte(s).'}
            {hasP&&validated&&totalAlerts===0&&'✓ Planning validé — '+planDays+' jours planifiés, prêt à synchroniser.'}
          </div>
          <div className="g-card" style={{marginBottom:20}}>
            <h3 style={{fontSize:15,fontWeight:600,marginBottom:6,color:'#1f2937'}}>📥 Export .ics</h3>
            <p style={{fontSize:13,color:'#6b7280',marginBottom:14}}>
              2 événements par jour (matin + après-midi) avec les horaires. Compatible Google Calendar, Outlook, Apple Calendar.
            </p>
            <button onClick={onExportICS} disabled={!hasP} className="btn-teal">
              ↓ Télécharger planning-{MOIS[month]}-{year}.ics
            </button>
          </div>
          <div className="g-card" style={{marginBottom:20}}>
            <h3 style={{fontSize:15,fontWeight:600,marginBottom:14,color:'#1f2937'}}>🔗 Google Calendar API</h3>
            <div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap'}}>
              <div style={{flex:'2 1 280px'}}>
                <span className="g-label">Client ID OAuth</span>
                <input value={gclientId} onChange={e=>setGclientId(e.target.value)}
                  placeholder="xxxx.apps.googleusercontent.com" className="g-input" style={{width:'100%'}}/>
              </div>
              <div style={{flex:'1 1 140px'}}>
                <span className="g-label">ID agenda</span>
                <input value={calId} onChange={e=>setCalId(e.target.value)} placeholder="primary"
                  className="g-input" style={{width:'100%'}}/>
              </div>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <span style={{fontSize:11,color:'#6b7280',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em'}}>Code d'intégration</span>
              <button onClick={copy} className="btn-ghost" style={{padding:'4px 12px',fontSize:11}}>{copied?'✓ Copié !':'Copier'}</button>
            </div>
            <div className="code-block" style={{marginBottom:14}}><pre>{code}</pre></div>
            <button disabled={!gclientId||!validated} className="btn-teal"
              onClick={()=>alert('Déployez avec le Client ID configuré dans Google Cloud Console.')}>
              🔗 Connecter & Synchroniser
            </button>
          </div>
          {/* FreePBX */}
          <div className="g-card" style={{marginBottom:20}}>
            <h3 style={{fontSize:15,fontWeight:600,marginBottom:6,color:'#1f2937'}}>📞 Export FreePBX (astreintes)</h3>
            <p style={{fontSize:13,color:'#6b7280',marginBottom:14,lineHeight:1.6}}>
              Génère un JSON de configuration de renvoi d'appel pour FreePBX.<br/>
              À connecter ultérieurement via l'API REST FreePBX / Asterisk AGI.
            </p>
            <FreePBXExport planning={planning} astreintes={astreintes} vets={vets} year={year} month={month}/>
          </div>

          <div className="sync-info">
            <strong style={{display:'block',marginBottom:6,color:'#0d9488'}}>💡 Fonctionnement</strong>
            Chaque jour génère <strong>2 événements</strong> dans Google Calendar (matin + après-midi) avec l'horaire exact.
            Chaque véto assigné reçoit une invitation dans son agenda Google Workspace.
          </div>
        </div>
      );
    }

    // ─── Onglet Statistiques ───────────────────────────────────
    function StatsTab({vets,yearlyData,currentYear,currentMonth,currentPlanning,validated,setYearlyData,astreintes}){
      const [viewYear, setViewYear] = useState(currentYear);

      // Agrège les demi-journées par véto pour une année donnée
      const aggregate = useCallback((yr)=>{
        const months = yearlyData[yr] || {};
        const counts = Object.fromEntries(vets.map(v=>[v.id,{
          matin:0,aprem:0,
          matinH:{matin_A:0,matin_B:0},
          apremH:{aprem_A:0,aprem_B:0},
          astrDays:0,
          astrBlocsWEJF:0,
          days:new Set()
        }]));
        const dk_=(y,m,d)=>`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const yHols=getFrenchHolidays(parseInt(yr));

        Object.values(months).forEach(({planning:p, astreintes:a})=>{
          if(a){
            const sortedKeys=Object.keys(a).sort();
            sortedKeys.forEach(key=>{
              const {midi}=a[key];
              if(!midi||!counts[midi]) return;
              const [ky,km,kd]=key.split('-').map(Number);
              const dow2=new Date(ky,km-1,kd).getDay();
              const isHol2=yHols.has(key);
              const isClosed2=isWE(dow2)||isHol2;
              counts[midi].astrDays++;
              if(isClosed2){
                const prev=new Date(ky,km-1,kd-1);
                const prevKey=dk_(prev.getFullYear(),prev.getMonth(),prev.getDate());
                const prevDow=prev.getDay();
                const prevClosed=isWE(prevDow)||yHols.has(prevKey);
                if(!prevClosed) counts[midi].astrBlocsWEJF++;
              } else {
                const next=new Date(ky,km-1,kd+1);
                const nextKey=dk_(next.getFullYear(),next.getMonth(),next.getDate());
                const nextDow=next.getDay();
                const nextClosed=isWE(nextDow)||yHols.has(nextKey);
                if(nextClosed) counts[midi].astrBlocsWEJF++;
              }
            });
          }
          Object.entries(p||{}).forEach(([dk,dp])=>{
            if(!dp) return;
            ['matin','aprem'].forEach(slot=>{
              const slotArr=toSlotArr(dp[slot]);
              slotArr.forEach(subSlot=>{
                if(!subSlot||!subSlot.vets||!subSlot.vets.length) return;
                subSlot.vets.forEach(vid=>{
                  if(!counts[vid]) return;
                  counts[vid][slot]++;
                  counts[vid].days.add(dk);
                  if(slot==='matin'  && counts[vid].matinH[subSlot.horaire]!==undefined) counts[vid].matinH[subSlot.horaire]++;
                  if(slot==='aprem'  && counts[vid].apremH[subSlot.horaire]!==undefined) counts[vid].apremH[subSlot.horaire]++;
                });
              });
            });
          });
        });
        return counts;
      },[vets,yearlyData]);

      const data      = useMemo(()=>aggregate(viewYear),[aggregate,viewYear]);
      const months    = yearlyData[viewYear]||{};
      const hasMonths = Object.keys(months).length>0;
      const years     = [...new Set([...Object.keys(yearlyData).map(Number), currentYear])].sort((a,b)=>b-a);

      // Total équipe pour le graphique
      const maxTotal  = useMemo(()=>Math.max(1,...vets.map(v=>(data[v.id]?.matin||0)+(data[v.id]?.aprem||0))),[data,vets]);
      const totalDJ   = useMemo(()=>vets.reduce((s,v)=>s+(data[v.id]?.matin||0)+(data[v.id]?.aprem||0),0),[data,vets]);

      const removeMonth=(yr,mk)=>{
        setYearlyData(prev=>{
          const yr2={...prev[yr]};
          delete yr2[mk];
          return {...prev,[yr]:yr2};
        });
      };

      return(
        <div style={{maxWidth:900}}>
          <h2 className="section-title">Statistiques annuelles</h2>
          <p className="section-desc">Compteur de demi-journées par vétérinaire, calculé sur les mois validés.</p>

          {/* Sélecteur année + mois validés */}
          <div style={{display:'flex',gap:12,alignItems:'flex-start',marginBottom:24,flexWrap:'wrap'}}>
            <div className="g-card" style={{flex:'0 0 auto',padding:'14px 20px'}}>
              <span className="g-label">Année</span>
              <div style={{display:'flex',gap:6,marginTop:4}}>
                {years.map(y=>(
                  <button key={y} onClick={()=>setViewYear(y)}
                    className={viewYear===y?'btn-teal':'btn-ghost'}
                    style={{padding:'5px 14px',fontSize:13}}>
                    {y}
                  </button>
                ))}
              </div>
            </div>

            <div className="g-card" style={{flex:'1 1 300px',padding:'14px 20px'}}>
              <span className="g-label">Mois validés pour {viewYear}</span>
              <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:4}}>
                {hasMonths ? Object.entries(months).sort((a,b)=>+a[0]-+b[0]).map(([mk,{label}])=>(
                  <span key={mk} style={{display:'inline-flex',alignItems:'center',gap:5,
                    background:'#f0fdf4',border:'1px solid #bbf7d0',color:'#166534',
                    borderRadius:20,padding:'3px 10px',fontSize:12,fontWeight:500}}>
                    ✓ {label}
                    <button onClick={()=>removeMonth(viewYear,mk)}
                      style={{background:'none',border:'none',cursor:'pointer',color:'#6b7280',fontSize:13,padding:0,lineHeight:1}}>×</button>
                  </span>
                )) : (
                  <span style={{fontSize:12,color:'#9ca3af'}}>
                    {validated&&currentYear===viewYear
                      ? 'Le mois en cours n\'est pas encore sauvegardé — cliquez Valider dans Planning'
                      : 'Aucun mois validé — validez un planning depuis l\'onglet Planning'}
                  </span>
                )}
              </div>
            </div>
          </div>

          {!hasMonths ? (
            <div style={{textAlign:'center',padding:'48px 0',color:'#9ca3af'}}>
              <div style={{fontSize:40,marginBottom:12}}>📋</div>
              <p style={{fontSize:14}}>Générez et validez un planning pour voir les statistiques.</p>
            </div>
          ) : (
            <>
              {/* Résumé global */}
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:12,marginBottom:24}}>
                <div className="g-card" style={{textAlign:'center',padding:'16px 12px'}}>
                  <div style={{fontSize:28,fontWeight:700,color:'#0d9488',fontFamily:"'Playfair Display',serif"}}>{totalDJ}</div>
                  <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>Demi-journées total</div>
                </div>
                <div className="g-card" style={{textAlign:'center',padding:'16px 12px'}}>
                  <div style={{fontSize:28,fontWeight:700,color:'#0d9488',fontFamily:"'Playfair Display',serif"}}>
                    {(totalDJ/2).toFixed(1)}
                  </div>
                  <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>Équiv. jours complets</div>
                </div>
                <div className="g-card" style={{textAlign:'center',padding:'16px 12px'}}>
                  <div style={{fontSize:28,fontWeight:700,color:'#0d9488',fontFamily:"'Playfair Display',serif"}}>{Object.keys(months).length}</div>
                  <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>Mois planifiés</div>
                </div>
                <div className="g-card" style={{textAlign:'center',padding:'16px 12px'}}>
                  <div style={{fontSize:28,fontWeight:700,color:'#0d9488',fontFamily:"'Playfair Display',serif"}}>
                    {vets.length ? (totalDJ/vets.length).toFixed(1) : 0}
                  </div>
                  <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>Moy. DJ / véto</div>
                </div>
              </div>

    // ─── Composant export FreePBX ──────────────────────────────
    function FreePBXExport({planning,astreintes,vets,year,month}){
      const [copied,setCopied] = useState(false);

      const buildConfig = () => {
        // Construit un tableau jour par jour des renvois d'appel
        const config = {
          generated: new Date().toISOString(),
          month: MOIS[month]+' '+year,
          routing: []
        };
        for(let d=1;d<=daysInMonth(year,month);d++){
          const key=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
          const a=astreintes[key]||{};
          const mV=vets.find(v=>v.id===a.midi);
          const sV=vets.find(v=>v.id===a.soir);
          if(!mV&&!sV) continue;
          config.routing.push({
            date: key,
            midi: mV?{name:mV.name,phone:mV.phone||'',email:mV.email}:null,
            soir: sV?{name:sV.name,phone:sV.phone||'',email:sV.email}:null,
          });
        }
        return JSON.stringify(config, null, 2);
      };

      const hasAstr = Object.keys(astreintes).length > 0;
      const configStr = hasAstr ? buildConfig() : '';

      const copy=()=>{navigator.clipboard.writeText(configStr).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});};
      const download=()=>{
        const blob=new Blob([configStr],{type:'application/json'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download='freepbx-astreintes-'+MOIS[month]+'-'+year+'.json';a.click();
        URL.revokeObjectURL(url);
      };

      if(!hasAstr) return(
        <div style={{fontSize:13,color:'#9ca3af',fontStyle:'italic'}}>
          Générez les astreintes depuis l'onglet Planning (bouton 🌙 Astreintes) puis revenez ici.
        </div>
      );

      return(
        <div>
          <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
            <button onClick={download} className="btn-outline" style={{borderColor:'#7c3aed',color:'#7c3aed',borderRadius:50}}>
              ↓ freepbx-astreintes-{MOIS[month]}-{year}.json
            </button>
            <button onClick={copy} className="btn-ghost" style={{fontSize:12}}>
              {copied?'✓ Copié !':'Copier JSON'}
            </button>
          </div>
          <div className="code-block" style={{maxHeight:220,overflow:'auto'}}>
            <pre>{configStr.slice(0,1200)}{configStr.length>1200?'\n…':''}
            </pre>
          </div>
          <p style={{fontSize:11,color:'#9ca3af',marginTop:8,lineHeight:1.6}}>
            Format : <code style={{color:'#7c3aed',background:'#f5f3ff',padding:'1px 4px',borderRadius:3}}>routing[].date</code> + 
            <code style={{color:'#7c3aed',background:'#f5f3ff',padding:'1px 4px',borderRadius:3}}> midi.phone</code> + 
            <code style={{color:'#7c3aed',background:'#f5f3ff',padding:'1px 4px',borderRadius:3}}> soir.phone</code> → 
            à injecter via l'API REST FreePBX ou un script Asterisk AGI pour gérer le renvoi automatique.
          </p>
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(p){super(p);this.state={err:null};}
      static getDerivedStateFromError(e){return {err:e};}
      render(){
        if(this.state.err) return(
          <div style={{padding:40,fontFamily:"'Inter',sans-serif",textAlign:'center',maxWidth:600,margin:'80px auto'}}>
            <div style={{fontSize:48,marginBottom:16}}>⚠️</div>
            <h2 style={{color:'#dc2626',marginBottom:8}}>Erreur de rendu</h2>
            <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:12,padding:16,
              marginBottom:20,fontSize:13,color:'#991b1b',textAlign:'left',fontFamily:'monospace',wordBreak:'break-all'}}>
              {this.state.err.message}
            </div>
            <button onClick={()=>this.setState({err:null})}
              style={{padding:'10px 24px',background:'#0d9488',color:'#fff',border:'none',borderRadius:8,
                fontSize:14,fontWeight:600,cursor:'pointer'}}>
              Réessayer
            </button>
          </div>
        );
        return this.props.children;
      }
    }

    const root = ReactDOM.createRoot(document.getElementById('gestion-root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
