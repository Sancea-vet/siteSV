<!DOCTYPE html>
<html lang="fr">
<head>

  <title>Sancéa Vet – Gestion Planning</title>

  <style>
    /* Reset critique : styles.css externe ne doit pas bloquer les clics */
    #gestion-root, #gestion-root * { box-sizing: border-box; }
    #gestion-root .cal-cell { cursor: pointer !important; pointer-events: auto !important; user-select: none; }
    .modal-overlay, .modal-box { pointer-events: auto !important; }
  </style>

  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <style>
    body { background:#f8fafc; }
    .gestion-wrapper { padding-top:90px; padding-bottom:60px; min-height:100vh; }
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}

    /* Onglets */
    .plan-tabs{display:flex;gap:4px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:5px;flex-wrap:wrap}
    .plan-tab{padding:8px 18px;border-radius:10px;border:none;cursor:pointer;font-weight:500;font-size:13px;font-family:'Inter',sans-serif;background:transparent;color:#6b7280;transition:all .18s;display:inline-flex;align-items:center;gap:6px}
    .plan-tab.active{background:#0d9488;color:#fff;font-weight:600}
    .plan-tab:hover:not(.active){background:#f0fdfa;color:#0d9488}

    /* Boutons */
    .btn-teal{background:#0d9488;color:#fff;border:none;border-radius:50px;padding:8px 20px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .btn-teal:hover{background:#0f766e;transform:translateY(-1px)}
    .btn-ghost{background:#f8fafc;color:#6b7280;border:1px solid #e2e8f0;border-radius:50px;padding:7px 16px;font-weight:500;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .btn-ghost:hover{background:#f0fdfa;color:#0d9488;border-color:#99f6e4}
    .btn-outline{background:transparent;color:#0d9488;border:2px solid #0d9488;border-radius:50px;padding:7px 18px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .btn-outline:hover{background:#0d9488;color:#fff}
    .btn-success{background:#10b981;color:#fff;border:none;border-radius:50px;padding:8px 20px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .btn-success:hover{background:#059669}
    .btn-danger-soft{background:#fef2f2;color:#ef4444;border:1px solid #fecaca;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
    .btn-danger-soft:hover{background:#fee2e2}
    button:disabled{opacity:.45;cursor:not-allowed}

    /* Cards */
    .g-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
    .g-card-sm{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

    /* Inputs */
    .g-input{background:#fff;border:1.5px solid #e2e8f0;color:#1f2937;border-radius:10px;padding:9px 13px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
    .g-input:focus{border-color:#0d9488}
    .g-label{font-size:11px;color:#6b7280;margin-bottom:5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;display:block}

    /* Calendrier */
    .cal-grid{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .cal-header-row{display:grid;grid-template-columns:repeat(7,1fr);background:#f8fafc;border-bottom:1px solid #e2e8f0}
    .cal-header-cell{padding:10px 0;text-align:center;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9ca3af}
    .cal-header-cell.we{color:#0d9488}
    .cal-week{display:grid;grid-template-columns:repeat(7,1fr)}
    .cal-week:not(:last-child){border-bottom:1px solid #f1f5f9}
    .cal-cell{min-height:120px;padding:6px 5px;border-right:1px solid #f1f5f9;position:relative;transition:background .12s;cursor:pointer;pointer-events:auto !important}
    .cal-cell:last-child{border-right:none}
    .cal-cell:hover{background:#e0fdf4 !important}
    .cal-cell.empty{background:#fafafa;cursor:default;pointer-events:none}
    .cal-cell.closed{background:#fafafa;cursor:pointer}
    .cal-cell.closed:hover{background:#fdf4ff}
    .cal-cell.we-day{background:#fdfffe}
    .cal-cell.holiday{background:#fffbeb !important;cursor:pointer}
    .cal-cell.holiday:hover{background:#fef3c7 !important}
    .cal-day-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;margin-bottom:4px;color:#374151}
    .cal-day-num.today{background:#0d9488;color:#fff;font-weight:700}
    .cal-day-num.closed-n{color:#d1d5db}
    .cal-alert-dot{position:absolute;top:5px;right:6px;background:#ef4444;color:#fff;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
    .cal-week-badge{position:absolute;top:5px;left:5px;font-size:8px;font-weight:600;color:#9ca3af;letter-spacing:.03em}

    /* Slot dans la cellule */
    .slot-mini{border-radius:5px;padding:2px 4px;margin-bottom:2px}
    .slot-mini-label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px;opacity:.7}
    .vet-chip-sm{font-size:9px;font-weight:500;display:flex;align-items:center;gap:3px;margin-bottom:1px;line-height:1.3}
    .vet-dot-sm{width:5px;height:5px;border-radius:50%;flex-shrink:0}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;backdrop-filter:blur(3px)}
    .modal-box{background:#fff;border-radius:20px;padding:0;width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
    .modal-head{padding:20px 24px 16px;border-bottom:1px solid #f1f5f9;position:sticky;top:0;background:#fff;z-index:1;border-radius:20px 20px 0 0}
    .modal-body{padding:20px 24px 24px}

    /* Slot tabs in modal */
    .slot-tabs{display:flex;gap:4px;background:#f8fafc;border-radius:10px;padding:4px;margin-bottom:16px}
    .slot-tab{flex:1;padding:8px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;transition:all .15s;color:#6b7280;background:transparent;text-align:center}
    .slot-tab.active{background:#fff;color:#0d9488;box-shadow:0 1px 4px rgba(0,0,0,.08)}

    /* Vet toggle buttons */
    .vet-toggle{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:2px solid #e2e8f0;cursor:pointer;transition:all .15s;text-align:left;font-family:'Inter',sans-serif;font-size:13px;width:100%;background:#f9fafb}
    .vet-toggle.on{background:var(--vc,#f0fdfa);border-color:var(--vb,#0d9488)}

    /* Horaire selector */
    .horaire-card{flex:1;padding:10px 12px;border-radius:10px;border:2px solid #e2e8f0;cursor:pointer;transition:all .15s;text-align:center;background:#f9fafb}
    .horaire-card.selected{border-color:#0d9488;background:#f0fdfa}
    .horaire-card .htime{font-size:13px;font-weight:700;color:#1f2937}
    .horaire-card .htag{font-size:10px;color:#6b7280;margin-top:2px}

    /* Règles */
    .rule-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
    .parity-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.03em}
    .parity-even{background:#dbeafe;color:#1d4ed8}
    .parity-odd{background:#fce7f3;color:#be185d}
    .parity-all{background:#d1fae5;color:#065f46}
    .slot-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
    .slot-matin{background:#fef3c7;color:#92400e}
    .slot-aprem{background:#ede9fe;color:#5b21b6}
    .slot-all{background:#e0f2fe;color:#0369a1}

    /* Day toggle */
    .day-toggle{padding:7px 14px;border-radius:50px;cursor:pointer;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;transition:all .15s}
    .day-toggle.on{background:#0d9488;color:#fff;border:none}
    .day-toggle.off{background:#fff;color:#9ca3af;border:1.5px solid #e2e8f0}

    /* Misc */
    .g-divider{height:1px;background:#f1f5f9;margin:14px 0}
    .alert-panel{margin-top:16px;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:16px}
    .sync-ok{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:14px;font-size:13px;color:#166534}
    .sync-warn{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:14px;font-size:13px;color:#92400e}
    .sync-info{background:#f0fdfa;border:1px solid #99f6e4;border-radius:10px;padding:14px;font-size:13px;color:#134e4a;line-height:1.7}
    .code-block{background:#1e293b;border-radius:10px;padding:14px;overflow-x:auto}
    .code-block pre{color:#94a3b8;font-size:11px;line-height:1.65;font-family:'Fira Code','Cascadia Code',monospace;margin:0;white-space:pre-wrap;word-break:break-word}
    .indispo-chip{border-radius:20px;padding:4px 12px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
    .indispo-chip button{background:none;border:none;cursor:pointer;font-size:15px;line-height:1;padding:0;color:inherit;opacity:.7}
    .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;align-items:center}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#6b7280}
    .legend-dot{width:9px;height:9px;border-radius:50%}
    .vet-row{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;transition:border-color .15s}
    .vet-row:hover{border-color:#99f6e4}
    .section-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#1f2937;margin-bottom:4px}
    .section-desc{color:#6b7280;font-size:13px;margin-bottom:20px}
    .badge-danger{background:#ef4444;color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700}


    /* Astreintes */
    .astr-badge{display:inline-flex;align-items:center;gap:3px;border-radius:4px;padding:1px 5px;font-size:9px;font-weight:700;margin-top:1px}
    .astr-midi{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
    .astr-soir{background:#ede9fe;color:#4c1d95;border:1px solid #c4b5fd}
    .astr-we{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
    .astr-empty{background:#f1f5f9;color:#9ca3af;border:1px dashed #d1d5db}
    .astr-section{background:#fafafa;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-top:4px}
    .astr-slot-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .astr-slot-row:last-child{margin-bottom:0}
    .astr-dot-midi{width:8px;height:8px;border-radius:50%;background:#f59e0b;flex-shrink:0}
    .astr-dot-soir{width:8px;height:8px;border-radius:50%;background:#8b5cf6;flex-shrink:0}
    .pref-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
    @media(max-width:640px){
      .cal-cell{min-height:80px;padding:4px 3px}
      .plan-tab .tab-label{display:none}
    }

    /* ASV Day Grid Modal */
    .asv-modal-box{background:#fff;border-radius:20px;width:95vw;max-width:980px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.25)}
    .asv-grid-wrap{overflow:auto;flex:1;cursor:crosshair}
    .asv-grid-tbl{border-collapse:collapse;table-layout:fixed}
    .asv-grid-tbl th{padding:6px 4px;font-size:10px;font-weight:700;text-align:center;position:sticky;top:0;background:#fff;z-index:3;border-bottom:2px solid #e2e8f0;white-space:nowrap}
    .asv-grid-tbl .asv-th-time{width:44px;min-width:44px;text-align:right;padding-right:8px;color:#6b7280;font-size:11px}
    .asv-grid-tbl .asv-th-cov{width:28px;min-width:28px}
    .asv-grid-cell{width:70px;min-width:70px;height:10px;cursor:pointer;transition:none;user-select:none;-webkit-user-select:none;box-sizing:border-box}
    .asv-grid-row.hr td{border-top:1.5px solid #e2e8f0}
    .asv-grid-row.hh td{border-top:1px dashed #f1f5f9}
    .asv-time-lbl{font-size:8px;text-align:right;padding:0 6px;color:#d1d5db;vertical-align:middle;white-space:nowrap}
    .asv-time-lbl.hr{color:#6b7280;font-size:9px;font-weight:600}
    .asv-time-lbl.hh{color:#9ca3af}
    .asv-cov-cell{font-size:8px;text-align:center;vertical-align:middle}
    .asv-gantt-row{position:relative;height:5px;margin-bottom:2px;background:#f8fafc;border-radius:2px;overflow:hidden}
    .asv-gantt-seg{position:absolute;top:0;height:100%;border-radius:2px;pointer-events:none}
  </style>
</head>

  <script type="text/babel">
    const { useState, useMemo, useCallback, useEffect, useRef } = React;

    // ─── Persistance Worker KV ─────────────────────────────────
    const API_DATA_URL = '/api/data';

    async function loadRemoteData() {
      const res = await fetch(API_DATA_URL);
      if (!res.ok) throw new Error(`Erreur chargement: ${res.status}`);
      return res.json();
    }

    async function saveRemoteData(data) {
      const res = await fetch(API_DATA_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (!res.ok) throw new Error(`Erreur sauvegarde: ${res.status}`);
    }

    // ─── Constantes ────────────────────────────────────────────
    const JOURS   = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
    const JS_FULL = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const MOIS    = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    const PALETTE = ['#0d9488','#f59e0b','#3b82f6','#8b5cf6','#ec4899','#0891b2','#f97316','#16a34a','#be185d','#7c3aed'];

    const HORAIRES = {
 matin_A: { id:'matin_A', label:'8h30 – 12h00', slot:'matin', short:'8h30-12h00' },
 matin_B: { id:'matin_B', label:'9h30 – 13h30', slot:'matin', short:'9h30-13h30' },
 aprem_A: { id:'aprem_A', label:'13h30 – 17h00', slot:'aprem', short:'13h30-17h00' },
 aprem_B: { id:'aprem_B', label:'15h00 – 19h00',slot:'aprem', short:'15h00-19h00' },
};
    // Heure de fin par horaire (pour la règle "celui qui finit le tard est d'astreinte")
    const HORAIRE_END_TIME = { matin_A: 12, matin_B: 13.5, aprem_A: 17, aprem_B: 19 };

    // ─── Helpers ───────────────────────────────────────────────
    const uid         = () => Math.random().toString(36).slice(2,8);
    const daysInMonth = (y,m) => new Date(y,m+1,0).getDate();
    const firstCol    = (y,m) => (new Date(y,m,1).getDay()+6)%7;
    const dowJS       = (y,m,d) => new Date(y,m,d).getDay();
    const isWE        = (dow) => dow===0||dow===6;
    const dk          = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

    function isoWeek(y,m,d) {
      const date = new Date(y,m,d);
      const day  = date.getDay()||7;
      date.setDate(date.getDate()+4-day);
      const yearStart = new Date(date.getFullYear(),0,1);
      return Math.ceil((((date-yearStart)/86400000)+1)/7);
    }
    const isEvenWeek = (y,m,d) => isoWeek(y,m,d)%2===0;
    const weekParity = (y,m,d) => isEvenWeek(y,m,d)?'even':'odd';

    // ─── Jours fériés français ─────────────────────────────────
    function easterDate(year) {
      // Algorithme de Meeus/Jones/Butcher
      const a=year%19, b=Math.floor(year/100), c=year%100;
      const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25);
      const g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30;
      const i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7;
      const m=Math.floor((a+11*h+22*l)/451);
      const mo=Math.floor((h+l-7*m+114)/31)-1;
      const dy=((h+l-7*m+114)%31)+1;
      return new Date(year,mo,dy);
    }
    function getFrenchHolidays(year) {
      const easter=easterDate(year);
      const addDays=(base,n)=>{ const d=new Date(base); d.setDate(d.getDate()+n); return d; };
      const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      return new Set([
        fmt(new Date(year,0,1)),    // 1er janvier
        fmt(addDays(easter,1)),      // Lundi de Pâques
        fmt(new Date(year,4,1)),    // 1er mai
        fmt(new Date(year,4,8)),    // 8 mai
        fmt(addDays(easter,39)),     // Ascension
        fmt(addDays(easter,50)),     // Lundi de Pentecôte
        fmt(new Date(year,6,14)),   // 14 juillet
        fmt(new Date(year,7,15)),   // 15 août
        fmt(new Date(year,10,1)),   // 1er novembre
        fmt(new Date(year,10,11)),  // 11 novembre
        fmt(new Date(year,11,25)),  // 25 décembre
      ]);
    }
    const HOLIDAY_NAMES = {
      '01-01':'Jour de l\'An', '05-01':'Fête du Travail', '05-08':'Victoire 1945',
      '07-14':'Fête Nationale', '08-15':'Assomption', '11-01':'Toussaint',
      '11-11':'Armistice', '12-25':'Noël',
    };
    function getHolidayName(datekey, holidays) {
      if(!holidays||!holidays.has(datekey)) return null;
      const mm_dd = datekey.slice(5);
      if(HOLIDAY_NAMES[mm_dd]) return HOLIDAY_NAMES[mm_dd];
      // Jours mobiles
      const [y,mo,d]=datekey.split('-').map(Number);
      const easter=easterDate(y);
      const addDays=(base,n)=>{const dt=new Date(base);dt.setDate(dt.getDate()+n);return dt;};
      const fmt=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      if(fmt(addDays(easter,1))===datekey) return 'Lundi de Pâques';
      if(fmt(addDays(easter,39))===datekey) return 'Ascension';
      if(fmt(addDays(easter,50))===datekey) return 'Lundi de Pentecôte';
      return 'Jour férié';
    }

    function parityMatch(ruleParity, y,m,d) {
      if (ruleParity==='all') return true;
      return ruleParity===weekParity(y,m,d);
    }

    function isWeekday(dow) {
      return dow >= 1 && dow <= 5;
    }

    function matchRuleScope(rule, y, m, d) {
      const dow = dowJS(y, m, d);
      if (rule.weekParity !== 'all' && !parityMatch(rule.weekParity, y, m, d)) return false;
      if (rule.dayType === 'weekday' && !isWeekday(dow)) return false;
      if (rule.dayType === 'weekend' && isWeekday(dow)) return false;
      if (rule.dayOfWeek !== undefined && rule.dayOfWeek !== dow) return false;
      return true;
    }

    function matchHoraireRule(rule, y, m, d) {

    }

    // Planning vide pour un slot

    // Normalise un slot vers tableau (compat ancien format objet unique)
    const toSlotArr = (raw) => {
      if (!raw) return [];

    };

    // ─── App ───────────────────────────────────────────────────
    const DEFAULT_VETS = [
      {id:'v1',name:'Adrien', email:'martin@clinique.fr', phone:'', color:PALETTE[0]},
      {id:'v2',name:'Alexis', email:'dubois@clinique.fr', phone:'', color:PALETTE[1]},

      {id:'r2',type:'min_per_slot',slot:'aprem',dayType:'weekday',weekParity:'all',min:2},
      {id:'r3',type:'min_per_slot',slot:'matin',dayType:'weekend',weekParity:'all',min:2},
      {id:'r4',type:'horaire_rule',slot:'matin',dayType:'all',weekParity:'even',horaire:'matin_A'},
      {id:'r5',type:'horaire_rule',slot:'matin',dayType:'all',weekParity:'odd', horaire:'matin_B'},
      {id:'r6',type:'horaire_rule',slot:'aprem',dayType:'all',weekParity:'even',horaire:'aprem_A'},
      {id:'r7',type:'horaire_rule',slot:'aprem',dayType:'all',weekParity:'odd', horaire:'aprem_B'},

    const PALETTE_ASV = ['#ec4899','#f97316','#eab308','#84cc16','#06b6d4','#8b5cf6','#f43f5e','#10b981'];
    const DEFAULT_ASVS = [
      {id:'a1',name:'ASV 1',color:PALETTE_ASV[0]},

    const DEFAULT_ASV_RULES = { hoursPerWeek: 35, lunchBreak: 1 };

    // ─── Utilitaires horaires ASV ──────────────────────────────
    const HORAIRE_TIMES = {
      matin_A: {start:8.5,  end:12.0},

    const formatHTime = (h) => {

    function App() {

      // ── Migration : ancien format tableau → nouveau format objet ─
      useEffect(()=>{

        if(!needsMigration) return;
        setAsvPlanning(prev=>{
          const next={};

            // Ancien format: [{asvId,start,end,hoursDay,type}, ...]

      // ── Auto-save vers le Worker KV ────────────────────────────
      const saveTimer = useRef(null);
      const triggerSave = useCallback((data) => {

            setTimeout(()=>setSaveFlash(false), 1800);
          } catch(err) {
            console.error('Erreur de sauvegarde du KV', err);
          }
        }, 800);
      }, []);

      useEffect(()=>{
        if(loaded && apiReady)
          triggerSave({vets,rules,openDays,planning,unavail,validated,yearlyData,astreintes,asvs,asvRules,asvPlanning,asvUnavailRanges,year,month,gclientId,calId,loaded,apiReady});
      },[vets,rules,openDays,planning,unavail,validated,yearlyData,astreintes,asvs,asvRules,asvPlanning,asvUnavailRanges,year,month,gclientId,calId,loaded,apiReady]);

      // ── Export / Import JSON ──────────────────────────────────
      const exportJSON = useCallback(()=>{
        const data = {vets,rules,openDays,planning,unavail,validated,yearlyData,astreintes,asvs,asvRules,asvPlanning,asvUnavailRanges,gclientId,calId};
        const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href=url; a.download=`sanceavet_backup_${new Date().toISOString().slice(0,10)}.json`; a.click();
        URL.revokeObjectURL(url);
      },[vets,rules,openDays,planning,unavail,validated,yearlyData,astreintes,asvs,asvRules,asvPlanning,asvUnavailRanges,gclientId,calId]);

      const importJSON = useCallback(()=>{
        const input = document.createElement('input');
        input.type='file'; input.accept='.json';
        input.onchange = e => {
          const file = e.target.files[0]; if(!file) return;
          const reader = new FileReader();
          reader.onload = async ev => {
            try {
              const d = JSON.parse(ev.target.result);
              if(d.vets)       setVets(d.vets);
              if(d.rules)      setRules(d.rules);
              if(d.openDays)   setOpenDays(d.openDays);
              if(d.planning)   setPlanning(d.planning);
              if(d.unavail)    setUnavail(d.unavail);
              if(d.validated !== undefined) setValidated(d.validated);
              if(d.yearlyData) setYearlyData(d.yearlyData);
              if(d.astreintes) setAstreintes(d.astreintes);
              if(d.asvs)       setAsvs(d.asvs);
              if(d.asvRules)   setAsvRules(d.asvRules);
              if(d.asvPlanning)setAsvPlanning(d.asvPlanning);
              if(d.asvUnavailRanges) setAsvUnavailRanges(d.asvUnavailRanges);
              if(d.gclientId)  setGclientId(d.gclientId);
              if(d.calId)      setCalId(d.calId);
              alert('✅ Import réussi !');
            } catch(err){ alert('❌ Fichier JSON invalide'); }
          };
          reader.readAsText(file);
        };
        input.click();
      },[]);


      // ══════════════════════════════════════════════════════════════
      // ── GÉNÉRATION UNIFIÉE : astreintes + planning en 3 phases ────
      // ══════════════════════════════════════════════════════════════
      //
      //  Phase 1 : Blocs WE/JF  → un seul vétérinaire par bloc,
      //            équilibré sur l'année ; inclut la veille ouvrée si JF
      //  Phase 2 : Astreintes soir (jours ouvrés)
      //            → équilibrage soir/mois ; espacement min entre 2 soirs
      //            du même véto ; pénalité si lendemain non travaillé ou WE
      //  Phase 3 : Planning (jours travaillés)
      //            → le véto de soir DOIT travailler ce jour et reçoit
      //              le créneau le plus tardif (aprem_B 18h30)
      //            → équilibrage global demi-journées + fin 17h entre vétérinaires
      //
      const generateAll = useCallback(()=>{
 const newA = {}; // astreintes finales
 const newP = {}; // planning final
 const dk_ = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

 // ── Info journalière ──────────────────────────────────────────
 const dayInfo = {};
 for(let d=1; d<=numDays; d++){
 const key = dk_(year, month, d);
 const dow = dowJS(year, month, d);
 const isHol = holidays.has(key);
 const isClosed = (!openDays[dow]) || isHol;
 const isOpen = !isClosed;
 dayInfo[d] = { key, dow, isClosed, isHoliday: isHol, isOpen };
 }

 // Indispos : matin/aprem/midi/soir
 const isUnavailOn = (vetId, key, slot) => {
 const u = unavail[key] || {};
 if(!slot){
 return (u.matin||[]).includes(vetId) || (u.aprem||[]).includes(vetId) || (u.midi||[]).includes(vetId) || (u.soir||[]).includes(vetId);
 }
 return (u[slot]||[]).includes(vetId);
 };

 // Règles fixes : si un véto ne travaille jamais ce créneau ce jour-là, il ne peut pas être d'astreinte (contrainte sur les autres)
 const isForbiddenRule = (vetId, dayNum, slot) => {
 const dow = dayInfo[dayNum].dow;
 return rules.some(r=>
 r.type==='never_slot' &&
 (r.slot===slot || r.slot==='all') &&
 r.dayOfWeek===dow &&
 parityMatch(r.weekParity, year, month, dayNum) &&
 r.vetId===vetId
 );
 };
 const forbiddenDay = (vetId, dayNum) => (
 isForbiddenRule(vetId, dayNum, 'all') ||
 isForbiddenRule(vetId, dayNum, 'matin') ||
 isForbiddenRule(vetId, dayNum, 'aprem')
 );

 // ── Charge historique (yearlyData) ────────────────────────────
 const historicalLoad = Object.fromEntries(vets.map(v=>[v.id,{dj:0, weJf:0, soir:0}]));
 Object.entries(yearlyData).forEach(([yr, months])=>{
 const yHols = getFrenchHolidays(parseInt(yr));
 Object.values(months).forEach(({astreintes:a, planning:p})=>{
 if(a){
 const sortedKeys = Object.keys(a).sort();
 sortedKeys.forEach(key=>{
 const [ky,km,kd] = key.split('-').map(Number);
 const dow2 = new Date(ky, km-1, kd).getDay();
 const isHol2 = yHols.has(key);
 const isClosed2 = isWE(dow2) || isHol2;
 const vid = a[key]?.soir;
 if(isClosed2){
 const prev = new Date(ky, km-1, kd-1);
 const prevKey = dk_(prev.getFullYear(), prev.getMonth(), prev.getDate());
 const prevClosed = isWE(prev.getDay()) || yHols.has(prevKey);
 if(!prevClosed && vid && historicalLoad[vid]) historicalLoad[vid].weJf++;
 } else {
 if(vid && historicalLoad[vid]) historicalLoad[vid].soir++;
 }
 });
 }
 if(p){
 Object.entries(p).forEach(([k,dp])=>{
 if(!dp) return;
 ['matin','aprem'].forEach(slot=>{
 const slotArr = toSlotArr(dp[slot]);
 const vids = [...new Set(slotArr.flatMap(s=>s.vets||[]))];
 vids.forEach(vid=>{ if(historicalLoad[vid]) historicalLoad[vid].dj++; });
 });
 });
 }
 });
 });
 // FIX: nouveau véto → initialiser à la moyenne des vétérinaires EXISTANTS
 // Un véto sans historique ne doit pas avoir un score de 0 (il serait toujours choisi)
 // ni recevoir avgDj en plus de son historique (les anciens seraient pénalisés)
 const existingVets = vets.filter(v => {
   const b = historicalLoad[v.id];
   return b && (b.dj > 0 || b.weJf > 0 || b.soir > 0);
 });
 const refCount = Math.max(1, existingVets.length);
 const avgDj   = existingVets.reduce((s,v)=>s+(historicalLoad[v.id]?.dj||0),   0) / refCount;
 const avgWeJf = existingVets.reduce((s,v)=>s+(historicalLoad[v.id]?.weJf||0), 0) / refCount;
 const avgSoir = existingVets.reduce((s,v)=>s+(historicalLoad[v.id]?.soir||0), 0) / refCount;
 const load = Object.fromEntries(vets.map(v=>{
 const base = historicalLoad[v.id];
 const isNew = !base || (base.dj === 0 && base.weJf === 0 && base.soir === 0);
 return [v.id, {
   dj:   isNew ? avgDj   : base.dj,
   weJf: isNew ? avgWeJf : base.weJf,
   soir: isNew ? avgSoir : base.soir,
 }];
 }));

 // ─────────────────────────────────────────────────────────────
 // PHASE 1 : blocs dimanche + jours fériés (incluant la veille)
 // ─────────────────────────────────────────────────────────────
 const units = [];
 const addUnit = (days, reason) => {
 const clean = [...new Set(days.filter(x=>x>=1 && x<=numDays))].sort((a,b)=>a-b);
 if(clean.length) units.push({days: clean, reason});
 };

 // unités jours fériés
 for(let d=1; d<=numDays; d++){
 if(!dayInfo[d].isHoliday) continue;
 const dow = dayInfo[d].dow;
 const days = [d];
 if(d-1>=1) days.unshift(d-1);
 if(dow===1){ if(d-2>=1) days.unshift(d-2); if(d-1>=1) days.unshift(d-1); }
 if(dow===5){ if(d+1<=numDays) days.push(d+1); if(d+2<=numDays) days.push(d+2); }
 addUnit(days,'JF');
 }

 // unités dimanches (samedi+dimanche) si pas déjà couvert
 for(let d=1; d<=numDays; d++){
 if(dayInfo[d].dow!==0) continue;
 if(units.some(u=>u.days.includes(d))) continue;
 addUnit([d-1,d],'DIM');
 }

 // fusion unités chevauchantes
 let changed = true;
 while(changed){
 changed = false;
 for(let i=0;i<units.length;i++){
 for(let j=i+1;j<units.length;j++){
 const a = units[i], b = units[j];
 if(a.days.some(x=>b.days.includes(x))){
 units[i] = {days:[...new Set([...a.days,...b.days])].sort((x,y)=>x-y), reason:a.reason+'+'+b.reason};
 units.splice(j,1);
 changed = true;
 break;
 }
 }
 if(changed) break;
 }
 }

 // assignation blocs
 const unitDaysSet = new Set();
 const lastChosenByVet = Object.fromEntries(vets.map(v=>[v.id, -999]));
 const unitScore = (vid, start, days) => {
 let s = (load[vid]?.weJf||0)*100 + (load[vid]?.soir||0)*8 + (load[vid]?.dj||0)*2;
 const dist = start - (lastChosenByVet[vid]||-999);
 if(dist<=2) s += 80; else if(dist<=4) s += 35;
 days.forEach(dd=>{
 const k = dayInfo[dd].key;
 // règle fixe : ne peut pas être d'astreinte si ne travaille pas ce jour-là
 if(forbiddenDay(vid, dd)) s += 1200;
 // indispos : pas d'astreinte
 if(dayInfo[dd].isOpen){ if(isUnavailOn(vid,k,'matin')) s+=1000; if(isUnavailOn(vid,k,'aprem')) s+=1000; }
 if(isUnavailOn(vid,k,'soir') || isUnavailOn(vid,k,'midi')) s+=1000;
 });
 return s;
 };

 units.sort((a,b)=>a.days[0]-b.days[0]);
 units.forEach(unit=>{
 const start = unit.days[0];
 let elig = vets.map(v=>v.id);
 // filtrage strict : on enlève d'abord ceux qui sont interdits (règle fixe) ou indispo (si possible)
 const ok = (vid) => !unit.days.some(dd=>{
 const k = dayInfo[dd].key;
 if(forbiddenDay(vid, dd)) return true;
 if(dayInfo[dd].isOpen && (isUnavailOn(vid,k,'matin') || isUnavailOn(vid,k,'aprem'))) return true;
 if(isUnavailOn(vid,k,'soir') || isUnavailOn(vid,k,'midi')) return true;
 return false;
 });
 const e2 = elig.filter(ok);
 if(e2.length) elig = e2;
 elig.sort((a,b)=>unitScore(a,start,unit.days)-unitScore(b,start,unit.days));
 const chosen = elig[0] || null;
 if(chosen){ load[chosen].weJf++; lastChosenByVet[chosen] = unit.days[unit.days.length-1]; }
 unit.days.forEach(dd=>{
 if(dd<1 || dd>numDays) return;
 const k = dayInfo[dd].key;
 newA[k] = {midi: chosen, soir: chosen};
 unitDaysSet.add(dd);
 });
 });

 // ─────────────────────────────────────────────────────────────
 // PHASE 2 : soirs de semaine hors blocs (lun→ven)
 // ─────────────────────────────────────────────────────────────
 const soirLoad = Object.fromEntries(vets.map(v=>[v.id, load[v.id].soir]));
 const lastSoirDay = Object.fromEntries(vets.map(v=>[v.id, -999]));

 for(let d=1; d<=numDays; d++){
 if(!dayInfo[d].isOpen) continue;
 if(unitDaysSet.has(d)) continue;
 if(dayInfo[d].dow===6) continue;
 const key = dayInfo[d].key;
 let elig = vets.map(v=>v.id);
 const ok = (vid) => {
 if(forbiddenDay(vid, d)) return false;
 return !(isUnavailOn(vid,key,'aprem') || isUnavailOn(vid,key,'soir'));
 };
 const e2 = elig.filter(ok);
 if(e2.length) elig = e2;
 const nextIsBloc = (d<numDays) && unitDaysSet.has(d+1);
 const nextBlocVet = nextIsBloc ? (newA[dayInfo[d+1].key]?.soir || null) : null;
 const score = (vid) => {
 let s = (soirLoad[vid]||0)*50 + (load[vid]?.dj||0)*2;
 const dist = d - (lastSoirDay[vid]||-999);
 if(dist<=1) s += 200; else if(dist<=3) s += 60;
 if(nextBlocVet && vid===nextBlocVet) s += 120;
 // règle fixe : forte pénalité si on a dû garder un interdit (fallback)
 if(forbiddenDay(vid, d)) s += 1200;
 return s;
 };
 elig.sort((a,b)=>score(a)-score(b));
 const chosen = elig[0] || null;
 newA[key] = {midi: chosen, soir: chosen};
 if(chosen){ soirLoad[chosen]=(soirLoad[chosen]||0)+1; lastSoirDay[chosen]=d; }
 }

 // ─────────────────────────────────────────────────────────────
 // PHASE 3 : planning — 1 véto max sur A ET B le même jour
 // ─────────────────────────────────────────────────────────────

 const workLoad = Object.fromEntries(vets.map(v=>[v.id,{dj:0}]));
 const END = { matin_A: 12, matin_B: 13.5, aprem_A: 17, aprem_B: 19 };
 const START = { matin_A: 8.5, matin_B: 9.5, aprem_A: 13.5, aprem_B: 15 };
 const breakOK = (mH, aH) => (START[aH]-END[mH]) >= 1.5;

 for(let d=1; d<=numDays; d++){
 const key = dayInfo[d].key;
 const dow = dayInfo[d].dow;
 const isSat = dow===6;
 const we = isWE(dow);
 if(!dayInfo[d].isOpen){ newP[key]=null; continue; }

 const astrVet = newA[key]?.soir || null;
 const day = {

      // ── Génération Planning ASV ────────────────────────────────
      const generateASVPlanning = useCallback(()=>{
        const prefix = `${year}-${String(month+1).padStart(2,'0')}-`;
        const roundQ = h => Math.round(h*4)/4;
        const overlaps = (s1,e1,s2,e2) => s1<e2 && e1>s2;

        // ── Indisponibilité ASV sur un créneau ──────────────────
        const isUnavailAt = (asvId, dateKey, startH, endH) =>
          asvUnavailRanges.some(r => {
            if(r.asvId !== asvId || dateKey < r.fromDate || dateKey > r.toDate) return false;
            const rS = dateKey===r.fromDate ? r.fromTime : 0;
            const rE = dateKey===r.toDate   ? r.toTime   : 24;

          });

        // ── Horaires staggerés pour N ASVs journée complète ─────
        // S=debut ASV, E=fin ASV, lb=pause déj.
        // Pauses séquentielles (pas de chevauchement → couverture continue)
        const computeStaggered = (asvIds, S, E, lb) => {
          const res = {};
          const n = asvIds.length;
          if(n===0) return res;
          // Fenêtre lunch idéale : centrer autour de 12h30, sans rogner les marges
          const minLS = roundQ(S + 0.5);          // 30min de travail minimum avant la pause
          const maxLE = roundQ(E - 0.5);          // 30min après la pause
          const totalSpan = n * lb;
          // Premier démarrage de pause = centre - totalSpan/2, clampé
          const idealFirst = roundQ(13.0 - totalSpan/2); // vise 13h pour le centre des pauses
          const firstLS = Math.max(minLS, Math.min(idealFirst, roundQ(maxLE - totalSpan)));
          asvIds.forEach((asvId, i) => {
            let ls = roundQ(firstLS + i * lb);
            let le = roundQ(ls + lb);
            // Sécurité : reclampe si déborde
            if(le > maxLE){ le = maxLE; ls = roundQ(le - lb); }
            if(ls < minLS){ ls = minLS; le = roundQ(ls + lb); }
            const segs = [];
            if(ls > S) segs.push({start:S, end:ls});
            if(le < E) segs.push({start:le, end:E});
            if(segs.length===0) segs.push({start:S, end:E});
            res[asvId] = {segments:segs};
          });
          return res;
        };

        // ── Calcul infos journalières ───────────────────────────
        const computeDayInfo = (d) => {
          const key = dk(year,month,d);
          const dow = dowJS(year,month,d);
          if(!openDays[dow] || holidays.has(key)) return null;
          const dp = planning[key]; if(!dp) return null;
          const mS=[],mE=[],aS=[],aE=[], vetSet=new Set();
          toSlotArr(dp.matin).forEach(s=>{
            if(!s.vets||!s.vets.length) return;
            const t=HORAIRE_TIMES[s.horaire]; if(!t) return;
            mS.push(t.start); mE.push(t.end); s.vets.forEach(v=>vetSet.add(v));
          });
          toSlotArr(dp.aprem).forEach(s=>{
            if(!s.vets||!s.vets.length) return;
            const t=HORAIRE_TIMES[s.horaire]; if(!t) return;
            aS.push(t.start); aE.push(t.end); s.vets.forEach(v=>vetSet.add(v));
          });
          if(vetSet.size===0) return null;
          const allS=[...mS,...aS], allE=[...mE,...aE];
          const asvStart = roundQ(Math.min(...allS)-0.5);
          const asvEnd   = roundQ(Math.max(...allE)+0.5);
          const hasMatin = mE.length>0, hasAprem = aS.length>0;
          const morningEnd     = hasMatin ? roundQ(Math.max(...mE)+0.5) : null;
          const afternoonStart = hasAprem ? roundQ(Math.min(...aS)-0.5) : null;
          // Heures effective : pause déj seulement si journée complète (matin+aprem)
          const fullDay = hasMatin && hasAprem;
          const hoursFullDay = roundQ(fullDay ? (asvEnd-asvStart)-asvRules.lunchBreak : (asvEnd-asvStart));
          const hoursMatin = hasMatin ? roundQ(morningEnd - asvStart) : 0;
          return {key, vetCount:vetSet.size, asvStart, asvEnd, morningEnd, afternoonStart,
                  hasMatin, hasAprem, fullDay, hoursFullDay, hoursMatin};
        };

        const dayInfoMap = {}, weekDaysMap = {};

          const info = computeDayInfo(d); if(!info) continue;
          dayInfoMap[d]=info;

        }

        Object.entries(weekDaysMap).forEach(([wnStr,days])=>{
          const wn=+wnStr;
          days.forEach(d=>{
            const info=dayInfoMap[d];
            const {key,vetCount,asvStart,asvEnd,hoursFullDay}=info;

              assign[key][asv.id]='full';
              addWH(asv.id,wn,hoursFullDay);

          const wn=+wnStr;

            .sort((a,b)=>dayInfoMap[b].vetCount-dayInfoMap[a].vetCount);
