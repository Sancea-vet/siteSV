<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Sancéa Vet – Gestion Planning</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background:#f8fafc; }
    .gestion-wrapper { padding-top:90px; padding-bottom:60px; min-height:100vh; }
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}

    /* Onglets */
    .plan-tabs{display:flex;gap:4px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:5px;flex-wrap:wrap}
    .plan-tab{padding:8px 18px;border-radius:10px;border:none;cursor:pointer;font-weight:500;font-size:13px;font-family:'Inter',sans-serif;background:transparent;color:#6b7280;transition:all .18s;display:inline-flex;align-items:center;gap:6px}
    .plan-tab.active{background:#0d9488;color:#fff;font-weight:600}
    .plan-tab:hover:not(.active){background:#f0fdfa;color:#0d9488}

    /* Boutons */
    .btn-teal{background:#0d9488;color:#fff;border:none;border-radius:50px;padding:8px 20px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .btn-teal:hover{background:#0f766e;transform:translateY(-1px)}
    .btn-ghost{background:#f8fafc;color:#6b7280;border:1px solid #e2e8f0;border-radius:50px;padding:7px 16px;font-weight:500;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .btn-ghost:hover{background:#f0fdfa;color:#0d9488;border-color:#99f6e4}
    .btn-outline{background:transparent;color:#0d9488;border:2px solid #0d9488;border-radius:50px;padding:7px 18px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .btn-outline:hover{background:#0d9488;color:#fff}
    .btn-success{background:#10b981;color:#fff;border:none;border-radius:50px;padding:8px 20px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .btn-success:hover{background:#059669}
    .btn-danger-soft{background:#fef2f2;color:#ef4444;border:1px solid #fecaca;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
    .btn-danger-soft:hover{background:#fee2e2}
    button:disabled{opacity:.45;cursor:not-allowed}

    /* Cards */
    .g-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
    .g-card-sm{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

    /* Inputs */
    .g-input{background:#fff;border:1.5px solid #e2e8f0;color:#1f2937;border-radius:10px;padding:9px 13px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
    .g-input:focus{border-color:#0d9488}
    .g-label{font-size:11px;color:#6b7280;margin-bottom:5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;display:block}

    /* Calendrier */
    .cal-grid{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .cal-header-row{display:grid;grid-template-columns:repeat(7,1fr);background:#f8fafc;border-bottom:1px solid #e2e8f0}
    .cal-header-cell{padding:10px 0;text-align:center;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9ca3af}
    .cal-header-cell.we{color:#0d9488}
    .cal-week{display:grid;grid-template-columns:repeat(7,1fr)}
    .cal-week:not(:last-child){border-bottom:1px solid #f1f5f9}
    .cal-cell{min-height:120px;padding:6px 5px;border-right:1px solid #f1f5f9;position:relative;transition:background .12s;cursor:pointer}
    .cal-cell:last-child{border-right:none}
    .cal-cell:hover{background:#f0fdfa}
    .cal-cell.empty{background:#fafafa;cursor:default;pointer-events:none}
    .cal-cell.closed{background:#fafafa;cursor:pointer}
    .cal-cell.closed:hover{background:#fdf4ff}
    .cal-cell.we-day{background:#fdfffe}
    .cal-day-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;margin-bottom:4px;color:#374151}
    .cal-day-num.today{background:#0d9488;color:#fff;font-weight:700}
    .cal-day-num.closed-n{color:#d1d5db}
    .cal-alert-dot{position:absolute;top:5px;right:6px;background:#ef4444;color:#fff;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
    .cal-week-badge{position:absolute;top:5px;left:5px;font-size:8px;font-weight:600;color:#9ca3af;letter-spacing:.03em}

    /* Slot dans la cellule */
    .slot-mini{border-radius:5px;padding:2px 4px;margin-bottom:2px}
    .slot-mini-label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px;opacity:.7}
    .vet-chip-sm{font-size:9px;font-weight:500;display:flex;align-items:center;gap:3px;margin-bottom:1px;line-height:1.3}
    .vet-dot-sm{width:5px;height:5px;border-radius:50%;flex-shrink:0}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;backdrop-filter:blur(3px)}
    .modal-box{background:#fff;border-radius:20px;padding:0;width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
    .modal-head{padding:20px 24px 16px;border-bottom:1px solid #f1f5f9;position:sticky;top:0;background:#fff;z-index:1;border-radius:20px 20px 0 0}
    .modal-body{padding:20px 24px 24px}

    /* Slot tabs in modal */
    .slot-tabs{display:flex;gap:4px;background:#f8fafc;border-radius:10px;padding:4px;margin-bottom:16px}
    .slot-tab{flex:1;padding:8px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;transition:all .15s;color:#6b7280;background:transparent;text-align:center}
    .slot-tab.active{background:#fff;color:#0d9488;box-shadow:0 1px 4px rgba(0,0,0,.08)}

    /* Vet toggle buttons */
    .vet-toggle{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:2px solid #e2e8f0;cursor:pointer;transition:all .15s;text-align:left;font-family:'Inter',sans-serif;font-size:13px;width:100%;background:#f9fafb}
    .vet-toggle.on{background:var(--vc,#f0fdfa);border-color:var(--vb,#0d9488)}

    /* Horaire selector */
    .horaire-card{flex:1;padding:10px 12px;border-radius:10px;border:2px solid #e2e8f0;cursor:pointer;transition:all .15s;text-align:center;background:#f9fafb}
    .horaire-card.selected{border-color:#0d9488;background:#f0fdfa}
    .horaire-card .htime{font-size:13px;font-weight:700;color:#1f2937}
    .horaire-card .htag{font-size:10px;color:#6b7280;margin-top:2px}

    /* Règles */
    .rule-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
    .parity-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.03em}
    .parity-even{background:#dbeafe;color:#1d4ed8}
    .parity-odd{background:#fce7f3;color:#be185d}
    .parity-all{background:#d1fae5;color:#065f46}
    .slot-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
    .slot-matin{background:#fef3c7;color:#92400e}
    .slot-aprem{background:#ede9fe;color:#5b21b6}
    .slot-all{background:#e0f2fe;color:#0369a1}

    /* Day toggle */
    .day-toggle{padding:7px 14px;border-radius:50px;cursor:pointer;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;transition:all .15s}
    .day-toggle.on{background:#0d9488;color:#fff;border:none}
    .day-toggle.off{background:#fff;color:#9ca3af;border:1.5px solid #e2e8f0}

    /* Misc */
    .g-divider{height:1px;background:#f1f5f9;margin:14px 0}
    .alert-panel{margin-top:16px;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:16px}
    .sync-ok{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:14px;font-size:13px;color:#166534}
    .sync-warn{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:14px;font-size:13px;color:#92400e}
    .sync-info{background:#f0fdfa;border:1px solid #99f6e4;border-radius:10px;padding:14px;font-size:13px;color:#134e4a;line-height:1.7}
    .code-block{background:#1e293b;border-radius:10px;padding:14px;overflow-x:auto}
    .code-block pre{color:#94a3b8;font-size:11px;line-height:1.65;font-family:'Fira Code','Cascadia Code',monospace;margin:0;white-space:pre-wrap;word-break:break-word}
    .indispo-chip{border-radius:20px;padding:4px 12px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
    .indispo-chip button{background:none;border:none;cursor:pointer;font-size:15px;line-height:1;padding:0;color:inherit;opacity:.7}
    .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;align-items:center}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#6b7280}
    .legend-dot{width:9px;height:9px;border-radius:50%}
    .vet-row{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;transition:border-color .15s}
    .vet-row:hover{border-color:#99f6e4}
    .section-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#1f2937;margin-bottom:4px}
    .section-desc{color:#6b7280;font-size:13px;margin-bottom:20px}
    .badge-danger{background:#ef4444;color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700}


    /* Astreintes */
    .astr-badge{display:inline-flex;align-items:center;gap:3px;border-radius:4px;padding:1px 5px;font-size:9px;font-weight:700;margin-top:1px}
    .astr-midi{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
    .astr-soir{background:#ede9fe;color:#4c1d95;border:1px solid #c4b5fd}
    .astr-we{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
    .astr-empty{background:#f1f5f9;color:#9ca3af;border:1px dashed #d1d5db}
    .astr-section{background:#fafafa;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-top:4px}
    .astr-slot-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .astr-slot-row:last-child{margin-bottom:0}
    .astr-dot-midi{width:8px;height:8px;border-radius:50%;background:#f59e0b;flex-shrink:0}
    .astr-dot-soir{width:8px;height:8px;border-radius:50%;background:#8b5cf6;flex-shrink:0}
    .pref-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
    @media(max-width:640px){
      .cal-cell{min-height:80px;padding:4px 3px}
      .plan-tab .tab-label{display:none}
    }
  </style>
</head>
<body>
  <nav id="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo" style="padding:0;">
        <img src="assets/img/logo.png" alt="Sancéa Vet" style="height:52px;width:auto;" />
      </a>
      <ul class="nav-links">
        <li><a href="index.html#accueil">Accueil</a></li>
        <li><a href="index.html#services">Services</a></li>
        <li><a href="index.html#contact">Contact</a></li>
        <li><a href="gestion.html" style="color:var(--primary);">Gestion</a></li>
      </ul>
    </div>
  </nav>

  <div class="gestion-wrapper">
    <div style="max-width:1320px;margin:0 auto;padding:0 20px;">
      <div id="gestion-root"></div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>

  <script type="text/babel">
    const { useState, useMemo, useCallback, useEffect } = React;

    // ─── Persistance localStorage ──────────────────────────────
    const LS_KEY = 'sanceavet_v2';
    function lsLoad(key, fallback) {
      try { const v = localStorage.getItem(key); return v !== null ? JSON.parse(v) : fallback; }
      catch(e) { return fallback; }
    }
    function lsSave(key, val) {
      try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
    }

    // ─── Constantes ────────────────────────────────────────────
    const JOURS   = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
    const JS_FULL = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const MOIS    = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    const PALETTE = ['#0d9488','#f59e0b','#3b82f6','#8b5cf6','#ec4899','#0891b2','#f97316','#16a34a','#be185d','#7c3aed'];
    const VALID_ID = 'Sancea2026';

    const HORAIRES = {
      matin_A: { id:'matin_A', label:'8h30 – 12h30', slot:'matin', short:'8h30-12h30' },
      matin_B: { id:'matin_B', label:'8h30 – 11h30', slot:'matin', short:'8h30-11h30' },
      aprem_A: { id:'aprem_A', label:'13h – 17h',    slot:'aprem', short:'13h-17h' },
      aprem_B: { id:'aprem_B', label:'14h30 – 18h30',slot:'aprem', short:'14h30-18h30' },
    };

    // ─── Helpers ───────────────────────────────────────────────
    const uid         = () => Math.random().toString(36).slice(2,8);
    const daysInMonth = (y,m) => new Date(y,m+1,0).getDate();
    const firstCol    = (y,m) => (new Date(y,m,1).getDay()+6)%7;
    const dowJS       = (y,m,d) => new Date(y,m,d).getDay();
    const isWE        = (dow) => dow===0||dow===6;
    const dk          = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

    function isoWeek(y,m,d) {
      const date = new Date(y,m,d);
      const day  = date.getDay()||7;
      date.setDate(date.getDate()+4-day);
      const yearStart = new Date(date.getFullYear(),0,1);
      return Math.ceil((((date-yearStart)/86400000)+1)/7);
    }
    const isEvenWeek = (y,m,d) => isoWeek(y,m,d)%2===0;
    const weekParity = (y,m,d) => isEvenWeek(y,m,d)?'even':'odd';

    function parityMatch(ruleParity, y,m,d) {
      if (ruleParity==='all') return true;
      return ruleParity===weekParity(y,m,d);
    }

    // Planning vide pour un slot
    const emptySlot = (horaire) => ({ horaire, vets:[] });
    const emptyDay  = () => ({
      matin: emptySlot('matin_A'),
      aprem: emptySlot('aprem_A'),
    });

    // ─── Protection ────────────────────────────────────────────
    function ProtectedApp() {
      const [ok,setOk]       = useState(false);
      const [id,setId]       = useState('');
      const [err,setErr]     = useState('');
      const handle = e => {
        e.preventDefault();
        id===VALID_ID ? (setOk(true),setErr('')) : setErr('Identifiant incorrect.');
      };
      if (!ok) return (
        <div style={{minHeight:'60vh',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <div className="g-card" style={{maxWidth:420,width:'100%',textAlign:'center',padding:36}}>
            <div style={{fontSize:36,marginBottom:12}}>🔒</div>
            <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:22,marginBottom:8,color:'#1f2937'}}>Accès Gestion</h1>
            <p style={{color:'#6b7280',fontSize:13,marginBottom:20}}>Saisissez l'identifiant interne pour accéder au planning.</p>
            {err&&<p style={{color:'#ef4444',fontSize:13,marginBottom:12}}>{err}</p>}
            <form onSubmit={handle}>
              <input type="password" value={id} onChange={e=>setId(e.target.value)}
                placeholder="Identifiant…" className="g-input"
                style={{width:'100%',marginBottom:12,textAlign:'center',letterSpacing:'0.15em'}} autoComplete="off"/>
              <button type="submit" className="btn-teal" style={{width:'100%',justifyContent:'center',padding:'10px 0'}}>
                Accéder au planning
              </button>
            </form>
          </div>
        </div>
      );
      return <App />;
    }

    // ─── App ───────────────────────────────────────────────────
    const DEFAULT_VETS = [
      {id:'v1',name:'Dr. Martin', email:'martin@clinique.fr', phone:'', color:PALETTE[0]},
      {id:'v2',name:'Dr. Dubois', email:'dubois@clinique.fr', phone:'', color:PALETTE[1]},
      {id:'v3',name:'Dr. Bernard',email:'bernard@clinique.fr',phone:'', color:PALETTE[2]},
      {id:'v4',name:'Dr. Petit',  email:'petit@clinique.fr',  phone:'', color:PALETTE[3]},
    ];
    const DEFAULT_RULES = [
      {id:'r1',type:'min_per_slot',slot:'matin',dayType:'weekday',weekParity:'all',min:2},
      {id:'r2',type:'min_per_slot',slot:'aprem',dayType:'weekday',weekParity:'all',min:1},
      {id:'r3',type:'min_per_slot',slot:'matin',dayType:'weekend',weekParity:'all',min:1},
      {id:'r4',type:'horaire_rule',slot:'matin',dayType:'all',weekParity:'even',horaire:'matin_A'},
      {id:'r5',type:'horaire_rule',slot:'matin',dayType:'all',weekParity:'odd', horaire:'matin_B'},
      {id:'r6',type:'horaire_rule',slot:'aprem',dayType:'all',weekParity:'even',horaire:'aprem_A'},
      {id:'r7',type:'horaire_rule',slot:'aprem',dayType:'all',weekParity:'odd', horaire:'aprem_B'},
    ];

    function App() {
      const now = new Date();
      const [tab,   setTab]   = useState('planning');
      const [year,  setYear]  = useState(()=>lsLoad(LS_KEY+'_nav', {year:now.getFullYear(),month:now.getMonth()}).year);
      const [month, setMonth] = useState(()=>lsLoad(LS_KEY+'_nav', {year:now.getFullYear(),month:now.getMonth()}).month);

      const [vets,      setVets]      = useState(()=>lsLoad(LS_KEY+'_vets',      DEFAULT_VETS));
      const [rules,     setRules]     = useState(()=>lsLoad(LS_KEY+'_rules',     DEFAULT_RULES));
      const [openDays,  setOpenDays]  = useState(()=>lsLoad(LS_KEY+'_opendays',  [false,true,true,true,true,true,true]));
      const [planning,  setPlanning]  = useState(()=>lsLoad(LS_KEY+'_planning',  {}));
      const [unavail,   setUnavail]   = useState(()=>lsLoad(LS_KEY+'_unavail',   {}));
      const [validated, setValidated] = useState(()=>lsLoad(LS_KEY+'_validated', false));
      const [yearlyData,setYearlyData]= useState(()=>lsLoad(LS_KEY+'_yearly',    {}));
      // astreintes[dk] = { midi: vetId|null, soir: vetId|null }
      const [astreintes, setAstreintes] = useState(()=>lsLoad(LS_KEY+'_astr', {}));
      const [editDay,   setEditDay]   = useState(null);
      const [gclientId, setGclientId] = useState(()=>lsLoad(LS_KEY+'_gclient',  ''));
      const [calId,     setCalId]     = useState(()=>lsLoad(LS_KEY+'_calid',    'primary'));
      const [saveFlash, setSaveFlash] = useState(false);

      // ── Auto-save ─────────────────────────────────────────────
      // Debounce : on sauvegarde 800ms après le dernier changement
      const saveTimer = React.useRef(null);
      const triggerSave = useCallback((data) => {
        clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(() => {
          lsSave(LS_KEY+'_vets',      data.vets);
          lsSave(LS_KEY+'_rules',     data.rules);
          lsSave(LS_KEY+'_opendays',  data.openDays);
          lsSave(LS_KEY+'_planning',  data.planning);
          lsSave(LS_KEY+'_unavail',   data.unavail);
          lsSave(LS_KEY+'_validated', data.validated);
          lsSave(LS_KEY+'_yearly',    data.yearlyData);
          lsSave(LS_KEY+'_astr',      data.astreintes);
          lsSave(LS_KEY+'_nav',       {year:data.year, month:data.month});
          lsSave(LS_KEY+'_gclient',   data.gclientId);
          lsSave(LS_KEY+'_calid',     data.calId);
          setSaveFlash(true);
          setTimeout(()=>setSaveFlash(false), 1800);
        }, 800);
      }, []);

      useEffect(()=>{
        triggerSave({vets,rules,openDays,planning,unavail,validated,yearlyData,astreintes,year,month,gclientId,calId});
      },[vets,rules,openDays,planning,unavail,validated,yearlyData,astreintes,year,month,gclientId,calId]);


      // ── Génération des astreintes ──────────────────────────────
      const generateAstreintes = useCallback(()=>{
        const newA = {};
        // Charge cumulée (depuis yearlyData + mois courant)
        const load = Object.fromEntries(vets.map(v=>[v.id,{midi:0,soir:0}]));
        Object.values(yearlyData).forEach(yr=>Object.values(yr).forEach(({planning:p,astreintes:a})=>{
          if(!a) return;
          Object.values(a).forEach(({midi,soir})=>{
            if(midi&&load[midi]) load[midi].midi++;
            if(soir&&load[soir]) load[soir].soir++;
          });
        }));

        const sortByLoad = (slot) => [...vets].sort((a,b)=>{
          const la=(load[a.id]?.midi||0)+(load[a.id]?.soir||0);
          const lb=(load[b.id]?.midi||0)+(load[b.id]?.soir||0);
          return la-lb;
        });

        // Qui travaille ce jour ? (planning)
        const worksDay   = (dk) => { const dp=planning[dk]; if(!dp) return []; return [...new Set([...(dp.matin?.vets||[]),...(dp.aprem?.vets||[])])]; };
        const works1830  = (dk) => { const dp=planning[dk]; return dp?.aprem?.horaire==='aprem_B' ? (dp.aprem?.vets||[]) : []; };
        const worksNextDay = (dk) => {
          const p=dk.split('-'); const d=new Date(+p[0],+p[1]-1,+p[2]);
          d.setDate(d.getDate()+1);
          const nk=dk_(d.getFullYear(),d.getMonth(),d.getDate());
          return worksDay(nk);
        };
        const dk_ = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

        // Eligible : exclure indispos, puis prioriser 18h30 + lendemain travaillé
        const eligible = (key, slot) => {
          const dayU = (unavail[key]||{})[slot]||[];
          const allU = [...((unavail[key]||{}).midi||[]),...((unavail[key]||{}).soir||[]),...dayU];
          const elig = vets.filter(v=>!allU.includes(v.id));
          const w1830 = works1830(key);
          const wNext  = worksNextDay(key);
          // Score: 18h30=+2, lendemain=+1
          return [...elig].sort((a,b)=>{
            const sa=(w1830.includes(a.id)?2:0)+(wNext.includes(a.id)?1:0)-(load[a.id]?.midi||0)-(load[a.id]?.soir||0)*0.5;
            const sb=(w1830.includes(b.id)?2:0)+(wNext.includes(b.id)?1:0)-(load[b.id]?.midi||0)-(load[b.id]?.soir||0)*0.5;
            return sb-sa;
          });
        };

        // Identifier le veto de week-end pour ne pas lui donner le vendredi soir
        let weVet = null;

        // Passe 1 : week-end (bloc sam midi → lun réouverture)
        for(let d=1;d<=numDays;d++){
          const dow=dowJS(year,month,d);
          if(dow!==6) continue; // Samedi
          const satKey=dk_(year,month,d);
          // Trouver dimanche
          const sunDate=new Date(year,month,d); sunDate.setDate(d+1);
          const sunKey=dk_(sunDate.getFullYear(),sunDate.getMonth(),sunDate.getDate());

          const elig=eligible(satKey,'soir');
          const chosen=elig[0]?.id||null;
          weVet=chosen;

          newA[satKey]={midi:chosen, soir:chosen};
          newA[sunKey]={midi:chosen, soir:chosen};
          if(chosen){ load[chosen].midi+=2; load[chosen].soir+=2; }
        }

        // Passe 2 : jours de semaine
        for(let d=1;d<=numDays;d++){
          const dow=dowJS(year,month,d);
          if(isWE(dow)) continue;
          if(!openDays[dow]) continue;
          const key=dk_(year,month,d);
          if(newA[key]) continue; // déjà traité (ne devrait pas arriver)

          // MIDI
          const eligM=eligible(key,'midi');
          const midiVet=eligM[0]?.id||null;
          if(midiVet) load[midiVet].midi++;

          // SOIR — vendredi : exclure le veto de week-end si connu
          let eligS=eligible(key,'soir');
          if(dow===5 && weVet) eligS=eligS.filter(v=>v.id!==weVet); // Vendredi
          if(eligS.length===0) eligS=eligible(key,'soir');
          const soirVet=eligS[0]?.id||null;
          if(soirVet) load[soirVet].soir++;

          newA[key]={midi:midiVet, soir:soirVet};
        }

        setAstreintes(newA);
      },[vets,planning,unavail,openDays,unavail,numDays,year,month,yearlyData]);

      const numDays  = useMemo(()=>daysInMonth(year,month),[year,month]);
      const startCol = useMemo(()=>firstCol(year,month),[year,month]);

      // Quel horaire s'applique pour un slot à une date donnée ?
      const resolveHoraire = useCallback((y,m,d,slot)=>{
        const dow=dowJS(y,m,d), we=isWE(dow), wp=weekParity(y,m,d);
        const r=rules.find(r=>
          r.type==='horaire_rule' &&
          r.slot===slot &&
          parityMatch(r.weekParity,y,m,d) &&
          (r.dayType==='all'||(r.dayType==='weekday'&&!we)||(r.dayType==='weekend'&&we))
        );
        if (r) return r.horaire;
        return slot==='matin'?'matin_A':'aprem_A';
      },[rules]);

      // Alertes pour un jour
      const getAlerts = useCallback((datekey, dayPlanning)=>{
        if (!dayPlanning) return [];
        const p=datekey.split('-');
        const y=+p[0],m=+p[1]-1,d=+p[2];
        const dow=new Date(y,m,d).getDay();
        if (!openDays[dow]) return [];
        const alerts=[], we=isWE(dow), wp=weekParity(y,m,d);
        const dayU=unavail[datekey]||{matin:[],aprem:[]};

        ['matin','aprem'].forEach(slot=>{
          const s=dayPlanning[slot];
          if (!s) {
            alerts.push({level:'error',slot,msg:`${slot==='matin'?'Matin':'Après-midi'} : créneau non couvert (la clinique doit ouvrir et fermer aux mêmes horaires)`});
            return;
          }

          // Règle fixe : tous les créneaux doivent être remplis
          if (s.vets.length===0)
            alerts.push({level:'error',slot,msg:`${slot==='matin'?'Matin':'Après-midi'} : aucun véto assigné — tous les créneaux doivent être couverts`});

          // Vérif couverture min
          const minR=rules.find(r=>
            r.type==='min_per_slot' && r.slot===slot &&
            parityMatch(r.weekParity,y,m,d) &&
            (r.dayType==='all'||(r.dayType==='weekday'&&!we)||(r.dayType==='weekend'&&we))
          );
          if (minR&&s.vets.length<minR.min)
            alerts.push({level:'error',slot,msg:`${slot==='matin'?'Matin':'Après-midi'} : min. ${minR.min} véto(s) requis (${s.vets.length} assigné(s))`});

          // Vérif exclusions never_slot
          rules.filter(r=>r.type==='never_slot'&&(r.slot===slot||r.slot==='all')&&r.dayOfWeek===dow&&parityMatch(r.weekParity,y,m,d)).forEach(r=>{
            if (s.vets.includes(r.vetId)){
              const v=vets.find(x=>x.id===r.vetId);
              alerts.push({level:'error',slot,msg:`${v?v.name:'?'} ne travaille jamais ce créneau le ${JS_FULL[dow]}`});
            }
          });

          // Vérif indispos
          (dayU[slot]||[]).forEach(vid=>{
            if (s.vets.includes(vid)){
              const v=vets.find(x=>x.id===vid);
              alerts.push({level:'warn',slot,msg:`${v?v.name:'?'} est indisponible (${slot})`});
            }
          });

          // Vérif horaire attendu
          const expected=resolveHoraire(y,m,d,slot);
          if (s.horaire!==expected)
            alerts.push({level:'warn',slot,msg:`${slot==='matin'?'Matin':'Après-midi'} : horaire ${HORAIRES[s.horaire].short} (attendu ${HORAIRES[expected].short} S${isoWeek(y,m,d)} ${wp==='even'?'paire':'impaire'})`});
        });

        return alerts;
      },[rules,vets,unavail,openDays,resolveHoraire]);

      const allAlerts   = useMemo(()=>{
        const res={};
        Object.entries(planning).forEach(([k,dp])=>{const a=getAlerts(k,dp);if(a.length)res[k]=a;});
        return res;
      },[planning,getAlerts]);
      const totalAlerts = useMemo(()=>Object.values(allAlerts).reduce((s,a)=>s+a.length,0),[allAlerts]);

      // Génération
      const generate = useCallback(()=>{
        const newP={};
        const wl=Object.fromEntries(vets.map(v=>[v.id,0]));
        for (let d=1;d<=numDays;d++){
          const key=dk(year,month,d), dow=dowJS(year,month,d);
          if (!openDays[dow]){newP[key]=null;continue;}
          const we=isWE(dow);
          const dayU=unavail[key]||{matin:[],aprem:[]};
          const day={};

          ['matin','aprem'].forEach(slot=>{
            const horaire=resolveHoraire(year,month,d,slot);
            const uSet=new Set(dayU[slot]||[]);
            const exclSet=new Set(rules.filter(r=>r.type==='never_slot'&&(r.slot===slot||r.slot==='all')&&r.dayOfWeek===dow&&parityMatch(r.weekParity,year,month,d)).map(r=>r.vetId));
            const elig=vets.filter(v=>!uSet.has(v.id)&&!exclSet.has(v.id));
            elig.sort((a,b)=>wl[a.id]-wl[b.id]);
            const minR=rules.find(r=>r.type==='min_per_slot'&&r.slot===slot&&parityMatch(r.weekParity,year,month,d)&&(r.dayType==='all'||(r.dayType==='weekday'&&!we)||(r.dayType==='weekend'&&we)));
            const need=minR?minR.min:1;
            const asgn=elig.slice(0,need);
            asgn.forEach(v=>wl[v.id]++);
            day[slot]={horaire,vets:asgn.map(v=>v.id)};
          });
          newP[key]=day;
        }
        setPlanning(newP); setValidated(false);
      },[vets,rules,unavail,openDays,numDays,year,month,resolveHoraire]);

      const updateSlot = useCallback((datekey, slot, updater)=>{
        setPlanning(prev=>{
          const day=prev[datekey]||emptyDay();
          return {...prev,[datekey]:{...day,[slot]:updater(day[slot]||emptySlot(slot==='matin'?'matin_A':'aprem_A'))}};
        });
        setValidated(false);
      },[]);

      const changeMonth = useCallback((delta)=>{
        let ny=year,nm=month+delta;
        if(nm<0){ny--;nm=11;}if(nm>11){ny++;nm=0;}
        setYear(ny);setMonth(nm);setPlanning({});setUnavail({});setValidated(false);
      },[year,month]);

      const exportICS = useCallback(()=>{
        const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SanceaVet//FR','CALSCALE:GREGORIAN'];
        Object.entries(planning).forEach(([k,dp])=>{
          if(!dp) return;
          ['matin','aprem'].forEach(slot=>{
            const s=dp[slot]; if(!s||!s.vets.length) return;
            const names=s.vets.map(id=>{const v=vets.find(v=>v.id===id);return v?v.name:'';}).filter(Boolean).join(', ');
            const h=HORAIRES[s.horaire];
            const parts=k.split('-');
            const ds=k.replace(/-/g,'');
            lines.push('BEGIN:VEVENT','UID:'+k+'-'+slot+'@sanceavet',
              'DTSTART;VALUE=DATE:'+ds,'DTEND;VALUE=DATE:'+ds,
              'SUMMARY:'+(slot==='matin'?'Matin':'Après-midi')+' '+h.short+' – '+names,'END:VEVENT');
          });
        });
        lines.push('END:VCALENDAR');
        const blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download='planning-'+MOIS[month]+'-'+year+'.ics';a.click();
        URL.revokeObjectURL(url);
      },[planning,vets,month,year]);

      const TABS=[
        {id:'planning',label:'Planning',icon:'📅'},
        {id:'equipe',  label:'Équipe',  icon:'👥'},
        {id:'regles',  label:'Règles',  icon:'⚙️'},
        {id:'stats',   label:'Statistiques', icon:'📊'},
        {id:'sync',    label:'Google Sync',icon:'🔗'},
      ];

      return (
        <div style={{fontFamily:"'Inter',sans-serif",color:'#1f2937'}}>
          <div style={{marginBottom:24,display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
            <div>
              <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:28,fontWeight:700,color:'#1f2937',marginBottom:4}}>
                Planning vétérinaire
              </h1>
              <p style={{color:'#6b7280',fontSize:14}}>Gestion par demi-journées · semaines paires/impaires · sauvegarde automatique</p>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
              {saveFlash&&(
                <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:12,color:'#059669',
                  background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:20,padding:'4px 12px',
                  animation:'fadeIn .2s ease',fontWeight:500}}>
                  ✓ Sauvegardé
                </span>
              )}
              <button onClick={()=>{
                if(!confirm('Réinitialiser toutes les données ? Cette action est irréversible.')) return;
                ['_vets','_rules','_opendays','_planning','_unavail','_validated','_yearly','_nav','_gclient','_calid']
                  .forEach(k=>localStorage.removeItem(LS_KEY+k));
                window.location.reload();
              }} className="btn-ghost" style={{fontSize:12,padding:'5px 12px',color:'#ef4444',borderColor:'#fecaca'}}>
                🗑 Réinitialiser
              </button>
            </div>
          </div>

          <div className="plan-tabs" style={{marginBottom:24}}>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} className={'plan-tab'+(tab===t.id?' active':'')}>
                <span>{t.icon}</span><span className="tab-label">{t.label}</span>
                {t.id==='planning'&&totalAlerts>0&&<span className="badge-danger">{totalAlerts}</span>}
              </button>
            ))}
          </div>

          {tab==='planning'&&(
            <PlanningTab year={year} month={month} numDays={numDays} startCol={startCol}
              vets={vets} planning={planning} unavail={unavail}
              allAlerts={allAlerts} totalAlerts={totalAlerts}
              openDays={openDays} validated={validated}
              onChangeMonth={changeMonth} onGenerate={generate}
              onValidate={()=>{
                setValidated(true);
                const mkey=String(month);
                setYearlyData(prev=>{
                  const yr=prev[year]||{};
                  return {...prev,[year]:{...yr,[mkey]:{planning,astreintes,label:MOIS[month]+' '+year}}};
                });
              }}
              updateSlot={updateSlot} setUnavail={setUnavail}
              setEditDay={setEditDay}
              resolveHoraire={resolveHoraire}
              isoWeek={isoWeek} weekParity={weekParity}
              astreintes={astreintes} setAstreintes={setAstreintes}
              onGenerateAstreintes={generateAstreintes} />
          )}
          {tab==='equipe'&&<EquipeTab vets={vets} setVets={setVets}/>}
          {tab==='regles'&&<ReglesTab rules={rules} setRules={setRules} vets={vets} openDays={openDays} setOpenDays={setOpenDays}/>}
          {tab==='stats'&&(
            <StatsTab vets={vets} yearlyData={yearlyData} currentYear={year}
              currentMonth={month} currentPlanning={planning} validated={validated}
              setYearlyData={setYearlyData}
              astreintes={astreintes}/>
          )}
          {tab==='sync'&&(
            <SyncTab validated={validated} totalAlerts={totalAlerts} planning={planning}
              vets={vets} year={year} month={month}
              gclientId={gclientId} setGclientId={setGclientId}
              calId={calId} setCalId={setCalId} onExportICS={exportICS}
              astreintes={astreintes}/>
          )}

          {editDay&&(
            <EditModal datekey={editDay} vets={vets} planning={planning} unavail={unavail}
              allAlerts={allAlerts} updateSlot={updateSlot}
              resolveHoraire={resolveHoraire} year={year} month={month}
              isoWeek={isoWeek} weekParity={weekParity} openDays={openDays}
              astreintes={astreintes} setAstreintes={setAstreintes}
              onClose={()=>setEditDay(null)}/>
          )}
        </div>
      );
    }

    // ─── Onglet Planning ───────────────────────────────────────
    function PlanningTab({year,month,numDays,startCol,vets,planning,unavail,allAlerts,totalAlerts,openDays,validated,onChangeMonth,onGenerate,onValidate,updateSlot,setUnavail,setEditDay,resolveHoraire,isoWeek,weekParity,astreintes,setAstreintes,onGenerateAstreintes}){
      const [showU,  setShowU]  = useState(false);
      const [uVet,   setUVet]   = useState('');
      const [uDay,   setUDay]   = useState('');
      const [uSlot,  setUSlot]  = useState('matin');

      const totalU=Object.values(unavail).reduce((s,d)=>s+(d.matin||[]).length+(d.aprem||[]).length,0);
      const hasP=Object.keys(planning).filter(k=>planning[k]).length>0;

      const doAdd=()=>{
        if(!uVet||!uDay) return;
        const d=parseInt(uDay); if(d<1||d>numDays) return;
        const key=dk(year,month,d);
        setUnavail(prev=>{
          const cur=prev[key]||{matin:[],aprem:[]};
          const arr=[...(cur[uSlot]||[]).filter(x=>x!==uVet),uVet];
          return {...prev,[key]:{...cur,[uSlot]:arr}};
        });
        setUDay('');
      };
      const doRemove=(key,slot,vid)=>setUnavail(prev=>{
        const cur=prev[key]||{matin:[],aprem:[]};
        return {...prev,[key]:{...cur,[slot]:(cur[slot]||[]).filter(x=>x!==vid)}};
      });

      // Grille
      const cells=[]; for(let i=0;i<startCol;i++) cells.push(null);
      for(let d=1;d<=numDays;d++) cells.push(d);
      while(cells.length%7!==0) cells.push(null);
      const weeks=[]; for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));

      return (
        <div>
          {/* Toolbar */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20,flexWrap:'wrap',gap:10}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <button onClick={()=>onChangeMonth(-1)} className="btn-ghost" style={{padding:'7px 12px'}}>←</button>
              <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:700,color:'#1f2937',minWidth:185,textAlign:'center'}}>
                {MOIS[month]} {year}
              </h2>
              <button onClick={()=>onChangeMonth(1)} className="btn-ghost" style={{padding:'7px 12px'}}>→</button>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
              {hasP&&totalAlerts===0&&validated&&<span style={{color:'#059669',fontSize:13,fontWeight:600}}>✓ Validé</span>}
              {totalAlerts>0&&<span style={{color:'#d97706',fontSize:13,fontWeight:600}}>⚠ {totalAlerts} alerte(s)</span>}
              <button onClick={()=>setShowU(v=>!v)} className="btn-ghost">
                📋 Indispos {totalU>0&&<span style={{color:'#d97706',fontWeight:700,marginLeft:2}}>({totalU})</span>}
              </button>
              <button onClick={onGenerate} className="btn-teal">⚡ Générer</button>
              <button onClick={onGenerateAstreintes} className="btn-outline" style={{borderColor:'#8b5cf6',color:'#7c3aed'}}>🌙 Astreintes</button>
              {hasP&&(
                <button onClick={onValidate} disabled={validated} className="btn-success">
                  {validated?'✓ Validé':'✓ Valider'}
                </button>
              )}
            </div>
          </div>

          {/* Indispos */}
          {showU&&(
            <div className="g-card" style={{marginBottom:20}}>
              <h3 style={{fontSize:14,fontWeight:600,marginBottom:12,color:'#374151'}}>Indisponibilités — {MOIS[month]} {year}</h3>
              <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'flex-end'}}>
                <div>
                  <span className="g-label">Vétérinaire</span>
                  <select value={uVet} onChange={e=>setUVet(e.target.value)} className="g-input" style={{minWidth:160}}>
                    <option value=''>Choisir…</option>
                    {vets.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
                  </select>
                </div>
                <div>
                  <span className="g-label">Jour</span>
                  <input type="number" min={1} max={numDays} value={uDay} onChange={e=>setUDay(e.target.value)}
                    className="g-input" style={{width:75}}/>
                </div>
                <div>
                  <span className="g-label">Créneau</span>
                  <select value={uSlot} onChange={e=>setUSlot(e.target.value)} className="g-input">
                    <option value="matin">Matin</option>
                    <option value="aprem">Après-midi</option>
                    <option value="all">Toute la journée</option>
                  </select>
                </div>
                <button onClick={doAdd} className="btn-teal">Ajouter</button>
              </div>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {Object.entries(unavail).flatMap(([key,slots])=>
                  ['matin','aprem'].flatMap(slot=>(slots[slot]||[]).map(vid=>{
                    const v=vets.find(x=>x.id===vid);
                    const d=parseInt(key.split('-')[2]);
                    return v?(
                      <span key={key+slot+vid} className="indispo-chip"
                        style={{background:v.color+'18',border:'1px solid '+v.color+'44',color:v.color}}>
                        {v.name} – {d} {MOIS[month].slice(0,3)} ({slot==='matin'?'matin':'ap-m'})
                        <button onClick={()=>doRemove(key,slot,vid)}>×</button>
                      </span>
                    ):null;
                  }))
                )}
                {totalU===0&&<span style={{color:'#9ca3af',fontSize:13}}>Aucune indisponibilité pour ce mois</span>}
              </div>
            </div>
          )}

          {/* Grille */}
          <div className="cal-grid">
            <div className="cal-header-row">
              {JOURS.map((j,i)=><div key={j} className={'cal-header-cell'+(i>=5?' we':'')}>{j}</div>)}
            </div>
            {weeks.map((week,wi)=>(
              <div key={wi} className="cal-week">
                {week.map((day,di)=>{
                  if(!day) return <div key={di} className="cal-cell empty"/>;
                  const key=dk(year,month,day);
                  const dow=dowJS(year,month,day);
                  const closed=!openDays[dow];
                  const dp=planning[key];
                  const alerts=allAlerts[key]||[];
                  const today=new Date().toDateString()===new Date(year,month,day).toDateString();
                  const we=isWE(dow);
                  const wn=isoWeek(year,month,day);
                  const wp=weekParity(year,month,day);

                  return(
                    <div key={di} className={'cal-cell'+(closed?' closed':we?' we-day':'')}
                      onClick={()=>setEditDay(key)}>
                      {/* Numéro + badge semaine */}
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
                        <div className={'cal-day-num'+(today?' today':closed?' closed-n':we?' closed-n':'')}>
                          {day}
                        </div>
                        {!closed&&di===0&&(
                          <span style={{fontSize:8,fontWeight:700,color:wp==='even'?'#1d4ed8':'#be185d',
                            background:wp==='even'?'#dbeafe':'#fce7f3',borderRadius:4,padding:'1px 4px'}}>
                            S{wn} {wp==='even'?'P':'I'}
                          </span>
                        )}
                      </div>

                      {closed?(
                        <div style={{fontSize:9,color:'#d1d5db',textTransform:'uppercase',letterSpacing:'.05em'}}>Fermé</div>
                      ):dp?(
                        <div style={{display:'flex',flexDirection:'column',gap:3}}>
                          {/* Matin */}
                          <SlotMini slot="matin" slotData={dp.matin} vets={vets}
                            unavail={(unavail[key]||{}).matin||[]} />
                          {/* Après-midi */}
                          <SlotMini slot="aprem" slotData={dp.aprem} vets={vets}
                            unavail={(unavail[key]||{}).aprem||[]} />
                        </div>
                      ):(
                        hasP&&<div style={{fontSize:9,color:'#9ca3af',fontStyle:'italic'}}>—</div>
                      )}

                      {/* Astreintes */}
                      <AstrMini astrDay={astreintes[key]} vets={vets} dow={dow}/>

                      {alerts.length>0&&<div className="cal-alert-dot">{alerts.length}</div>}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>

          {/* Légende */}
          <div className="legend">
            {vets.map(v=>(
              <div key={v.id} className="legend-item">
                <div className="legend-dot" style={{background:v.color}}/>
                {v.name}
              </div>
            ))}
            <div style={{display:'flex',gap:8,marginLeft:'auto',alignItems:'center',fontSize:11,color:'#9ca3af'}}>
              <span style={{background:'#dbeafe',color:'#1d4ed8',borderRadius:4,padding:'1px 5px',fontWeight:700,fontSize:10}}>S# P</span> Semaine paire
              <span style={{background:'#fce7f3',color:'#be185d',borderRadius:4,padding:'1px 5px',fontWeight:700,fontSize:10}}>S# I</span> Semaine impaire
            </div>
          </div>

          {/* Alertes */}
          {totalAlerts>0&&(
            <div className="alert-panel">
              <h3 style={{fontSize:13,fontWeight:600,color:'#dc2626',marginBottom:10}}>⚠ {totalAlerts} problème(s) à résoudre</h3>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:'5px 20px'}}>
                {Object.entries(allAlerts).flatMap(([key,alerts])=>
                  alerts.map((a,i)=>{
                    const p=key.split('-'), d=parseInt(p[2]);
                    const dow=new Date(+p[0],+p[1]-1,+p[2]).getDay();
                    return(
                      <div key={key+i} style={{display:'flex',gap:8,fontSize:12,alignItems:'flex-start'}}>
                        <span style={{color:'#9ca3af',minWidth:75,flexShrink:0,fontSize:11}}>
                          {JS_FULL[dow].slice(0,3)} {d} {MOIS[month].slice(0,3)}.
                        </span>
                        <span style={{color:a.level==='error'?'#dc2626':'#d97706'}}>{a.msg}</span>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mini affichage d'un slot dans la cellule

    function AstrMini({astrDay,vets,dow}){
      if(!astrDay||(!astrDay.midi&&!astrDay.soir)) return null;
      const we=isWE(dow);
      const mV=vets.find(v=>v.id===astrDay.midi);
      const sV=vets.find(v=>v.id===astrDay.soir);
      return(
        <div style={{marginTop:3,display:'flex',flexDirection:'column',gap:1}}>
          {astrDay.midi&&mV&&(
            <span className={'astr-badge '+(we?'astr-we':'astr-midi')}>
              ☀️ {mV.name.replace('Dr. ','')}
            </span>
          )}
          {astrDay.soir&&sV&&(
            <span className={'astr-badge '+(we?'astr-we':'astr-soir')}>
              🌙 {sV.name.replace('Dr. ','')}
            </span>
          )}
        </div>
      );
    }

    function SlotMini({slot,slotData,vets,unavail}){
      if(!slotData) return null;
      const h=HORAIRES[slotData.horaire];
      const isMatin=slot==='matin';
      const bg=isMatin?'#fef9ec':'#f0f0ff';
      const col=isMatin?'#92400e':'#4c1d95';
      return(
        <div style={{background:bg,borderRadius:4,padding:'2px 4px'}}>
          <div style={{fontSize:8,fontWeight:700,color:col,letterSpacing:'.04em',textTransform:'uppercase',marginBottom:1}}>
            {isMatin?'🌅':'🌇'} {h.short}
          </div>
          {slotData.vets.map(vid=>{
            const v=vets.find(x=>x.id===vid);
            const warn=unavail.includes(vid);
            return v?(
              <div key={vid} className="vet-chip-sm" style={{color:v.color}}>
                <span className="vet-dot-sm" style={{background:v.color}}/>
                {v.name.replace('Dr. ','')}
                {warn&&<span style={{color:'#ef4444',fontWeight:900}}>!</span>}
              </div>
            ):null;
          })}
          {slotData.vets.length===0&&(
            <div style={{fontSize:9,color:'#ef4444',fontWeight:700}}>Non couvert</div>
          )}
        </div>
      );
    }

    // ─── Modal édition ─────────────────────────────────────────
    function EditModal({datekey,vets,planning,unavail,allAlerts,updateSlot,resolveHoraire,year,month,isoWeek,weekParity,openDays,astreintes,setAstreintes,onClose}){
      const p=datekey.split('-');
      const day=parseInt(p[2]), m=parseInt(p[1])-1, y=+p[0];
      const dow=new Date(y,m,day).getDay();
      const isClosed = openDays ? !openDays[dow] : false;
      const [activeSlot, setActiveSlot] = useState(isClosed ? 'astreinte' : 'matin');
      const dp=planning[datekey]||emptyDay();
      const dayU=unavail[datekey]||{matin:[],aprem:[]};
      const alerts=allAlerts[datekey]||[];
      const wn=isoWeek(y,m,day);
      const wp=weekParity(y,m,day);

      const slotData=dp[activeSlot]||emptySlot(activeSlot==='matin'?'matin_A':'aprem_A');
      const slotU=dayU[activeSlot]||[];
      const slotAlerts=alerts.filter(a=>a.slot===activeSlot);

      const horaireOptions=Object.values(HORAIRES).filter(h=>h.slot===activeSlot);

      const setHoraire=h=>updateSlot(datekey,activeSlot,s=>({...s,horaire:h}));
      const toggleVet=vid=>updateSlot(datekey,activeSlot,s=>({
        ...s,vets:s.vets.includes(vid)?s.vets.filter(x=>x!==vid):[...s.vets,vid]
      }));

      return(
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div>
                  <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,color:'#1f2937'}}>
                    {JS_FULL[dow]} {day} {MOIS[m]}
                    {isClosed&&<span style={{marginLeft:8,fontSize:12,fontWeight:500,color:'#9ca3af',background:'#f3f4f6',borderRadius:6,padding:'2px 8px'}}>Fermé</span>}
                  </h3>
                  <div style={{display:'flex',gap:6,marginTop:4}}>
                    <span style={{fontSize:11,color:'#6b7280'}}>Semaine {wn}</span>
                    <span className={'parity-badge '+(wp==='even'?'parity-even':'parity-odd')}>
                      {wp==='even'?'Paire':'Impaire'}
                    </span>
                  </div>
                </div>
                <button onClick={onClose}
                  style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#9ca3af',lineHeight:1,padding:0}}>×</button>
              </div>
            </div>

            <div className="modal-body">
              {/* Tabs matin/aprem/astreinte */}
              <div className="slot-tabs">
                {[
                  ...(!isClosed ? [['matin','🌅 Matin'],['aprem','🌇 Après-midi']] : []),
                  ['astreinte','🌙 Astreinte']
                ].map(([s,l])=>(
                  <button key={s} onClick={()=>setActiveSlot(s)}
                    className={'slot-tab'+(activeSlot===s?' active':'')}>
                    {l} {alerts.filter(a=>a.slot===s).length>0&&(
                      <span style={{color:'#ef4444',marginLeft:4}}>⚠</span>
                    )}
                  </button>
                ))}
              </div>

              {/* Sections planning (matin / aprem uniquement) */}
              {activeSlot !== 'astreinte' && (
                <>
                  {/* Alertes du slot */}
                  {slotAlerts.length>0&&(
                    <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,padding:10,marginBottom:14}}>
                      {slotAlerts.map((a,i)=>(
                        <div key={i} style={{fontSize:12,color:a.level==='error'?'#dc2626':'#d97706',
                          display:'flex',gap:6,marginBottom:i<slotAlerts.length-1?5:0}}>
                          {a.level==='error'?'✕':'⚠'} {a.msg}
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Choix horaire */}
                  <p className="g-label">Horaire</p>
                  <div style={{display:'flex',gap:8,marginBottom:16}}>
                    {horaireOptions.map(h=>(
                      <div key={h.id} onClick={()=>setHoraire(h.id)}
                        className={'horaire-card'+(slotData.horaire===h.id?' selected':'')}>
                        <div className="htime">{h.label}</div>
                        <div className="htag">{h.slot==='matin'?'Matin':'Après-midi'}</div>
                      </div>
                    ))}
                  </div>

                  {/* Assignation vétos */}
                  <p className="g-label">Vétérinaires assignés</p>
                  <div style={{display:'flex',flexDirection:'column',gap:7}}>
                    {vets.map(v=>{
                      const on=slotData.vets.includes(v.id), inU=slotU.includes(v.id);
                      return(
                        <button key={v.id} onClick={()=>toggleVet(v.id)}
                          className={'vet-toggle'+(on?' on':'')}
                          style={on?{'--vc':v.color+'14','--vb':v.color}:{}}>
                          <div style={{width:11,height:11,borderRadius:'50%',background:v.color,flexShrink:0}}/>
                          <span style={{flex:1,fontWeight:on?600:400,color:'#1f2937'}}>{v.name}</span>
                          {inU&&<span style={{fontSize:10,color:'#d97706',fontWeight:700,
                            background:'#fffbeb',padding:'2px 7px',borderRadius:4,border:'1px solid #fde68a'}}>INDISPO</span>}
                          {on&&<span style={{color:v.color,fontSize:16}}>✓</span>}
                        </button>
                      );

              {/* ── Panneau Astreinte ── */}
              {activeSlot==='astreinte'&&(
                <AstreintePanel datekey={datekey} vets={vets} astreintes={astreintes}
                  setAstreintes={setAstreintes} dow={dow} wp={wp} />
              )}
              <p style={{fontSize:11,color:'#9ca3af',marginTop:14,textAlign:'center'}}>Modifications sauvegardées automatiquement</p>
            </div>
          </div>
        </div>

    // ─── Panneau Astreinte (dans la modal) ────────────────────
    function AstreintePanel({datekey,vets,astreintes,setAstreintes,dow,wp}){
      const dayA  = astreintes[datekey]||{midi:null,soir:null};
      const we    = isWE(dow);

      const set = (slot,vid) => setAstreintes(prev=>({
        ...prev,
        [datekey]:{...( prev[datekey]||{midi:null,soir:null}),[slot]:vid||null}
      }));

      const slots = we
        ? [{key:'midi',label:'☀️ Journée / nuit',desc:'Bloc week-end (midi → réouverture)'}]
        : [
            {key:'midi',label:'☀️ Pause midi',     desc:'Fin matin → début après-midi'},
            {key:'soir',label:'🌙 Soir / nuit',    desc:'Fermeture → réouverture'},
          ];

      return(
        <div>
          {slots.map(({key:slot,label,desc})=>{
            const cur=dayA[slot]||null;
            return(
              <div key={slot} className="astr-section" style={{marginBottom:slot==='midi'&&!we?10:0}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <div>
                    <span style={{fontSize:13,fontWeight:600,color:'#374151'}}>{label}</span>
                    <div style={{fontSize:11,color:'#9ca3af'}}>{desc}</div>
                  </div>
                  {cur&&(
                    <button onClick={()=>set(slot,null)}
                      style={{background:'none',border:'none',cursor:'pointer',fontSize:11,color:'#9ca3af'}}>
                      Effacer
                    </button>
                  )}
                </div>
                <div style={{display:'flex',flexDirection:'column',gap:6}}>
                  {vets.map(v=>{
                    const on=cur===v.id;
                    return(
                      <button key={v.id} onClick={()=>set(slot,on?null:v.id)} style={{
                        display:'flex',alignItems:'center',gap:10,padding:'9px 13px',borderRadius:10,
                        background:on?v.color+'14':'#f9fafb',
                        border:'2px solid '+(on?v.color:'#e2e8f0'),
                        cursor:'pointer',transition:'all .15s',textAlign:'left',
                        fontFamily:"'Inter',sans-serif",fontSize:13,color:'#1f2937'
                      }}>
                        <div style={{width:10,height:10,borderRadius:'50%',background:v.color,flexShrink:0}}/>
                        <span style={{flex:1,fontWeight:on?600:400}}>{v.name}</span>
                        {v.phone&&<span style={{fontSize:11,color:'#6b7280'}}>📞 {v.phone}</span>}
                        {on&&<span style={{color:v.color,fontSize:16}}>✓</span>}
                      </button>
                    );
                  })}
                </div>
              </div>
            );
          })}

          <div style={{marginTop:12,background:'#f0f9ff',border:'1px solid #bae6fd',
            borderRadius:8,padding:'8px 12px',fontSize:11,color:'#0369a1',lineHeight:1.6}}>
            💡 <strong>Règles appliquées à la génération :</strong> priorité aux vétos travaillant jusqu'à 18h30 
            et au lendemain. Le vendredi soir évite le véto de week-end. Charge équilibrée sur l'année.
          </div>
        </div>
      );
    }

    // ─── Onglet Équipe ─────────────────────────────────────────
    function EquipeTab({vets,setVets}){
      const [name,setName]   = useState('');
      const [email,setEmail] = useState('');
      const [phone,setPhone] = useState('');
      const add=()=>{
        if(!name.trim()) return;
        setVets(prev=>[...prev,{id:uid(),name:name.trim(),email:email.trim(),phone:phone.trim(),color:PALETTE[prev.length%PALETTE.length]}]);
        setName('');setEmail('');setPhone('');
      };
      const remove=id=>setVets(prev=>prev.filter(v=>v.id!==id));
      const setColor=(id,c)=>setVets(prev=>prev.map(v=>v.id===id?{...v,color:c}:v));
      const update=(id,f,val)=>setVets(prev=>prev.map(v=>v.id===id?{...v,[f]:val}:v));
      return(
        <div style={{maxWidth:680}}>
          <h2 className="section-title">Équipe vétérinaire</h2>
          <p className="section-desc">L'email Google Workspace sert à envoyer les invitations de planning.</p>
          <div className="g-card" style={{marginBottom:20}}>
            <h3 style={{fontSize:13,fontWeight:600,marginBottom:12,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.06em'}}>Ajouter</h3>
            <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end'}}>
              <div style={{flex:'2 1 180px'}}>
                <span className="g-label">Nom</span>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="Dr. Moreau"
                  className="g-input" style={{width:'100%'}} onKeyDown={e=>e.key==='Enter'&&add()}/>
              </div>
              <div style={{flex:'3 1 220px'}}>
                <span className="g-label">Email Google Workspace</span>
                <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="prenom.nom@cabinet.fr" type="email"
                  className="g-input" style={{width:'100%'}} onKeyDown={e=>e.key==='Enter'&&add()}/>
              </div>
              <div style={{flex:'1 1 130px'}}>
                <span className="g-label">Téléphone (astreinte)</span>
                <input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="06 xx xx xx xx"
                  className="g-input" style={{width:'100%'}} onKeyDown={e=>e.key==='Enter'&&add()}/>
              </div>
              <button onClick={add} className="btn-teal">Ajouter</button>
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {vets.map(v=>(
              <div key={v.id} className="vet-row">
                <div style={{width:14,height:14,borderRadius:'50%',background:v.color,flexShrink:0}}/>
                <div style={{flex:1,display:'flex',gap:8,flexWrap:'wrap'}}>
                  <input value={v.name} onChange={e=>update(v.id,'name',e.target.value)}
                    className="g-input" style={{fontWeight:600,flex:'1 1 140px'}}/>
                  <input value={v.email} onChange={e=>update(v.id,'email',e.target.value)}
                    type="email" className="g-input" style={{flex:'2 1 200px',color:'#6b7280'}}/>
                  <input value={v.phone||''} onChange={e=>update(v.id,'phone',e.target.value)}
                    placeholder="06 xx xx xx xx" className="g-input" style={{flex:'1 1 130px',color:'#6b7280'}}/>
                </div>
                <div style={{display:'flex',gap:4,flexWrap:'wrap',maxWidth:120}}>
                  {PALETTE.map(c=>(
                    <div key={c} onClick={()=>setColor(v.id,c)} style={{
                      width:14,height:14,borderRadius:'50%',background:c,cursor:'pointer',
                      border:v.color===c?'2.5px solid #1f2937':'2px solid transparent',
                      transform:v.color===c?'scale(1.2)':'none',transition:'all .1s'}}/>
                  ))}
                </div>
                <button onClick={()=>remove(v.id)} className="btn-danger-soft">✕</button>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ─── Onglet Règles ─────────────────────────────────────────
    function ReglesTab({rules,setRules,vets,openDays,setOpenDays}){
      const [rType,  setRType]  = useState('min_per_slot');
      const [slot,   setSlot]   = useState('matin');
      const [dType,  setDType]  = useState('weekday');
      const [parity, setParity] = useState('all');
      const [minN,   setMinN]   = useState(2);
      const [vetId,  setVetId]  = useState('');
      const [dow,    setDow]    = useState(1);
      const [horaire,setHoraire]= useState('matin_A');

      const JOURS_FR=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];

      const addRule=()=>{
        const base={id:uid(),type:rType,slot,dayType:dType,weekParity:parity};
        if(rType==='min_per_slot') setRules(prev=>{
          const exists=prev.find(r=>r.type==='min_per_slot'&&r.slot===slot&&r.dayType===dType&&r.weekParity===parity);
          return exists?prev.map(r=>r===exists?{...r,min:minN}:r):[...prev,{...base,min:minN}];
        });
        else if(rType==='horaire_rule') setRules(prev=>{
          const exists=prev.find(r=>r.type==='horaire_rule'&&r.slot===slot&&r.dayType===dType&&r.weekParity===parity);
          return exists?prev.map(r=>r===exists?{...r,horaire}:r):[...prev,{...base,horaire}];
        });
        else if(rType==='never_slot'&&vetId) setRules(prev=>{
          if(prev.some(r=>r.type==='never_slot'&&r.vetId===vetId&&r.slot===slot&&r.dayOfWeek===+dow&&r.weekParity===parity)) return prev;
          return [...prev,{...base,vetId,dayOfWeek:+dow}];
        });
      };

      const pLabel=p=>p==='even'?'Paire':p==='odd'?'Impaire':'Toutes';
      const sLabel=s=>s==='matin'?'Matin':s==='aprem'?'Après-midi':'Tous';
      const labelOf=r=>{
        const pl=<span className={'parity-badge '+(r.weekParity==='even'?'parity-even':r.weekParity==='odd'?'parity-odd':'parity-all')} style={{margin:'0 3px'}}>{pLabel(r.weekParity)}</span>;
        const sl=<span className={'slot-badge '+(r.slot==='matin'?'slot-matin':r.slot==='aprem'?'slot-aprem':'slot-all')} style={{margin:'0 3px'}}>{sLabel(r.slot)}</span>;
        if(r.type==='min_per_slot') return <span>📊 Min. {r.min} véto(s) — {sl} — S. {pl}</span>;
        if(r.type==='horaire_rule'){const h=HORAIRES[r.horaire];return <span>🕐 {sl} → {h?h.label:'?'} — S. {pl}</span>;}
        if(r.type==='never_slot'){const v=vets.find(x=>x.id===r.vetId);return <span>🚫 {v?v.name:'?'} — jamais {sl} le {JS_FULL[r.dayOfWeek]} S. {pl}</span>;}
        return <span>{r.type}</span>;
      };

      const byType=(t)=>rules.filter(r=>r.type===t);

      return(
        <div style={{maxWidth:740}}>
          <h2 className="section-title">Règles & Contraintes</h2>
          <p className="section-desc">Règles par créneau (matin/après-midi) et par parité de semaine.</p>

          {/* Jours ouverture */}
          <div className="g-card" style={{marginBottom:16}}>
            <h3 style={{fontSize:13,fontWeight:600,marginBottom:12,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.06em'}}>Jours d'ouverture</h3>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {JOURS_FR.map((j,i)=>(
                <button key={i} onClick={()=>setOpenDays(prev=>{const n=[...prev];n[i]=!n[i];return n;})}
                  className={'day-toggle '+(openDays[i]?'on':'off')}>{j}</button>
              ))}
            </div>
          </div>

          {/* Règle fixe : créneaux obligatoires */}
          <div className="g-card" style={{marginBottom:16,border:'1.5px solid #99f6e4',background:'#f0fdfa'}}>
            <h3 style={{fontSize:13,fontWeight:600,marginBottom:8,color:'#0d9488',textTransform:'uppercase',letterSpacing:'.06em'}}>
              🔒 Règle fixe — non modifiable
            </h3>
            <div className="rule-row" style={{background:'#fff'}}>
              <span style={{flex:1,fontSize:13}}>
                🏥 <strong>Tous les créneaux ouverts doivent être couverts</strong> — la clinique ouvre et ferme toujours aux mêmes horaires (matin ET après-midi obligatoires chaque jour d'ouverture)
              </span>
              <span className="slot-badge slot-all">Fixe</span>
            </div>
          </div>

          {/* Règles horaires */}
          <div className="g-card" style={{marginBottom:16}}>
            <h3 style={{fontSize:13,fontWeight:600,marginBottom:4,color:'#6b7280',textTransform:'uppercase',letterSpacing:'.06em'}}>
              Horaires par parité <span className="parity-badge parity-even" style={{marginLeft:6}}>Paire</span><span className="parity-badge parity-odd" style={{marginLeft:4}}>Impaire</span>
            </h3>

    // ─── Onglet Sync ───────────────────────────────────────────
    function SyncTab({validated,totalAlerts,planning,vets,year,month,gclientId,setGclientId,calId,setCalId,onExportICS,astreintes}){
      const [copied, setCopied] = useState(false);
      const planDays=Object.keys(planning).filter(k=>planning[k]).length;
      const hasP=planDays>0;
      const s1='<'+'script src="https://accounts.google.com/gsi/client"><'+'/script>';
      const s2='<'+'script src="https://apis.google.com/js/api.js"><'+'/script>';
      const code=s1+'\n'+s2+'\n\nconst GC_CONFIG = {\n  clientId:   "'+(gclientId||'VOTRE_CLIENT_ID.apps.googleusercontent.com')+'",\n  calendarId: "'+(calId||'primary')+'",\n};\n\nfunction connectGoogle() {\n  google.accounts.oauth2.initTokenClient({\n    client_id: GC_CONFIG.clientId,\n    scope: "https://www.googleapis.com/auth/calendar.events",\n    callback: token => { gapi.client.setToken(token); syncPlanning(); },\n  }).requestAccessToken();\n}\n\nasync function syncPlanning() {\n  await gapi.client.load("calendar","v3");\n  for (const [date, dp] of Object.entries(planningData)) {\n    for (const slot of ["matin","aprem"]) {\n      const s = dp[slot]; if (!s||!s.vets.length) continue;\n      const names  = s.vets.map(id => vetsById[id].name).join(", ");\n      const emails = s.vets.map(id => vetsById[id].email).filter(Boolean);\n      await gapi.client.calendar.events.insert({\n        calendarId: GC_CONFIG.calendarId,\n        resource: {\n          summary:   (slot==="matin"?"Matin ":"Après-midi ") + horaires[s.horaire] + " – " + names,\n          start:     { date },\n          end:       { date },\n          attendees: emails.map(email => ({ email })),\n        },\n      });\n    }\n  }\n}';
      const copy=()=>{navigator.clipboard.writeText(code).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);});};
      return(
        <div style={{maxWidth:720}}>
          <h2 className="section-title">Synchronisation Google Calendar</h2>
          <p className="section-desc">Publiez le planning (matin + après-midi) dans les agendas Google Workspace.</p>
          <div className={validated&&totalAlerts===0?'sync-ok':'sync-warn'} style={{marginBottom:20}}>
            {!hasP&&'⚠ Aucun planning généré.'}
            {hasP&&!validated&&'⚠ Planning non validé — cliquez sur "Valider" dans Planning.'}
            {hasP&&validated&&totalAlerts>0&&'⚠ Planning validé avec '+totalAlerts+' alerte(s).'}
            {hasP&&validated&&totalAlerts===0&&'✓ Planning validé — '+planDays+' jours planifiés, prêt à synchroniser.'}
          </div>
          <div className="g-card" style={{marginBottom:20}}>
            <h3 style={{fontSize:15,fontWeight:600,marginBottom:6,color:'#1f2937'}}>📥 Export .ics</h3>
            <p style={{fontSize:13,color:'#6b7280',marginBottom:14}}>
              2 événements par jour (matin + après-midi) avec les horaires. Compatible Google Calendar, Outlook, Apple Calendar.
            </p>
            <button onClick={onExportICS} disabled={!hasP} className="btn-teal">
              ↓ Télécharger planning-{MOIS[month]}-{year}.ics
            </button>
          </div>
          <div className="g-card" style={{marginBottom:20}}>
            <h3 style={{fontSize:15,fontWeight:600,marginBottom:14,color:'#1f2937'}}>🔗 Google Calendar API</h3>
            <div style={{display:'flex',gap:10,marginBottom:14,flexWrap:'wrap'}}>
              <div style={{flex:'2 1 280px'}}>
                <span className="g-label">Client ID OAuth</span>
                <input value={gclientId} onChange={e=>setGclientId(e.target.value)}
                  placeholder="xxxx.apps.googleusercontent.com" className="g-input" style={{width:'100%'}}/>
              </div>
              <div style={{flex:'1 1 140px'}}>
                <span className="g-label">ID agenda</span>
                <input value={calId} onChange={e=>setCalId(e.target.value)} placeholder="primary"
                  className="g-input" style={{width:'100%'}}/>
              </div>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <span style={{fontSize:11,color:'#6b7280',fontWeight:600,textTransform:'uppercase',letterSpacing:'.06em'}}>Code d'intégration</span>
              <button onClick={copy} className="btn-ghost" style={{padding:'4px 12px',fontSize:11}}>{copied?'✓ Copié !':'Copier'}</button>
            </div>
            <div className="code-block" style={{marginBottom:14}}><pre>{code}</pre></div>
            <button disabled={!gclientId||!validated} className="btn-teal"
              onClick={()=>alert('Déployez avec le Client ID configuré dans Google Cloud Console.')}>
              🔗 Connecter & Synchroniser
            </button>
          </div>
          {/* FreePBX */}
          <div className="g-card" style={{marginBottom:20}}>
            <h3 style={{fontSize:15,fontWeight:600,marginBottom:6,color:'#1f2937'}}>📞 Export FreePBX (astreintes)</h3>
            <p style={{fontSize:13,color:'#6b7280',marginBottom:14,lineHeight:1.6}}>
              Génère un JSON de configuration de renvoi d'appel pour FreePBX.<br/>
              À connecter ultérieurement via l'API REST FreePBX / Asterisk AGI.
            </p>
            <FreePBXExport planning={planning} astreintes={astreintes} vets={vets} year={year} month={month}/>
          </div>

          <div className="sync-info">
            <strong style={{display:'block',marginBottom:6,color:'#0d9488'}}>💡 Fonctionnement</strong>
            Chaque jour génère <strong>2 événements</strong> dans Google Calendar (matin + après-midi) avec l'horaire exact.
            Chaque véto assigné reçoit une invitation dans son agenda Google Workspace.
          </div>
        </div>
      );
    }

    // ─── Onglet Statistiques ───────────────────────────────────
    function StatsTab({vets,yearlyData,currentYear,currentMonth,currentPlanning,validated,setYearlyData,astreintes}){
      const [viewYear, setViewYear] = useState(currentYear);

      // Agrège les demi-journées par véto pour une année donnée
      const aggregate = useCallback((yr)=>{
        const months = yearlyData[yr] || {};
        const counts = Object.fromEntries(vets.map(v=>[v.id,{matin:0,aprem:0,matinH:{matin_A:0,matin_B:0},apremH:{aprem_A:0,aprem_B:0},astrMidi:0,astrSoir:0,days:new Set()}]));
        Object.values(months).forEach(({planning:p, astreintes:a})=>{
          if(a) Object.values(a).forEach(({midi,soir})=>{
            if(midi&&load[midi]) load[midi].astrMidi=(load[midi].astrMidi||0)+1;
            if(soir&&load[soir]) load[soir].astrSoir=(load[soir].astrSoir||0)+1;
          });
          Object.entries(p||{}).forEach(([dk,dp])=>{
            if(!dp) return;
            ['matin','aprem'].forEach(slot=>{
              const s=dp[slot]; if(!s||!s.vets.length) return;
              s.vets.forEach(vid=>{
                if(!counts[vid]) return;
                counts[vid][slot]++;
                counts[vid].days.add(dk);
                if(slot==='matin'  && counts[vid].matinH[s.horaire]!==undefined) counts[vid].matinH[s.horaire]++;
                if(slot==='aprem'  && counts[vid].apremH[s.horaire]!==undefined) counts[vid].apremH[s.horaire]++;
              });
            });
          });
        });
        return counts;
      },[vets,yearlyData]);

      const data      = useMemo(()=>aggregate(viewYear),[aggregate,viewYear]);
      const months    = yearlyData[viewYear]||{};
      const hasMonths = Object.keys(months).length>0;
      const years     = [...new Set([...Object.keys(yearlyData).map(Number), currentYear])].sort((a,b)=>b-a);

      // Total équipe pour le graphique
      const maxTotal  = useMemo(()=>Math.max(1,...vets.map(v=>(data[v.id]?.matin||0)+(data[v.id]?.aprem||0))),[data,vets]);
      const totalDJ   = useMemo(()=>vets.reduce((s,v)=>s+(data[v.id]?.matin||0)+(data[v.id]?.aprem||0),0),[data,vets]);

      const removeMonth=(yr,mk)=>{
        setYearlyData(prev=>{
          const yr2={...prev[yr]};
          delete yr2[mk];
          return {...prev,[yr]:yr2};
        });
      };

      return(
        <div style={{maxWidth:900}}>
          <h2 className="section-title">Statistiques annuelles</h2>
          <p className="section-desc">Compteur de demi-journées par vétérinaire, calculé sur les mois validés.</p>

          {/* Sélecteur année + mois validés */}
          <div style={{display:'flex',gap:12,alignItems:'flex-start',marginBottom:24,flexWrap:'wrap'}}>
            <div className="g-card" style={{flex:'0 0 auto',padding:'14px 20px'}}>
              <span className="g-label">Année</span>
              <div style={{display:'flex',gap:6,marginTop:4}}>
                {years.map(y=>(
                  <button key={y} onClick={()=>setViewYear(y)}
                    className={viewYear===y?'btn-teal':'btn-ghost'}
                    style={{padding:'5px 14px',fontSize:13}}>
                    {y}
                  </button>
                ))}
              </div>
            </div>

            <div className="g-card" style={{flex:'1 1 300px',padding:'14px 20px'}}>
              <span className="g-label">Mois validés pour {viewYear}</span>
              <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:4}}>
                {hasMonths ? Object.entries(months).sort((a,b)=>+a[0]-+b[0]).map(([mk,{label}])=>(
                  <span key={mk} style={{display:'inline-flex',alignItems:'center',gap:5,
                    background:'#f0fdf4',border:'1px solid #bbf7d0',color:'#166534',
                    borderRadius:20,padding:'3px 10px',fontSize:12,fontWeight:500}}>
                    ✓ {label}
                    <button onClick={()=>removeMonth(viewYear,mk)}
                      style={{background:'none',border:'none',cursor:'pointer',color:'#6b7280',fontSize:13,padding:0,lineHeight:1}}>×</button>
                  </span>
                )) : (
                  <span style={{fontSize:12,color:'#9ca3af'}}>
                    {validated&&currentYear===viewYear
                      ? 'Le mois en cours n\'est pas encore sauvegardé — cliquez Valider dans Planning'
                      : 'Aucun mois validé — validez un planning depuis l\'onglet Planning'}
                  </span>
                )}
              </div>
            </div>
          </div>

          {!hasMonths ? (
            <div style={{textAlign:'center',padding:'48px 0',color:'#9ca3af'}}>
              <div style={{fontSize:40,marginBottom:12}}>📋</div>
              <p style={{fontSize:14}}>Générez et validez un planning pour voir les statistiques.</p>

                  <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>Demi-journées total</div>
                </div>
                <div className="g-card" style={{textAlign:'center',padding:'16px 12px'}}>
                  <div style={{fontSize:28,fontWeight:700,color:'#0d9488',fontFamily:"'Playfair Display',serif"}}>
                    {(totalDJ/2).toFixed(1)}
                  </div>
                  <div style={{fontSize:12,color:'#6b7280',marginTop:2}}>Équiv. jours complets</div>
                </div>
                <div className="g-card" style={{textAlign:'center',padding:'16px 12px'}}>

                </div>
                <div className="g-card" style={{textAlign:'center',padding:'16px 12px'}}>
                  <div style={{fontSize:28,fontWeight:700,color:'#0d9488',fontFamily:"'Playfair Display',serif"}}>

              {/* Tableau détaillé */}
              <div className="g-card" style={{marginBottom:20,padding:0,overflow:'hidden'}}>
                <div style={{padding:'16px 20px',borderBottom:'1px solid #f1f5f9'}}>
