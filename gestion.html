  <style>

  <style>
    body { background:#f8fafc; }
    .gestion-wrapper { padding-top:90px; padding-bottom:60px; min-height:100vh; }
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#f1f5f9}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}

    /* Onglets */
    .plan-tabs{display:flex;gap:4px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:5px;flex-wrap:wrap}
    .plan-tab{padding:8px 18px;border-radius:10px;border:none;cursor:pointer;font-weight:500;font-size:13px;font-family:'Inter',sans-serif;background:transparent;color:#6b7280;transition:all .18s;display:inline-flex;align-items:center;gap:6px}
    .plan-tab.active{background:#0d9488;color:#fff;font-weight:600}
    .plan-tab:hover:not(.active){background:#f0fdfa;color:#0d9488}

    /* Boutons */
    .btn-teal{background:#0d9488;color:#fff;border:none;border-radius:50px;padding:8px 20px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .btn-teal:hover{background:#0f766e;transform:translateY(-1px)}
    .btn-ghost{background:#f8fafc;color:#6b7280;border:1px solid #e2e8f0;border-radius:50px;padding:7px 16px;font-weight:500;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .btn-ghost:hover{background:#f0fdfa;color:#0d9488;border-color:#99f6e4}
    .btn-outline{background:transparent;color:#0d9488;border:2px solid #0d9488;border-radius:50px;padding:7px 18px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .btn-outline:hover{background:#0d9488;color:#fff}
    .btn-success{background:#10b981;color:#fff;border:none;border-radius:50px;padding:8px 20px;font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
    .btn-success:hover{background:#059669}
    .btn-danger-soft{background:#fef2f2;color:#ef4444;border:1px solid #fecaca;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
    .btn-danger-soft:hover{background:#fee2e2}
    button:disabled{opacity:.45;cursor:not-allowed}

    /* Cards */
    .g-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
    .g-card-sm{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

    /* Inputs */
    .g-input{background:#fff;border:1.5px solid #e2e8f0;color:#1f2937;border-radius:10px;padding:9px 13px;font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
    .g-input:focus{border-color:#0d9488}
    .g-label{font-size:11px;color:#6b7280;margin-bottom:5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;display:block}

    /* Calendrier */
    .cal-grid{background:#fff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .cal-header-row{display:grid;grid-template-columns:repeat(7,1fr);background:#f8fafc;border-bottom:1px solid #e2e8f0}
    .cal-header-cell{padding:10px 0;text-align:center;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9ca3af}
    .cal-header-cell.we{color:#0d9488}
    .cal-week{display:grid;grid-template-columns:repeat(7,1fr)}
    .cal-week:not(:last-child){border-bottom:1px solid #f1f5f9}
    .cal-cell{min-height:120px;padding:6px 5px;border-right:1px solid #f1f5f9;position:relative;transition:background .12s;cursor:pointer;pointer-events:auto !important}
    .cal-cell:last-child{border-right:none}
    .cal-cell:hover{background:#e0fdf4 !important}
    .cal-cell.empty{background:#fafafa;cursor:default;pointer-events:none}
    .cal-cell.closed{background:#fafafa;cursor:pointer}
    .cal-cell.closed:hover{background:#fdf4ff}
    .cal-cell.we-day{background:#fdfffe}
    .cal-cell.holiday{background:#fffbeb !important;cursor:pointer}
    .cal-cell.holiday:hover{background:#fef3c7 !important}
    .cal-day-num{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;margin-bottom:4px;color:#374151}
    .cal-day-num.today{background:#0d9488;color:#fff;font-weight:700}
    .cal-day-num.closed-n{color:#d1d5db}
    .cal-alert-dot{position:absolute;top:5px;right:6px;background:#ef4444;color:#fff;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
    .cal-week-badge{position:absolute;top:5px;left:5px;font-size:8px;font-weight:600;color:#9ca3af;letter-spacing:.03em}

    /* Slot dans la cellule */
    .slot-mini{border-radius:5px;padding:2px 4px;margin-bottom:2px}
    .slot-mini-label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px;opacity:.7}
    .vet-chip-sm{font-size:9px;font-weight:500;display:flex;align-items:center;gap:3px;margin-bottom:1px;line-height:1.3}
    .vet-dot-sm{width:5px;height:5px;border-radius:50%;flex-shrink:0}

    /* Modal */
    .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;backdrop-filter:blur(3px)}
    .modal-box{background:#fff;border-radius:20px;padding:0;width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
    .modal-head{padding:20px 24px 16px;border-bottom:1px solid #f1f5f9;position:sticky;top:0;background:#fff;z-index:1;border-radius:20px 20px 0 0}
    .modal-body{padding:20px 24px 24px}

    /* Slot tabs in modal */
    .slot-tabs{display:flex;gap:4px;background:#f8fafc;border-radius:10px;padding:4px;margin-bottom:16px}
    .slot-tab{flex:1;padding:8px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;transition:all .15s;color:#6b7280;background:transparent;text-align:center}
    .slot-tab.active{background:#fff;color:#0d9488;box-shadow:0 1px 4px rgba(0,0,0,.08)}

    /* Vet toggle buttons */
    .vet-toggle{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:2px solid #e2e8f0;cursor:pointer;transition:all .15s;text-align:left;font-family:'Inter',sans-serif;font-size:13px;width:100%;background:#f9fafb}
    .vet-toggle.on{background:var(--vc,#f0fdfa);border-color:var(--vb,#0d9488)}

    /* Horaire selector */
    .horaire-card{flex:1;padding:10px 12px;border-radius:10px;border:2px solid #e2e8f0;cursor:pointer;transition:all .15s;text-align:center;background:#f9fafb}
    .horaire-card.selected{border-color:#0d9488;background:#f0fdfa}
    .horaire-card .htime{font-size:13px;font-weight:700;color:#1f2937}
    .horaire-card .htag{font-size:10px;color:#6b7280;margin-top:2px}

    /* Règles */
    .rule-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
    .parity-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;letter-spacing:.03em}
    .parity-even{background:#dbeafe;color:#1d4ed8}
    .parity-odd{background:#fce7f3;color:#be185d}
    .parity-all{background:#d1fae5;color:#065f46}
    .slot-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px}
    .slot-matin{background:#fef3c7;color:#92400e}
    .slot-aprem{background:#ede9fe;color:#5b21b6}
    .slot-all{background:#e0f2fe;color:#0369a1}

    /* Day toggle */
    .day-toggle{padding:7px 14px;border-radius:50px;cursor:pointer;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;transition:all .15s}
    .day-toggle.on{background:#0d9488;color:#fff;border:none}
    .day-toggle.off{background:#fff;color:#9ca3af;border:1.5px solid #e2e8f0}

    /* Misc */
    .g-divider{height:1px;background:#f1f5f9;margin:14px 0}
    .alert-panel{margin-top:16px;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:16px}
    .sync-ok{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:14px;font-size:13px;color:#166534}
    .sync-warn{background:#fffbeb;border:1px solid #fde68a;border-radius:10px;padding:14px;font-size:13px;color:#92400e}
    .sync-info{background:#f0fdfa;border:1px solid #99f6e4;border-radius:10px;padding:14px;font-size:13px;color:#134e4a;line-height:1.7}
    .code-block{background:#1e293b;border-radius:10px;padding:14px;overflow-x:auto}
    .code-block pre{color:#94a3b8;font-size:11px;line-height:1.65;font-family:'Fira Code','Cascadia Code',monospace;margin:0;white-space:pre-wrap;word-break:break-word}
    .indispo-chip{border-radius:20px;padding:4px 12px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
    .indispo-chip button{background:none;border:none;cursor:pointer;font-size:15px;line-height:1;padding:0;color:inherit;opacity:.7}
    .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;align-items:center}
    .legend-item{display:flex;align-items:center;gap:5px;font-size:12px;color:#6b7280}
    .legend-dot{width:9px;height:9px;border-radius:50%}
    .vet-row{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;transition:border-color .15s}
    .vet-row:hover{border-color:#99f6e4}
    .section-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#1f2937;margin-bottom:4px}
    .section-desc{color:#6b7280;font-size:13px;margin-bottom:20px}
    .badge-danger{background:#ef4444;color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700}


    /* Astreintes */
    .astr-badge{display:inline-flex;align-items:center;gap:3px;border-radius:4px;padding:1px 5px;font-size:9px;font-weight:700;margin-top:1px}
    .astr-midi{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
    .astr-soir{background:#ede9fe;color:#4c1d95;border:1px solid #c4b5fd}
    .astr-we{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
    .astr-empty{background:#f1f5f9;color:#9ca3af;border:1px dashed #d1d5db}
    .astr-section{background:#fafafa;border:1px solid #e2e8f0;border-radius:10px;padding:12px 14px;margin-top:4px}
    .astr-slot-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .astr-slot-row:last-child{margin-bottom:0}
    .astr-dot-midi{width:8px;height:8px;border-radius:50%;background:#f59e0b;flex-shrink:0}
    .astr-dot-soir{width:8px;height:8px;border-radius:50%;background:#8b5cf6;flex-shrink:0}
    .pref-badge{font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
    @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
    @media(max-width:640px){
      .cal-cell{min-height:80px;padding:4px 3px}
      .plan-tab .tab-label{display:none}
    }

    /* ASV Day Grid Modal */
    .asv-modal-box{background:#fff;border-radius:20px;width:95vw;max-width:980px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 80px rgba(0,0,0,.25)}
    .asv-grid-wrap{overflow:auto;flex:1;cursor:crosshair}
    .asv-grid-tbl{border-collapse:collapse;table-layout:fixed}
    .asv-grid-tbl th{padding:6px 4px;font-size:10px;font-weight:700;text-align:center;position:sticky;top:0;background:#fff;z-index:3;border-bottom:2px solid #e2e8f0;white-space:nowrap}
    .asv-grid-tbl .asv-th-time{width:44px;min-width:44px;text-align:right;padding-right:8px;color:#6b7280;font-size:11px}
    .asv-grid-tbl .asv-th-cov{width:28px;min-width:28px}
    .asv-grid-cell{width:70px;min-width:70px;height:10px;cursor:pointer;transition:none;user-select:none;-webkit-user-select:none;box-sizing:border-box}
    .asv-grid-row.hr td{border-top:1.5px solid #e2e8f0}
    .asv-grid-row.hh td{border-top:1px dashed #f1f5f9}
    .asv-time-lbl{font-size:8px;text-align:right;padding:0 6px;color:#d1d5db;vertical-align:middle;white-space:nowrap}
    .asv-time-lbl.hr{color:#6b7280;font-size:9px;font-weight:600}
    .asv-time-lbl.hh{color:#9ca3af}
    .asv-cov-cell{font-size:8px;text-align:center;vertical-align:middle}
    .asv-gantt-row{position:relative;height:5px;margin-bottom:2px;background:#f8fafc;border-radius:2px;overflow:hidden}
    .asv-gantt-seg{position:absolute;top:0;height:100%;border-radius:2px;pointer-events:none}
  </style>

  <script type="text/babel">
    const { useState, useMemo, useCallback, useEffect, useRef } = React;

    // ─── Persistance Worker KV ─────────────────────────────────
    const API_DATA_URL = '/api/data';

    async function loadRemoteData() {
      const res = await fetch(API_DATA_URL);
      if (!res.ok) throw new Error(`Erreur chargement: ${res.status}`);
      return res.json();
    }

    async function saveRemoteData(data) {
      const res = await fetch(API_DATA_URL, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (!res.ok) throw new Error(`Erreur sauvegarde: ${res.status}`);
    }

    // ─── Constantes ────────────────────────────────────────────
    const JOURS   = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
    const JS_FULL = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
    const MOIS    = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    const PALETTE = ['#0d9488','#f59e0b','#3b82f6','#8b5cf6','#ec4899','#0891b2','#f97316','#16a34a','#be185d','#7c3aed'];

    let HORAIRES = {
 matin_A: { id:'matin_A', label:'8h30 – 12h00', slot:'matin', short:'8h30-12h00' },
 matin_B: { id:'matin_B', label:'9h30 – 13h30', slot:'matin', short:'9h30-13h30' },
 aprem_A: { id:'aprem_A', label:'13h30 – 17h00', slot:'aprem', short:'13h30-17h00' },
 aprem_B: { id:'aprem_B', label:'15h00 – 19h00',slot:'aprem', short:'15h00-19h00' },
};
    // Heure de fin par horaire (pour la règle "celui qui finit le tard est d'astreinte")
    let HORAIRE_END_TIME = { matin_A: 12, matin_B: 13.5, aprem_A: 17, aprem_B: 19 };

    // ─── Helpers ───────────────────────────────────────────────
    const uid         = () => Math.random().toString(36).slice(2,8);
    const daysInMonth = (y,m) => new Date(y,m+1,0).getDate();
    const firstCol    = (y,m) => (new Date(y,m,1).getDay()+6)%7;
    const dowJS       = (y,m,d) => new Date(y,m,d).getDay();
    const isWE        = (dow) => dow===0||dow===6;
    const dk          = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

    function isoWeek(y,m,d) {
      const date = new Date(y,m,d);
      const day  = date.getDay()||7;
      date.setDate(date.getDate()+4-day);
      const yearStart = new Date(date.getFullYear(),0,1);
      return Math.ceil((((date-yearStart)/86400000)+1)/7);
    }
    const isEvenWeek = (y,m,d) => isoWeek(y,m,d)%2===0;
    const weekParity = (y,m,d) => isEvenWeek(y,m,d)?'even':'odd';

    // ─── Jours fériés français ─────────────────────────────────
    function easterDate(year) {
      // Algorithme de Meeus/Jones/Butcher
      const a=year%19, b=Math.floor(year/100), c=year%100;
      const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25);
      const g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30;
      const i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7;
      const m=Math.floor((a+11*h+22*l)/451);
      const mo=Math.floor((h+l-7*m+114)/31)-1;
      const dy=((h+l-7*m+114)%31)+1;
      return new Date(year,mo,dy);
    }
    function getFrenchHolidays(year) {
      const easter=easterDate(year);
      const addDays=(base,n)=>{ const d=new Date(base); d.setDate(d.getDate()+n); return d; };
      const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      return new Set([
        fmt(new Date(year,0,1)),    // 1er janvier
        fmt(addDays(easter,1)),      // Lundi de Pâques
        fmt(new Date(year,4,1)),    // 1er mai
        fmt(new Date(year,4,8)),    // 8 mai
        fmt(addDays(easter,39)),     // Ascension
        fmt(addDays(easter,50)),     // Lundi de Pentecôte
        fmt(new Date(year,6,14)),   // 14 juillet
        fmt(new Date(year,7,15)),   // 15 août
        fmt(new Date(year,10,1)),   // 1er novembre
        fmt(new Date(year,10,11)),  // 11 novembre
        fmt(new Date(year,11,25)),  // 25 décembre
      ]);
    }
    const HOLIDAY_NAMES = {
      '01-01':'Jour de l\'An', '05-01':'Fête du Travail', '05-08':'Victoire 1945',
      '07-14':'Fête Nationale', '08-15':'Assomption', '11-01':'Toussaint',
      '11-11':'Armistice', '12-25':'Noël',
    };
    function getHolidayName(datekey, holidays) {
      if(!holidays||!holidays.has(datekey)) return null;
      const mm_dd = datekey.slice(5);
      if(HOLIDAY_NAMES[mm_dd]) return HOLIDAY_NAMES[mm_dd];
      // Jours mobiles
      const [y,mo,d]=datekey.split('-').map(Number);
      const easter=easterDate(y);
      const addDays=(base,n)=>{const dt=new Date(base);dt.setDate(dt.getDate()+n);return dt;};
      const fmt=dt=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
      if(fmt(addDays(easter,1))===datekey) return 'Lundi de Pâques';
      if(fmt(addDays(easter,39))===datekey) return 'Ascension';
      if(fmt(addDays(easter,50))===datekey) return 'Lundi de Pentecôte';
      return 'Jour férié';
    }

    function parityMatch(ruleParity, y,m,d) {
      if (ruleParity==='all') return true;
      return ruleParity===weekParity(y,m,d);
    }

    function isWeekday(dow) {
      return dow >= 1 && dow <= 5;
    }

    function matchRuleScope(rule, y, m, d) {
      const dow = dowJS(y, m, d);
      if (rule.weekParity !== 'all' && !parityMatch(rule.weekParity, y, m, d)) return false;
      if (rule.dayType === 'weekday' && !isWeekday(dow)) return false;
      if (rule.dayType === 'weekend' && isWeekday(dow)) return false;
      if (rule.dayOfWeek !== undefined && rule.dayOfWeek !== dow) return false;
      return true;
    }

    function matchHoraireRule(rule, y, m, d) {
      return matchRuleScope(rule, y, m, d);
    }

    const _scriptCache = {};
    function loadScriptOnce(src) {
      if (!_scriptCache[src]) {
        _scriptCache[src] = new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src;
          s.async = true;
          s.onload = () => resolve();
          s.onerror = () => { delete _scriptCache[src]; reject(new Error('Échec du chargement de ' + src)); };
          document.head.appendChild(s);
        });
      }
      return _scriptCache[src];
    }

    function App() {

        URL.revokeObjectURL(url);
      },[vets,rules,openDays,planning,unavail,validated,yearlyData,astreintes,asvs,asvRules,asvPlanning,asvUnavailRanges,asvPersonalRules,horaireTimes,gclientId,calId]);

      const importJSON = useCallback(()=>{

      // ══════════════════════════════════════════════════════════════

      // ══════════════════════════════════════════════════════════════
      //
      //  Phase 1 : Blocs WE/JF  → un seul vétérinaire par bloc,
      //            équilibré sur l'année ; inclut la veille ouvrée si JF
      //  Phase 2 : Astreintes soir (jours ouvrés)
      //            → équilibrage soir/mois ; espacement min entre 2 soirs
      //            du même véto ; pénalité si lendemain non travaillé ou WE
      //  Phase 3 : Planning (jours travaillés)
      //            → le véto de soir DOIT travailler ce jour et reçoit
      //              le créneau le plus tardif (aprem_B 18h30)
      //            → équilibrage global demi-journées + fin 17h entre vétérinaires
      //
      const generateAll = useCallback(()=>{
 const newA = {}; // astreintes finales
 const newP = {}; // planning final
 const dk_ = (y,m,d) => `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

 // ── Info journalière ──────────────────────────────────────────
 const dayInfo = {};
 for(let d=1; d<=numDays; d++){
 const key = dk_(year, month, d);
 const dow = dowJS(year, month, d);
 const isHol = holidays.has(key);
 const isClosed = (!openDays[dow]) || isHol;
 const isOpen = !isClosed;
 dayInfo[d] = { key, dow, isClosed, isHoliday: isHol, isOpen };
 }

 // Indispos : matin/aprem/midi/soir
 const isUnavailOn = (vetId, key, slot) => {
 const u = unavail[key] || {};
 if(!slot){
 return (u.matin||[]).includes(vetId) || (u.aprem||[]).includes(vetId) || (u.midi||[]).includes(vetId) || (u.soir||[]).includes(vetId);
 }
 return (u[slot]||[]).includes(vetId);
 };

 // Règles fixes : si un véto ne travaille jamais ce créneau ce jour-là, il ne peut pas être d'astreinte (contrainte sur les autres)
 const isForbiddenRule = (vetId, dayNum, slot) => {
 const dow = dayInfo[dayNum].dow;
 return rules.some(r=>
 r.type==='never_slot' &&
 (r.slot===slot || r.slot==='all') &&
 r.dayOfWeek===dow &&
 parityMatch(r.weekParity, year, month, dayNum) &&
 r.vetId===vetId
 );
 };
 const forbiddenDay = (vetId, dayNum) => (
 isForbiddenRule(vetId, dayNum, 'all') ||
 isForbiddenRule(vetId, dayNum, 'matin') ||
 isForbiddenRule(vetId, dayNum, 'aprem')
 );

 // ── Charge historique (yearlyData) ────────────────────────────
 const historicalLoad = Object.fromEntries(vets.map(v=>[v.id,{dj:0, weJf:0, soir:0}]));
 Object.entries(yearlyData).forEach(([yr, months])=>{
 const yHols = getFrenchHolidays(parseInt(yr));
 Object.values(months).forEach(({astreintes:a, planning:p})=>{
 if(a){
 const sortedKeys = Object.keys(a).sort();
 sortedKeys.forEach(key=>{
 const [ky,km,kd] = key.split('-').map(Number);
 const dow2 = new Date(ky, km-1, kd).getDay();
 const isHol2 = yHols.has(key);
 const isClosed2 = isWE(dow2) || isHol2;
 const vid = a[key]?.soir;
 if(isClosed2){
 const prev = new Date(ky, km-1, kd-1);
 const prevKey = dk_(prev.getFullYear(), prev.getMonth(), prev.getDate());
 const prevClosed = isWE(prev.getDay()) || yHols.has(prevKey);
 if(!prevClosed && vid && historicalLoad[vid]) historicalLoad[vid].weJf++;
 } else {
 if(vid && historicalLoad[vid]) historicalLoad[vid].soir++;
 }
 });
 }
 if(p){
 Object.entries(p).forEach(([k,dp])=>{
 if(!dp) return;
 ['matin','aprem'].forEach(slot=>{
 const slotArr = toSlotArr(dp[slot]);
 const vids = [...new Set(slotArr.flatMap(s=>s.vets||[]))];
 vids.forEach(vid=>{ if(historicalLoad[vid]) historicalLoad[vid].dj++; });
 });
 });
 }
 });
 });
 // FIX: nouveau véto → initialiser à la moyenne des vétérinaires EXISTANTS
 // Un véto sans historique ne doit pas avoir un score de 0 (il serait toujours choisi)
 // ni recevoir avgDj en plus de son historique (les anciens seraient pénalisés)
 const existingVets = vets.filter(v => {
   const b = historicalLoad[v.id];
   return b && (b.dj > 0 || b.weJf > 0 || b.soir > 0);
 });
 const refCount = Math.max(1, existingVets.length);
 const avgDj   = existingVets.reduce((s,v)=>s+(historicalLoad[v.id]?.dj||0),   0) / refCount;
 const avgWeJf = existingVets.reduce((s,v)=>s+(historicalLoad[v.id]?.weJf||0), 0) / refCount;
 const avgSoir = existingVets.reduce((s,v)=>s+(historicalLoad[v.id]?.soir||0), 0) / refCount;
 const load = Object.fromEntries(vets.map(v=>{
 const base = historicalLoad[v.id];
 const isNew = !base || (base.dj === 0 && base.weJf === 0 && base.soir === 0);
 return [v.id, {
   dj:   isNew ? avgDj   : base.dj,
   weJf: isNew ? avgWeJf : base.weJf,
   soir: isNew ? avgSoir : base.soir,
 }];
 }));

 // ─────────────────────────────────────────────────────────────
 // PHASE 1 : blocs dimanche + jours fériés (incluant la veille)
 // ─────────────────────────────────────────────────────────────
 const units = [];
 const addUnit = (days, reason) => {
 const clean = [...new Set(days.filter(x=>x>=1 && x<=numDays))].sort((a,b)=>a-b);
 if(clean.length) units.push({days: clean, reason});
 };

 // unités jours fériés
 for(let d=1; d<=numDays; d++){
 if(!dayInfo[d].isHoliday) continue;
 const dow = dayInfo[d].dow;
 const days = [d];
 if(d-1>=1) days.unshift(d-1);
 if(dow===1){ if(d-2>=1) days.unshift(d-2); if(d-1>=1) days.unshift(d-1); }
 if(dow===5){ if(d+1<=numDays) days.push(d+1); if(d+2<=numDays) days.push(d+2); }
 addUnit(days,'JF');
 }

 // unités dimanches (samedi+dimanche) si pas déjà couvert
 for(let d=1; d<=numDays; d++){
 if(dayInfo[d].dow!==0) continue;
 if(units.some(u=>u.days.includes(d))) continue;
 addUnit([d-1,d],'DIM');
 }

 // fusion unités chevauchantes
 let changed = true;
 while(changed){
 changed = false;
 for(let i=0;i<units.length;i++){
 for(let j=i+1;j<units.length;j++){
 const a = units[i], b = units[j];
 if(a.days.some(x=>b.days.includes(x))){
 units[i] = {days:[...new Set([...a.days,...b.days])].sort((x,y)=>x-y), reason:a.reason+'+'+b.reason};
 units.splice(j,1);
 changed = true;
 break;
 }
 }
 if(changed) break;
 }
 }

 // assignation blocs
 const unitDaysSet = new Set();
 const lastChosenByVet = Object.fromEntries(vets.map(v=>[v.id, -999]));
 const unitScore = (vid, start, days) => {
 let s = (load[vid]?.weJf||0)*100 + (load[vid]?.soir||0)*8 + (load[vid]?.dj||0)*2;
 const dist = start - (lastChosenByVet[vid]||-999);
 if(dist<=2) s += 80; else if(dist<=4) s += 35;
 days.forEach(dd=>{
 const k = dayInfo[dd].key;
 // règle fixe : ne peut pas être d'astreinte si ne travaille pas ce jour-là
 if(forbiddenDay(vid, dd)) s += 1200;
 // indispos : pas d'astreinte
 if(dayInfo[dd].isOpen){ if(isUnavailOn(vid,k,'matin')) s+=1000; if(isUnavailOn(vid,k,'aprem')) s+=1000; }
 if(isUnavailOn(vid,k,'soir') || isUnavailOn(vid,k,'midi')) s+=1000;
 });
 return s;
 };

 for(let d=1; d<=numDays; d++){

 elig.sort((a,b)=>score(a)-score(b));
 const chosen = elig[0] || null;

 const workLoad = Object.fromEntries(vets.map(v=>[v.id,{dj:0}]));

 for(let d=1; d<=numDays; d++){

   r.type==='vet_slot_rule' &&

 const pickVet = (cands, bias=null) => {

   const isMatSlot = subR.slot==='matin';
   const tgt = (isMatSlot ? day.matin : day.aprem).find(s=>s.horaire===subR.horaire);

   const slotName = isMatSlot ? 'matin' : 'aprem';
   const crossHoraire = isMatSlot
     ? (subR.horaire==='matin_A' ? 'aprem_B' : 'aprem_A')

     const inCross = vetsIn(crossSide, crossHoraire);

 matAssigned().forEach(vid=>{
 if(aprAssigned().includes(vid)) return;
 if(!canWork(vid,'aprem')) return;
 const mH = day.matin.find(s=>s.vets.includes(vid))?.horaire || 'matin_A';
 const requiredAprem = mH === 'matin_A' ? 'aprem_A' : 'aprem_B';
 const tgt = day.aprem.find(s=>s.horaire===requiredAprem);
 if(tgt && !tgt.vets.includes(vid) && !aprAssigned().includes(vid)) tgt.vets.push(vid);
 });

 aprAssigned().forEach(vid=>{
 if(matAssigned().includes(vid)) return;
 if(!canWork(vid,'matin')) return;

const generateAstreintes = useCallback(()=>{

      // ── Génération Planning ASV ────────────────────────────────
      const generateASVPlanning = useCallback(()=>{

          const r = pr.find(r => r.type === 'late_start' && r.dow === getDowOfDay(d));

        // ── Chevauchement ───────────────────────────────────────
        const overlaps = (s1,e1,s2,e2) => s1<e2 && e1>s2;

        // ── Indisponibilité ─────────────────────────────────────

            const rS=dateKey===r.fromDate?r.fromTime:0;

        // ── Pauses déjeuner décalées ────────────────────────────
        // Génère des segments individuels pour N ASVs.
        // Règle ouverture/fermeture :
        //   - MAX_EARLY_ASVS premiers : débutent à S (= heure véto - 30min)
        //   - MAX_LATE_ASVS  derniers : finissent à E (= heure véto + 30min)
        //   - Les autres            : débutent et finissent aux heures véto (S+0.5, E-0.5)
        //   - "Pas forcément les mêmes" : si n ≤ 4, certains ont les deux rôles.
        // Mode journée longue (span > MAX_DAY_HOURS+lb+1h) :
        //   Les premiers MAX_EARLY_ASVS démarrent à S, les derniers MAX_LATE_ASVS
        //   finissent à E. Les intermédiaires sont distribués entre vetStart et vetEnd.
        // h_override[asvId] = heures réelles (uniquement pour shifts partiels réels)
        const computeStaggered = (asvIds, S, E, lb, hOverride={}) => {
          const res = {};

            // ── Mode journée longue ────────────────────────────────

            // Derniers MAX_LATE_ASVS  : finissent à E (fermeture)

            const baseStep = n > 1 ? Q((totalSpan - maxShiftSpan) / (n - 1)) : 0;
            asvIds.forEach((aid, i) => {
              const earlyStart = i < MAX_EARLY_ASVS;
              const lateEnd    = i >= n - MAX_LATE_ASVS;
              const conflict   = earlyStart && lateEnd;
              let shiftStart, shiftEnd;

                shiftStart = Q(S + i * baseStep);
                shiftEnd   = Q(shiftStart + maxShiftSpan);
              } else if(earlyStart) {
                shiftStart = S;
                shiftEnd   = Q(S + maxShiftSpan);
              } else if(lateEnd) {
                shiftEnd   = E;
                shiftStart = Q(E - maxShiftSpan);

                const innerN = Math.max(1, n - MAX_EARLY_ASVS - MAX_LATE_ASVS);
                const innerI = i - MAX_EARLY_ASVS;

                const rEnd   = Q(E - 0.5 - maxShiftSpan);

                  ? Q(rStart + rLen / 2)
                  : Q(rStart + rLen * innerI / (innerN - 1));
                shiftEnd = Q(shiftStart + maxShiftSpan);
              }
              const midShift = Q(shiftStart + MAX_DAY_HOURS * 0.5);
              const ls = Q(Math.min(
                Math.max(shiftStart + 0.5, Math.min(midShift, shiftEnd - lb - 0.5)),
                shiftStart + 6 - eps  // L3121-16 : pause avant 6h continu
              ));
              const le = Q(ls + lb);
              const segs = [];
              if(ls > shiftStart) segs.push({start: shiftStart, end: ls});
              if(le < shiftEnd)   segs.push({start: le,         end: shiftEnd});
              if(!segs.length)    segs.push({start: shiftStart, end: shiftEnd});

          const totalLBSpan = n * lb;
          const firstLS = Math.max(Q(S + 0.5), Math.min(Q(13.0 - totalLBSpan/2), Q(E - 0.5 - totalLBSpan)));

          asvIds.forEach((aid, i)=>{

            const earlyStart = i < MAX_EARLY_ASVS;
            const lateEnd    = i >= n - MAX_LATE_ASVS;
            const start      = earlyStart ? S     : Q(S + 0.5);  // ouverture ou heure véto

            let ls = Q(firstLS + i * lb);

        const getRotOrderFor = (d, availItems, wn) => {

        // ══════════════════════════════════════════════════════
        sortedWeeks.forEach(wn => {

              const rem = remH(asv.id, wn);
              if(rem < minSH - eps) return;
              const info = dayInfoMap[d];
              if(isOn(asv.id, info.key)) return;
              if(hasAsvDayOff(asv.id, d)) return;
              if(isUnavailAt(asv.id, info.key, info.asvStart, info.asvEnd)) return;
              const h = Math.min(rem, info.hoursFullDay);
              if(h < minSH - eps) return;
              const type = h < info.hoursFullDay - eps ? 'renfort_partiel' : 'renfort_jour';
              markAssign(info.key, asv.id, type, Q(h), 60);
              addWH(asv.id, wn, h);
            });
          });
        });

        // ══════════════════════════════════════════════════════
        // PHASE 4 — Ajustement exact des heures (≡ contrat)
        //
        //  DÉPASSEMENT : rogner hDay sur le jour le mieux couvert
        //    → type 'renfort_partiel' → computeStaggered génère des
        //      segments courts (début plus tardif / fin plus tôt).
        //
        //  MANQUE : allonger un jour déjà assigné si possible,
        //    sinon ajouter un créneau sur un jour non travaillé.
        //    Objectif : total hebdo = exactement le contrat de l'ASV.
        // ══════════════════════════════════════════════════════
        sortedWeeks.forEach(wn => {
          const days = weekDaysMap[wn];
          asvs.forEach(asv => {
            const actual = Q(getWH(asv.id, wn));
            const target = Q(contractH(asv.id));
            let delta = Q(actual - target); // >0 trop, <0 manque

            if(delta > eps) {
              // Rogner en priorité sur les jours avec couverture multiple
              // (d'autres ASVs présents → pas de moment sans ASV)
              const assignedDays = days
                .filter(d => dayInfoMap[d] && isOn(asv.id, dayInfoMap[d].key))
                .sort((a,b) => dayInfoMap[b].vetCount - dayInfoMap[a].vetCount);

              // Passe A : jours avec ≥2 ASVs → changement sûr en renfort_partiel
              for(const d of assignedDays) {
                if(delta <= eps) break;
                const info = dayInfoMap[d];
                const otherASVs = Object.keys(assign[info.key] || {}).filter(oid => oid !== asv.id);
                if(otherASVs.length === 0) continue; // seul ASV → préserver la couverture
                const curr = assign[info.key]?.[asv.id];
                if(!curr) continue;
                const canTrim = Q(curr.hDay - minSH);
                if(canTrim <= eps) continue;
                const trim = Q(Math.min(delta, canTrim));
                const newType = curr.type === 'renfort_matin' ? 'renfort_matin' : 'renfort_partiel';
                assign[info.key][asv.id] = {...curr, hDay: Q(curr.hDay - trim), type: newType};
                addWH(asv.id, wn, -trim);
                delta = Q(delta - trim);
              }

              // Passe B : si toujours en dépassement, rogner les jours à couverture unique
              // en réduisant hDay SANS changer le type (segments restent complets →
              // la couverture est préservée, on ajuste seulement le compteur d'heures)
              if(delta > eps) {
                for(const d of assignedDays) {
                  if(delta <= eps) break;
                  const info = dayInfoMap[d];
                  const curr = assign[info.key]?.[asv.id];
                  if(!curr || curr.type === 'renfort_partiel') continue;
                  const canTrim = Q(curr.hDay - minSH);
                  if(canTrim <= eps) continue;
                  const trim = Q(Math.min(delta, canTrim));
                  // Garder le type original : les segments resteront pleine journée
                  assign[info.key][asv.id] = {...curr, hDay: Q(curr.hDay - trim)};
                  addWH(asv.id, wn, -trim);
                  delta = Q(delta - trim);
                }
              }
            } else if(delta < -eps) {
              // Allonger d'abord les jours déjà assignés (moins couvert = priorité)
              let rem = Q(-delta);
              const assignedDays = days
                .filter(d => dayInfoMap[d] && isOn(asv.id, dayInfoMap[d].key))
                .sort((a,b) => dayInfoMap[a].vetCount - dayInfoMap[b].vetCount);
              for(const d of assignedDays) {
                if(rem <= eps) break;
                const info = dayInfoMap[d];
                const curr = assign[info.key]?.[asv.id];
                if(!curr) continue;
                const canExt = Q(info.hoursFullDay - curr.hDay);
                if(canExt <= eps) continue;
                const ext = Q(Math.min(rem, canExt));
                const newHDay = Q(curr.hDay + ext);
                const newType = newHDay >= info.hoursFullDay - eps
                  ? (curr.type === 'renfort_partiel' ? 'renfort_jour' : curr.type)
                  : curr.type;
                assign[info.key][asv.id] = {...curr, hDay: newHDay, type: newType};
                addWH(asv.id, wn, ext);
                rem = Q(rem - ext);
              }
              // Ajouter un créneau sur un jour non travaillé si manque encore ≥ minSH
              if(rem >= minSH - eps) {
                const unassigned = days
                  .filter(d => dayInfoMap[d] && !isOn(asv.id, dayInfoMap[d].key))
                  .sort((a,b) => dayInfoMap[b].vetCount - dayInfoMap[a].vetCount);
                for(const d of unassigned) {
                  if(rem < minSH - eps) break;
                  const info = dayInfoMap[d];
                  if(hasAsvDayOff(asv.id, d)) continue;
                  if(isUnavailAt(asv.id, info.key, info.asvStart, info.asvEnd)) continue;
                  const h = Q(Math.min(rem, info.hoursFullDay));
                  if(h < minSH - eps) continue;
                  const type = h < info.hoursFullDay - eps ? 'renfort_partiel' : 'renfort_jour';
                  markAssign(info.key, asv.id, type, h, 65);
                  addWH(asv.id, wn, h);
                  rem = Q(rem - h);
                }
              }
            }
          });
        });

        // ── Conversion affectations → segments horaires ─────────
        const newASVP={};
        Object.entries(assign).forEach(([key,dayAssign])=>{
          const d=parseInt(key.slice(8));
          const info=dayInfoMap[d]; if(!info) return;

          // Trier par order : ouvreur (0) en tête, fermeur (999) en queue
          // → computeStaggered reçoit la liste dans le bon sens du roulement
          const matinIds=[], fullIds=[], fullHours={};
          Object.entries(dayAssign)
            .sort(([,a],[,b]) => a.order - b.order)
            .forEach(([aid,{type,hDay}])=>{
              if(type==='renfort_matin'){
                matinIds.push(aid);
              } else {
                fullIds.push(aid);
                fullHours[aid]=hDay;
              }
            });

          const dayData={};

          // Journée (complète ou partielle) : pauses staggerées
          if(fullIds.length>0){
            if(info.fullDay){
              // Séparer les ASVs en couverture totale (full/full_over/renfort_jour)
              // et les shifts réellement partiels (renfort_partiel, quota insuffisant).
              // Les ASVs en couverture totale sont passés SANS hOverride : computeStaggered
              // active alors le mode journée longue si nécessaire, décale les débuts
              // de shift et garantit la présence d'ASVs après 17h.
              const fullCoverIds = fullIds.filter(aid => dayAssign[aid].type !== 'renfort_partiel');
              const partialIds   = fullIds.filter(aid => dayAssign[aid].type === 'renfort_partiel');

              if(fullCoverIds.length > 0){
                // Pas d'hOverride → couverture journée entière / mode longue journée auto
                const stag = computeStaggered(fullCoverIds, info.asvStart, info.asvEnd, asvRules.lunchBreak, {});
                fullCoverIds.forEach(aid=>{
                  dayData[aid]={...stag[aid], type: dayAssign[aid].type};
                });
              }
              if(partialIds.length > 0){
                // hOverride avec les heures réelles disponibles (quota partiel)
                const partialHours = {};
                partialIds.forEach(aid => { partialHours[aid] = fullHours[aid]; });
                const stag = computeStaggered(partialIds, info.asvStart, info.asvEnd, asvRules.lunchBreak, partialHours);
                partialIds.forEach(aid=>{
                  dayData[aid]={...stag[aid], type: dayAssign[aid].type};
                });
              }
            } else {
              // Demi-journée : ouverture/fermeture max 2 ASVs
              // Si la plage ≥ 6h → pause obligatoire (L3121-16), segments en deux parties
              const nFull = fullIds.length;
              let earlyStarts = 0;
              fullIds.forEach((aid, i) => {
                const hDay = dayAssign[aid].hDay;
                const earlyStart = earlyStarts < MAX_EARLY_ASVS;
                const lateEnd    = i >= nFull - MAX_LATE_ASVS;
                const start  = earlyStart ? info.asvStart : Q(info.asvStart + 0.5);
                const maxEnd = lateEnd    ? info.asvEnd   : Q(info.asvEnd - 0.5);
                if(earlyStart) earlyStarts++;
                const span = Q(maxEnd - start);
                if(span >= 6 - eps) {
                  // Pause centrée dans la fenêtre [LUNCH_MIN_START, LUNCH_MAX_END], avant 6h continus
                  const lb2 = asvRules.lunchBreak;
                  const lsIdeal = Q(start + (span - lb2) / 2);
                  const ls = Math.max(Q(LUNCH_MIN_START), Math.min(lsIdeal, Q(LUNCH_MAX_END - lb2), Q(start + 6 - eps)));
                  const le = Q(ls + lb2);
                  dayData[aid] = {segments:[{start, end:ls},{start:le, end:maxEnd}], type:dayAssign[aid].type};
                } else {
                  const end = Q(Math.min(start + hDay, maxEnd));
                  dayData[aid] = {segments:[{start, end}], type:dayAssign[aid].type};
                }
              });
            }
          }

          // Renfort matin : règle ouverture/fermeture + pause si plage ≥ 6h (L3121-16)
          let earlyStarts = Object.values(dayData).filter(d => d.segments[0]?.start === info.asvStart).length;
          const nMatin = matinIds.length;
          const morningCap = info.morningEnd || info.asvEnd;
          matinIds.forEach((aid, i) => {
            const hDay = dayAssign[aid].hDay;
            const earlyStart = earlyStarts < MAX_EARLY_ASVS;
            const lateEnd    = i >= nMatin - MAX_LATE_ASVS;
            const start  = earlyStart ? info.asvStart : Q(info.asvStart + 0.5);
            const maxEnd = lateEnd    ? morningCap    : Q(morningCap - 0.5);
            if(earlyStart) earlyStarts++;
            const span = Q(maxEnd - start);
            if(span >= 6 - eps) {
              const lb2 = asvRules.lunchBreak;
              const lsIdeal = Q(start + (span - lb2) / 2);
              const ls = Math.max(Q(LUNCH_MIN_START), Math.min(lsIdeal, Q(LUNCH_MAX_END - lb2), Q(start + 6 - eps)));
              const le = Q(ls + lb2);
              const workAfter = Q(hDay - (ls - start));
              const end = Q(Math.min(le + workAfter, maxEnd));
              dayData[aid] = {segments:[{start, end:ls},{start:le, end}], type:'renfort_matin'};
            } else {
              const end = Q(Math.min(start + hDay, maxEnd));
              dayData[aid] = {segments:[{start, end}], type:'renfort_matin'};
            }
          });

          // ── Appliquer règles early_end et late_start ────────────
          Object.keys(dayData).forEach(aid=>{
            const ad = dayData[aid];
            if(!ad || !ad.segments) return;
            let segs = ad.segments;

            // Début tardif : décale le début des segments
            const lateStart = getAsvLateStart(aid, d);
            if(lateStart !== null){
              segs = segs
                .map(seg => ({...seg, start: Math.max(seg.start, lateStart)}))
                .filter(seg => seg.start < seg.end - 0.01);
            }

            // Fin anticipée : tronque la fin des segments
            const earlyEnd = getAsvEarlyEnd(aid, d);
            if(earlyEnd !== null){
              segs = segs
                .map(seg => ({...seg, end: Math.min(seg.end, earlyEnd)}))
                .filter(seg => seg.start < seg.end - 0.01);
            }

            if(segs.length > 0) dayData[aid] = {...ad, segments: segs};
            else delete dayData[aid];
          });

          newASVP[key]=dayData;
        });

        setAsvPlanning(prev=>{
          const next={...prev};
          Object.keys(next).filter(k=>k.startsWith(prefix)).forEach(k=>delete next[k]);
          Object.assign(next,newASVP);
          return next;
        });
      },[year,month,numDays,planning,openDays,holidays,asvs,asvRules,asvUnavailRanges,asvPersonalRules]);

const numDays  = useMemo(()=>daysInMonth(year,month),[year,month]);
      const startCol = useMemo(()=>firstCol(year,month),[year,month]);
      const holidays = useMemo(()=>getFrenchHolidays(year),[year]);

      // Quel horaire s'applique pour un slot à une date donnée ?
      const resolveHoraire = useCallback((y,m,d,slot)=>{
        const r=rules.find(r=>
          r.type==='horaire_rule' &&
          r.slot===slot &&
          matchHoraireRule(r,y,m,d)
        );
        if (r) return r.horaire;
        return slot==='matin'?'matin_A':'aprem_A';
      },[rules]);

      // Alertes pour un jour
      const getAlerts = useCallback((datekey, dayPlanning)=>{
        if (!dayPlanning) return [];
        const p=datekey.split('-');
        const y=+p[0],m=+p[1]-1,d=+p[2];
        const dow=new Date(y,m,d).getDay();
        if (!openDays[dow]) return [];
        if (holidays.has(datekey)) return []; // jour férié = fermé, pas d'alerte planning
        const alerts=[], we=isWE(dow), wp=weekParity(y,m,d);
        const dayU=unavail[datekey]||{matin:[],aprem:[]};

        ['matin','aprem'].forEach(slot=>{
          const slotArr=toSlotArr(dayPlanning[slot]);
          if (slotArr.length===0) {
            alerts.push({level:'error',slot,msg:`${slot==='matin'?'Matin':'Après-midi'} : créneau non couvert (la clinique doit ouvrir et fermer aux mêmes horaires)`});
            return;
          }

          const allVets=[...new Set(slotArr.flatMap(s=>s.vets||[]))];

          // Règle fixe : tous les créneaux doivent être remplis (au moins un horaire)
          if (allVets.length===0)
            alerts.push({level:'error',slot,msg:`${slot==='matin'?'Matin':'Après-midi'} : aucun véto assigné — tous les créneaux doivent être couverts`});

          // Vérif couverture min : globale (sans horaire) ET par sous-créneau (avec horaire)
          rules.filter(r=>
            r.type==='min_per_slot' && r.slot===slot &&
            parityMatch(r.weekParity,y,m,d) &&
            (r.dayType==='all'||(r.dayType==='weekday'&&!we)||(r.dayType==='weekend'&&we))
          ).forEach(minR=>{
            if(minR.horaire){
              // Minimum par type de créneau (A ou B)
              const subSlot = slotArr.find(s=>s.horaire===minR.horaire);
              const subCount = subSlot?.vets?.length || 0;
              if(subCount < minR.min){
                const hLabel = HORAIRES[minR.horaire]?.short || minR.horaire;
                alerts.push({level:'error',slot,msg:`${slot==='matin'?'Matin':'Après-midi'} ${hLabel} : min. ${minR.min} véto(s) requis (${subCount} assigné(s))`});
              }
            } else {
              // Minimum global sur le slot entier
              if(allVets.length < minR.min)
                alerts.push({level:'error',slot,msg:`${slot==='matin'?'Matin':'Après-midi'} : min. ${minR.min} véto(s) requis (${allVets.length} assigné(s))`});
            }
          });

          rules.filter(r=>r.type==='vet_slot_rule' && r.slot===slot && matchRuleScope(r,y,m,d)).forEach(r=>{
            const target = slotArr.find(s=>s.horaire===r.horaire);
            const v = vets.find(x=>x.id===r.vetId);
            if (!target) {
              alerts.push({level:'error',slot,msg:`Règle vétérinaire : ${HORAIRES[r.horaire]?.label || r.horaire} n'est pas présent dans ce créneau`});
              return;
            }
            if (!target.vets.includes(r.vetId)) {
              alerts.push({level:'error',slot,msg:`${v?v.name:'Vétérinaire'} doit être assigné sur ${HORAIRES[r.horaire]?.label || r.horaire}`});
            }
          });

          // Vérif exclusions never_slot et indispos par sous-créneau
          slotArr.forEach(subSlot=>{
            // Vérif exclusions never_slot
            rules.filter(r=>r.type==='never_slot'&&(r.slot===slot||r.slot==='all')&&r.dayOfWeek===dow&&parityMatch(r.weekParity,y,m,d)).forEach(r=>{
              if (subSlot.vets.includes(r.vetId)){
                const v=vets.find(x=>x.id===r.vetId);
                alerts.push({level:'error',slot,msg:`${v?v.name:'?'} ne travaille jamais ce créneau le ${JS_FULL[dow]}`});
              }
            });
            // Vérif indispos
            (dayU[slot]||[]).forEach(vid=>{
              if (subSlot.vets.includes(vid)){
                const v=vets.find(x=>x.id===vid);
                alerts.push({level:'warn',slot,msg:`${v?v.name:'?'} est indisponible (${slot})`});
              }
            });
          });
        });

        return alerts;
      },[rules,vets,unavail,openDays,resolveHoraire,holidays]);

      const allAlerts   = useMemo(()=>{
        const res={};
        const pfx=`${year}-${String(month+1).padStart(2,'0')}-`;
        Object.entries(planning).filter(([k])=>k.startsWith(pfx)).forEach(([k,dp])=>{const a=getAlerts(k,dp);if(a.length)res[k]=a;});
        return res;
      },[planning,getAlerts,year,month]);
      const totalAlerts = useMemo(()=>Object.values(allAlerts).reduce((s,a)=>s+a.length,0),[allAlerts]);

      // (generate() est remplacé par generateAll() ci-dessus — voir GÉNÉRATION UNIFIÉE)

      const updateSubSlot = useCallback((datekey, slot, horaireId, updater)=>{
        setPlanning(prev=>{
          const day=prev[datekey]||emptyDay();
          const rawArr = toSlotArr(day[slot]);
          // S'assurer que les deux horaires existent
          const allHoraires = slot==='matin' ? ['matin_A','matin_B'] : ['aprem_A','aprem_B'];
          let slotArr = allHoraires.map(hid=>{
            return rawArr.find(s=>s.horaire===hid) || emptySlot(hid);
          });
          slotArr = slotArr.map(s => s.horaire===horaireId ? updater(s) : s);
          return {...prev,[datekey]:{...day,[slot]:slotArr}};
        });
        setValidated(false);
      },[]);

      const changeMonth = useCallback((delta)=>{
        let ny=year,nm=month+delta;
        if(nm<0){ny--;nm=11;}if(nm>11){ny++;nm=0;}
        setYear(ny);setMonth(nm);setValidated(false);
      },[year,month]);

      const exportICS = useCallback(()=>{
        const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SanceaVet//FR','CALSCALE:GREGORIAN'];
        Object.entries(planning).forEach(([k,dp])=>{
          if(!dp) return;
          ['matin','aprem'].forEach(slot=>{
            const slotArr=toSlotArr(dp[slot]);
            slotArr.forEach(subSlot=>{
              if(!subSlot||!subSlot.vets||!subSlot.vets.length) return;
              const names=subSlot.vets.map(id=>{const v=vets.find(v=>v.id===id);return v?v.name:'';}).filter(Boolean).join(', ');
              const h=HORAIRES[subSlot.horaire];
              const ds=k.replace(/-/g,'');
              lines.push('BEGIN:VEVENT','UID:'+k+'-'+subSlot.horaire+'@sanceavet',
                'DTSTART;VALUE=DATE:'+ds,'DTEND;VALUE=DATE:'+ds,
                'SUMMARY:'+(slot==='matin'?'Matin':'Après-midi')+' '+h.short+' – '+names,'END:VEVENT');
            });
          });
        });
        lines.push('END:VCALENDAR');
        const blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download='planning-'+MOIS[month]+'-'+year+'.ics';a.click();
        URL.revokeObjectURL(url);
      },[planning,vets,month,year]);

      const exportCSV = useCallback(()=>{
        const monthPrefix = `${year}-${String(month+1).padStart(2,'0')}-`;
        const escapeCell = value => {
          const s = value == null ? '' : String(value);
          if(/;|\n|\r|"/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
          return s;
        };
        const rows = [];
        rows.push(['Type','Date','Jour','Nom','Créneau','Horaire','Début','Fin','Durée','Segment','Remarque']);
        const addRow = cells => rows.push(cells.map(escapeCell));

        const getDayLabel = (dateKey) => {
          const [y,m,d] = dateKey.split('-').map(Number);
          const dow = new Date(y, m-1, d).getDay();
          return JS_FULL[dow];
        };

        Object.keys(planning).filter(k=>k.startsWith(monthPrefix)).sort().forEach(key=>{
          const dp = planning[key];
          if(!dp) return;
          ['matin','aprem'].forEach(slot=>{
            toSlotArr(dp[slot]).forEach(subSlot=>{
              if(!subSlot||!subSlot.vets||!subSlot.vets.length) return;
              const names = subSlot.vets.map(id=>{
                const v=vets.find(v=>v.id===id); return v? v.name : id;
              }).join(', ');
              const horaire = HORAIRES[subSlot.horaire];
              addRow(['Vétos', key, getDayLabel(key), names, slot, subSlot.horaire, horaire?.start||'', horaire?.end||'', '', '', '']);
            });
          });
        });

        if(Object.keys(asvPlanning).some(k=>k.startsWith(monthPrefix))){
          rows.push([]);
          rows.push(['Type','Date','Jour','Nom','Créneau','Horaire','Début','Fin','Durée','Segment','Remarque']);
          Object.keys(asvPlanning).filter(k=>k.startsWith(monthPrefix)).sort().forEach(key=>{
            const dayData = asvPlanning[key];
            if(!dayData || Array.isArray(dayData)) return;
            const [y,m,d] = key.split('-').map(Number);
            const dayName = JS_FULL[new Date(y,m-1,d).getDay()];
            Object.entries(dayData).forEach(([aid,ad])=>{
              if(!ad?.segments?.length) return;
              const asv = asvs.find(a=>a.id===aid);
              const name = asv ? asv.name : aid;
              ad.segments.forEach(seg=>{
                const duration = seg.end-seg.start;
                addRow(['ASV', key, dayName, name, '', ad.type||'', seg.start, seg.end, duration.toFixed(2), '', '']);
              });
            });
          });
        }

        const csv = rows.map(r=>r.join(';')).join('\r\n');
        const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `planning-${MOIS[month]}-${year}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      },[planning,asvPlanning,vets,asvs,month,year]);

      // ── Export ICS – Planning ASV ──────────────────────────────
      const exportASVICS = useCallback(()=>{
        const monthPrefix=`${year}-${String(month+1).padStart(2,'0')}-`;
        const fmtH=h=>{const hh=Math.floor(h),mm=Math.round((h-hh)*60);return`${hh}h${String(mm).padStart(2,'0')}`;};
        const icsDateTime=(dateKey,h)=>{
          const[y,mo,d]=dateKey.split('-');
          const hh=Math.floor(h),mm=Math.round((h-hh)*60);
          return`${y}${mo}${d}T${String(hh).padStart(2,'0')}${String(mm).padStart(2,'0')}00`;
        };
        const lines=[
          'BEGIN:VCALENDAR','VERSION:2.0',
          'PRODID:-//SanceaVet//Planning ASV//FR',
          'CALSCALE:GREGORIAN',
          `X-WR-CALNAME:Planning ASV – ${MOIS[month]} ${year}`,
          `X-WR-CALDESC:Horaires ASV Sancéa Vet – ${MOIS[month]} ${year}`,
        ];
        let hasEv=false;
        Object.keys(asvPlanning).filter(k=>k.startsWith(monthPrefix)).sort().forEach(dateKey=>{
          const dayData=asvPlanning[dateKey];
          if(!dayData||Array.isArray(dayData)) return;
          const[y,mo,d]=dateKey.split('-').map(Number);
          const dayName=JS_FULL[new Date(y,mo-1,d).getDay()];
          Object.entries(dayData).forEach(([aid,ad])=>{
            if(!ad?.segments?.length) return;
            const asv=asvs.find(a=>a.id===aid);
            const name=asv?asv.name:aid;
            const totalH=ad.segments.reduce((s,g)=>s+(g.end-g.start),0);
            ad.segments.forEach((seg,i)=>{
              hasEv=true;
              lines.push(
                'BEGIN:VEVENT',
                `UID:${dateKey}-${aid}-s${i}@sanceavet-asv`,
                `DTSTART:${icsDateTime(dateKey,seg.start)}`,
                `DTEND:${icsDateTime(dateKey,seg.end)}`,
                `SUMMARY:${name} \u2014 ${fmtH(seg.start)}\u2013${fmtH(seg.end)}`,
                `DESCRIPTION:Sancéa Vet – ${dayName} ${d}/${mo}/${y}\\nTotal jour: ${totalH.toFixed(1).replace(/\.0$/,'')}h`,
                'CATEGORIES:ASV',
                'END:VEVENT'
              );
            });
          });
        });
        if(!hasEv){alert('Aucun planning ASV à exporter pour ce mois.');return;}
        lines.push('END:VCALENDAR');
        const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});
        const url=URL.createObjectURL(blob);
        const a=document.createElement('a');
        a.href=url;a.download=`planning-asv-${MOIS[month]}-${year}.ics`;a.click();
        URL.revokeObjectURL(url);
      },[asvPlanning,asvs,year,month]);

      // ── Export XLSX – Planning ASV (une feuille par semaine) ───
      const exportASVXLSX = useCallback(async ()=>{
        let XL;
        try { XL = await ensureXLSX(); }
        catch(e){ alert('SheetJS non chargé – vérifiez votre connexion.'); return; }
        const monthPrefix=`${year}-${String(month+1).padStart(2,'0')}-`;
        const fmtH=h=>{const hh=Math.floor(h),mm=Math.round((h-hh)*60);return`${hh}h${String(mm).padStart(2,'0')}`;};

        // Grouper les jours par numéro de semaine ISO
        const weekMap={};
        Object.keys(asvPlanning).filter(k=>k.startsWith(monthPrefix)).sort().forEach(key=>{
          const[y,mo,d]=key.split('-').map(Number);
          const wn=isoWeek(y,mo-1,d);
          if(!weekMap[wn]) weekMap[wn]=[];
          weekMap[wn].push(key);
        });
        if(!Object.keys(weekMap).length){alert('Aucun planning ASV généré pour ce mois.');return;}

        const wb=XL.utils.book_new();

        Object.entries(weekMap).sort((a,b)=>+a[0]-+b[0]).forEach(([wnStr,dayKeys])=>{
          const wn=+wnStr;
          const[fy,fmo,fd]=dayKeys[0].split('-').map(Number);
          const[,lmo,ld]=dayKeys[dayKeys.length-1].split('-').map(Number);

          const aoa=[];

          // ── Ligne 0 : titre de la semaine
          aoa.push([`Planning ASV — Semaine ${wn} — du ${fd}/${fmo} au ${ld}/${lmo}/${fy}`]);

          // ── Ligne 1 : en-têtes colonnes
          aoa.push(['Jour / Date', ...asvs.map(a=>a.name), 'Présentes']);

          // ── Lignes de données : un jour par ligne
          const weekH=Object.fromEntries(asvs.map(a=>[a.id,0]));
          dayKeys.forEach(key=>{
            const[y,mo,d]=key.split('-').map(Number);
            const dow=new Date(y,mo-1,d).getDay();
            const dayLabel=`${JOURS[(dow+6)%7]} ${d}/${mo}`;
            const row=[dayLabel];
            let cnt=0;
            asvs.forEach(asv=>{
              const dayData=asvPlanning[key];
              const ad=(!dayData||Array.isArray(dayData))?null:dayData[asv.id];
              if(!ad?.segments?.length){
                const pr=asvPersonalRules[asv.id]||[];
                const off=pr.some(r=>r.type==='day_off'&&r.dow===dow);
                row.push(off?'REPOS FIXE':'—');
              } else {
                const totalH=ad.segments.reduce((s,g)=>s+(g.end-g.start),0);
                weekH[asv.id]+=totalH;
                const segs=ad.segments.map(s=>`${fmtH(s.start)}-${fmtH(s.end)}`).join(' / ');
                row.push(`${segs}  (${totalH.toFixed(1).replace(/\.0$/,'')}h)`);
                cnt++;
              }
            });
            row.push(cnt);
            aoa.push(row);
          });

          // ── Ligne vide
          aoa.push([]);

          // ── Ligne totaux semaine
          const totRow=['∑ Semaine'];
          let totAll=0;
          asvs.forEach(a=>{
            const h=weekH[a.id];
            totAll+=h;
            totRow.push(h>0?`${h.toFixed(1).replace(/\.0$/,'')}h`:'—');
          });
          totRow.push(`${totAll.toFixed(1).replace(/\.0$/,'')}h total`);
          aoa.push(totRow);

          // ── Construire la feuille
          const ws=XL.utils.aoa_to_sheet(aoa);

          // Largeurs colonnes
          ws['!cols']=[
            {wch:16},                        // Jour
            ...asvs.map(()=>({wch:34})),     // Colonne par ASV
            {wch:12},                        // Présentes
          ];

          // Fusion titre sur toute la largeur
          ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:asvs.length+1}}];

          const rawSheetName=`S${wn} (${fd}${fmo===lmo?'':`-${fmo}`}-${ld}-${lmo})`;
          const sheetName=rawSheetName.replace(/[:\\/?\*\[\]]/g,'.').slice(0,31);
          XL.utils.book_append_sheet(wb,ws,sheetName);
        });

        try {
          const wbout = XL.write(wb, {bookType:'xlsx', type:'array'});
          const blob = new Blob([wbout], {type:'application/octet-stream'});
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `planning-asv-${MOIS[month]}-${year}.xlsx`;
          document.body.appendChild(a);
          a.click();
          setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
        } catch(e) {
          console.error('Erreur export XLSX:', e);
          alert('❌ Erreur lors de l\'export XLSX : ' + e.message);
        }
      },[asvPlanning,asvs,asvPersonalRules,year,month,isoWeek]);

      const TABS=[
        {id:'planning',label:'Planning',icon:'📅'},
        {id:'asv',     label:'Planning ASV',icon:'👩‍⚕️'},
        {id:'equipe',  label:'Équipe',  icon:'👥'},
        {id:'regles',  label:'Règles',  icon:'⚙️'},
        {id:'stats',   label:'Statistiques', icon:'📊'},
        {id:'sync',    label:'Google Sync',icon:'🔗'},
      ];

      return (
        <div style={{fontFamily:"'Inter',sans-serif",color:'#1f2937'}}>
          <div style={{marginBottom:24,display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
            <div>
              <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:28,fontWeight:700,color:'#1f2937',marginBottom:4}}>
                Planning vétérinaire
              </h1>
              <p style={{color:'#6b7280',fontSize:14}}>Gestion par demi-journées · semaines paires/impaires · jours fériés automatiques · sauvegarde automatique</p>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
              {saveFlash&&(
                <span style={{display:'inline-flex',alignItems:'center',gap:5,fontSize:12,color:'#059669',
                  background:'#f0fdf4',border:'1px solid #bbf7d0',borderRadius:20,padding:'4px 12px',
                  animation:'fadeIn .2s ease',fontWeight:500}}>
                  ✓ Sauvegardé
                </span>
              )}
              <button onClick={exportJSON} className="btn-ghost" style={{fontSize:12,padding:'5px 12px',color:'#0d9488',borderColor:'#99f6e4'}}>
                ⬇ Exporter
              </button>
              <button onClick={importJSON} className="btn-ghost" style={{fontSize:12,padding:'5px 12px',color:'#7c3aed',borderColor:'#c4b5fd'}}>
                ⬆ Importer
              </button>
              <button onClick={()=>{
                if(!confirm('Réinitialiser uniquement le mois affiché ?')) return;
                resetCurrentMonth().catch(err => {
                  console.error('Erreur de réinitialisation du mois courant', err);
                  alert('❌ Impossible de réinitialiser le mois affiché');
                });
              }} className="btn-ghost" style={{fontSize:12,padding:'5px 12px',color:'#ef4444',borderColor:'#fecaca'}}>
                🗑 Réinitialiser mois
              </button>
            </div>
          </div>

          <div className="plan-tabs" style={{marginBottom:24}}>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} className={'plan-tab'+(tab===t.id?' active':'')}>
                <span>{t.icon}</span><span className="tab-label">{t.label}</span>
                {t.id==='planning'&&totalAlerts>0&&<span className="badge-danger">{totalAlerts}</span>}
              </button>
            ))}
          </div>

          {tab==='planning'&&(
            <PlanningTab year={year} month={month} numDays={numDays} startCol={startCol}
              vets={vets} planning={planning} unavail={unavail}
              allAlerts={allAlerts} totalAlerts={totalAlerts}
              openDays={openDays} validated={validated}
              onChangeMonth={changeMonth} onGenerate={generateAll}
              holidays={holidays}
              onValidate={()=>{
                setValidated(true);
                const mkey=String(month);
                setYearlyData(prev=>{
                  const yr=prev[year]||{};
                  return {...prev,[year]:{...yr,[mkey]:{planning,astreintes,label:MOIS[month]+' '+year}}};
                });
              }}
              updateSubSlot={updateSubSlot} setUnavail={setUnavail}
              setEditDay={setEditDay}
              resolveHoraire={resolveHoraire}
              isoWeek={isoWeek} weekParity={weekParity}
              astreintes={astreintes} setAstreintes={setAstreintes}
              onGenerateAstreintes={generateAstreintes} />
          )}
          {tab==='equipe'&&<EquipeTab vets={vets} setVets={setVets}/>}
          {tab==='asv'&&(
            <ASVTab year={year} month={month} numDays={numDays} startCol={startCol}
              vets={vets} planning={planning} openDays={openDays}
              asvs={asvs} setAsvs={setAsvs}
              asvRules={asvRules} setAsvRules={setAsvRules}
              asvPlanning={asvPlanning} setAsvPlanning={setAsvPlanning}
              asvUnavailRanges={asvUnavailRanges} setAsvUnavailRanges={setAsvUnavailRanges}
              asvPersonalRules={asvPersonalRules} setAsvPersonalRules={setAsvPersonalRules}
              holidays={holidays}
              onGenerate={generateASVPlanning}
              onExportASVICS={exportASVICS}
              onExportASVXLSX={exportASVXLSX}
              isoWeek={isoWeek} weekParity={weekParity}/>
          )}
          {tab==='regles'&&<ReglesTab rules={rules} setRules={setRules} vets={vets} setVets={setVets} openDays={openDays} setOpenDays={setOpenDays} horaireTimes={horaireTimes} setHoraireTimes={setHoraireTimes}/>}
          {tab==='stats'&&(
            <StatsTab vets={vets} yearlyData={yearlyData} currentYear={year}
              currentMonth={month} currentPlanning={planning} validated={validated}
              setYearlyData={setYearlyData}
              astreintes={astreintes}/>
          )}
          {tab==='sync'&&(
            <SyncTab validated={validated} totalAlerts={totalAlerts} planning={planning}
              vets={vets} year={year} month={month}
              gclientId={gclientId} setGclientId={setGclientId}
              calId={calId} setCalId={setCalId} onExportICS={exportICS}
              onExportCSV={exportCSV}
              onExportASVICS={exportASVICS}
              onExportASVXLSX={exportASVXLSX}
              asvPlanning={asvPlanning}
              astreintes={astreintes}
              freepbxWebhook={freepbxWebhook}
              setFreepbxWebhook={setFreepbxWebhook}/>
          )}

          {editDay&&ReactDOM.createPortal(
            <EditModal datekey={editDay} vets={vets} planning={planning} unavail={unavail}
              allAlerts={allAlerts} updateSubSlot={updateSubSlot}
              resolveHoraire={resolveHoraire} year={year} month={month}
              isoWeek={isoWeek} weekParity={weekParity} openDays={openDays}
              holidays={holidays}
              astreintes={astreintes} setAstreintes={setAstreintes}
              onClose={()=>setEditDay(null)}/>,
            document.body
          )}
        </div>
      );
    }

    // ─── Onglet Planning ───────────────────────────────────────
    function PlanningTab({year,month,numDays,startCol,vets,planning,unavail,allAlerts,totalAlerts,openDays,validated,onChangeMonth,onGenerate,onValidate,updateSubSlot,setUnavail,setEditDay,resolveHoraire,isoWeek,weekParity,astreintes,setAstreintes,onGenerateAstreintes,holidays}){
      const [showU,    setShowU]    = useState(false);
      const [uVet,     setUVet]     = useState('');
      const [uDay,     setUDay]     = useState('');
      const [uDayEnd,  setUDayEnd]  = useState('');
      const [uSlot,    setUSlot]    = useState('matin');
      const gridRef = useRef(null);

      // Listener natif en capture — intercepte AVANT tout autre listener
      // (Cloudflare Pages peut avoir styles.css ou scripts qui consomment l'événement)
      useEffect(()=>{
        const grid = gridRef.current;
        if(!grid) return;
        const handler = (e) => {
          try {
            let el = e.target;
            if (el && el.nodeType === 3 && el.parentElement) el = el.parentElement; // handle text nodes
            const cell = el && el.closest ? el.closest('[data-datekey]') : null;
            if (cell) {
              e.preventDefault();
              e.stopPropagation();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
              setEditDay(cell.getAttribute('data-datekey') || (cell.dataset && cell.dataset.datekey));
            }
          } catch(err) {
            console.error('planning click handler error', err);
          }
        };
        grid.addEventListener('click', handler, {capture:true});
        grid.addEventListener('pointerdown', handler, {capture:true});
        return ()=>{
          grid.removeEventListener('click', handler, {capture:true});
          grid.removeEventListener('pointerdown', handler, {capture:true});
        };
      },[setEditDay]);

      const pfxCur = `${year}-${String(month+1).padStart(2,'0')}-`;
      const totalU=Object.values(unavail).reduce((s,d)=>s+(d.matin||[]).length+(d.aprem||[]).length,0);
      const hasP=Object.keys(planning).filter(k=>k.startsWith(pfxCur)&&planning[k]).length>0;

      const doAdd=()=>{
        if(!uVet || !uDay) return;
        const startDay = parseInt(uDay);
        const endDay = uDayEnd ? parseInt(uDayEnd) : startDay;
        if(!Number.isFinite(startDay) || !Number.isFinite(endDay)) return;
        if(startDay < 1 || startDay > numDays || endDay < 1 || endDay > numDays) return;
        if(startDay > endDay) return;

        setUnavail(prev => {
          const next = { ...prev };
          for(let d=startDay; d<=endDay; d++){
            const key = dk(year, month, d);
            const cur = next[key] || { matin: [], aprem: [] };

            const upsert = (slot) => {
              const base = (cur[slot] || []).filter(x => x !== uVet);
              if (!base.includes(uVet)) base.push(uVet);
              return base;
            };

            const nextCur = { ...cur };
            if (uSlot === 'all') {
              nextCur.matin = upsert('matin');
              nextCur.aprem = upsert('aprem');
            } else {
              nextCur[uSlot] = upsert(uSlot);
            }
            next[key] = nextCur;
          }
          return next;
        });
        setUDay('');
        setUDayEnd('');
      };
      const doRemove=(key,slot,vid)=>setUnavail(prev=>{
        const cur=prev[key]||{matin:[],aprem:[]};
        return {...prev,[key]:{...cur,[slot]:(cur[slot]||[]).filter(x=>x!==vid)}};
      });

      // Grille
      const cells=[]; for(let i=0;i<startCol;i++) cells.push(null);
      for(let d=1;d<=numDays;d++) cells.push(d);
      while(cells.length%7!==0) cells.push(null);
      const weeks=[]; for(let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));

      return (
        <div>
          {/* Toolbar */}
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20,flexWrap:'wrap',gap:10}}>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <button onClick={()=>onChangeMonth(-1)} className="btn-ghost" style={{padding:'7px 12px'}}>←</button>
              <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:700,color:'#1f2937',minWidth:185,textAlign:'center'}}>
                {MOIS[month]} {year}
              </h2>
              <button onClick={()=>onChangeMonth(1)} className="btn-ghost" style={{padding:'7px 12px'}}>→</button>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
              {hasP&&totalAlerts===0&&validated&&<span style={{color:'#059669',fontSize:13,fontWeight:600}}>✓ Validé</span>}
              {totalAlerts>0&&<span style={{color:'#d97706',fontSize:13,fontWeight:600}}>⚠ {totalAlerts} alerte(s)</span>}
              <button onClick={()=>setShowU(v=>!v)} className="btn-ghost">
                📋 Indispos {totalU>0&&<span style={{color:'#d97706',fontWeight:700,marginLeft:2}}>({totalU})</span>}
              </button>
              <button onClick={onGenerate} className="btn-teal">⚡ Générer planning + astreintes</button>
              <button onClick={onGenerateAstreintes} className="btn-outline" style={{borderColor:'#8b5cf6',color:'#7c3aed'}}>🌙 Recalc. astreintes seules</button>
              {hasP&&(
                <button onClick={onValidate} disabled={validated} className="btn-success">
                  {validated?'✓ Validé':'✓ Valider'}
                </button>
              )}
            </div>
          </div>

          {/* Indispos */}
          {showU&&(
            <div className="g-card" style={{marginBottom:20}}>
              <h3 style={{fontSize:14,fontWeight:600,marginBottom:12,color:'#374151'}}>Indisponibilités — {MOIS[month]} {year}</h3>
              <div style={{display:'flex',gap:8,marginBottom:12,flexWrap:'wrap',alignItems:'flex-end'}}>
                <div>
                  <span className="g-label">Vétérinaire</span>
                  <select value={uVet} onChange={e=>setUVet(e.target.value)} className="g-input" style={{minWidth:160}}>
                    <option value=''>Choisir…</option>
                    {vets.map(v=><option key={v.id} value={v.id}>{v.name}</option>)}
                  </select>
                </div>
                <div>
                  <span className="g-label">Jour de début</span>
                  <input type="number" min={1} max={numDays} value={uDay} onChange={e=>setUDay(e.target.value)}
                    className="g-input" style={{width:90}}/>
                </div>
                <div>
                  <span className="g-label">Jour de fin</span>
                  <input type="number" min={1} max={numDays} value={uDayEnd} onChange={e=>setUDayEnd(e.target.value)}
                    className="g-input" style={{width:90}} placeholder="Optionnel"/>
                </div>
                <div>
                  <span className="g-label">Créneau</span>
                  <select value={uSlot} onChange={e=>setUSlot(e.target.value)} className="g-input">
                    <option value="matin">Matin</option>
                    <option value="aprem">Après-midi</option>
                    <option value="all">Toute la journée</option>
                  </select>
                </div>
                <button onClick={doAdd} className="btn-teal">Ajouter</button>
              </div>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {Object.entries(unavail).flatMap(([key,slots])=>
                  ['matin','aprem'].flatMap(slot=>(slots[slot]||[]).map(vid=>{
                    const v=vets.find(x=>x.id===vid);
                    const d=parseInt(key.split('-')[2]);
                    return v?(
                      <span key={key+slot+vid} className="indispo-chip"
                        style={{background:v.color+'18',border:'1px solid '+v.color+'44',color:v.color}}>
                        {v.name} – {d} {MOIS[month].slice(0,3)} ({slot==='matin'?'matin':'ap-m'})
                        <button onClick={()=>doRemove(key,slot,vid)}>×</button>
                      </span>
                    ):null;
                  }))
                )}
                {totalU===0&&<span style={{color:'#9ca3af',fontSize:13}}>Aucune indisponibilité pour ce mois</span>}
              </div>
            </div>
          )}

          {/* Grille */}
          <div className="cal-grid" ref={gridRef}>
            <div className="cal-header-row">
              {JOURS.map((j,i)=><div key={j} className={'cal-header-cell'+(i>=5?' we':'')}>{j}</div>)}
            </div>
            {weeks.map((week,wi)=>(
              <div key={wi} className="cal-week">
                {week.map((day,di)=>{
                  if(!day) return <div key={di} className="cal-cell empty"/>;
                  const key=dk(year,month,day);
                  const dow=dowJS(year,month,day);
                  const isHoliday=holidays&&holidays.has(key);
                  const closed=!openDays[dow]||isHoliday;
                  const dp=planning[key];
                  const alerts=allAlerts[key]||[];
                  const today=new Date().toDateString()===new Date(year,month,day).toDateString();
                  const we=isWE(dow);
                  const wn=isoWeek(year,month,day);
                  const wp=weekParity(year,month,day);
                  const holidayName=isHoliday?getHolidayName(key,holidays):null;

                  return(
                    <div key={di} data-datekey={key}
                      className={'cal-cell'+(isHoliday?' holiday':closed?' closed':we?' we-day':'')}>
                      {/* Numéro + badge semaine */}
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
                        <div className={'cal-day-num'+(today?' today':closed?' closed-n':we?' closed-n':'')}>
                          {day}
                        </div>
                        {!closed&&di===0&&(
                          <span style={{fontSize:8,fontWeight:700,color:wp==='even'?'#1d4ed8':'#be185d',
                            background:wp==='even'?'#dbeafe':'#fce7f3',borderRadius:4,padding:'1px 4px'}}>
                            S{wn} {wp==='even'?'P':'I'}
                          </span>
                        )}
                        {isHoliday&&(
                          <span style={{fontSize:7,fontWeight:700,color:'#b45309',background:'#fef3c7',
                            border:'1px solid #fcd34d',borderRadius:4,padding:'1px 4px',maxWidth:52,
                            overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',lineHeight:1.4}}>
                            🎌 {holidayName}
                          </span>
                        )}
                      </div>

                      {closed?(
                        <div style={{fontSize:9,color:isHoliday?'#b45309':'#d1d5db',textTransform:'uppercase',letterSpacing:'.05em',fontWeight:isHoliday?600:400}}>
                          {isHoliday?'Férié':'Fermé'}
                        </div>
                      ):dp?(
                        <div style={{display:'flex',flexDirection:'column',gap:3}}>
                          {/* Matin */}
                          <SlotMini slot="matin" slotData={dp.matin} vets={vets}
                            unavail={(unavail[key]||{}).matin||[]} />
                          {/* Après-midi */}
                          <SlotMini slot="aprem" slotData={dp.aprem} vets={vets}
                            unavail={(unavail[key]||{}).aprem||[]} />
                        </div>
                      ):(
                        hasP&&<div style={{fontSize:9,color:'#9ca3af',fontStyle:'italic'}}>—</div>
                      )}

                      {/* Astreintes */}
                      <AstrMini astrDay={astreintes[key]} vets={vets} dow={dow} isHoliday={isHoliday}/>

                      {alerts.length>0&&<div className="cal-alert-dot">{alerts.length}</div>}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>

          {/* Légende */}
          <div className="legend">
            {vets.map(v=>(
              <div key={v.id} className="legend-item">
                <div className="legend-dot" style={{background:v.color}}/>
                {v.name}
              </div>
            ))}
            <div style={{display:'flex',gap:8,marginLeft:'auto',alignItems:'center',fontSize:11,color:'#9ca3af',flexWrap:'wrap'}}>
              <span style={{background:'#fef3c7',color:'#b45309',border:'1px solid #fcd34d',borderRadius:4,padding:'1px 5px',fontWeight:700,fontSize:10}}>🎌</span> Jour férié
              <span style={{background:'#dbeafe',color:'#1d4ed8',borderRadius:4,padding:'1px 5px',fontWeight:700,fontSize:10}}>S# P</span> Semaine paire
