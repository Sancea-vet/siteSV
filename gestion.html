              <span style={{background:'#fce7f3',color:'#be185d',borderRadius:4,padding:'1px 5px',fontWeight:700,fontSize:10}}>S# I</span> Semaine impaire
            </div>
          </div>

          {/* Capacité vétérinaire : planifié vs cible contractuelle */}
          {hasP && vets.some(v=>v.joursAnnuels) && (()=>{
            const weeksInMonth = numDays/7;
            const fmtJ = x => (Math.round(x*2)/2).toFixed(1).replace(/\.0$/,'');
            const rows = vets.map(v=>{
              const sw = 52 - (v.semainesConges ?? 0);
              const js = (v.joursAnnuels && sw>0) ? v.joursAnnuels/sw : null;
              let planned = 0;
              Object.entries(planning).forEach(([k,dp])=>{
                if(!k.startsWith(pfxCur) || !dp) return;
                ['matin','aprem'].forEach(slot=>{
                  const arr = toSlotArr(dp[slot]);
                  if(arr.some(s=>(s.vets||[]).includes(v.id))) planned += 0.5;
                });
              });
              const target = js!=null ? js*weeksInMonth : null;
              return {v, js, planned, target, delta: target!=null ? target-planned : null};
            });
            const totalRest = rows.reduce((s,r)=>s+(r.delta!=null?Math.max(0,r.delta):0),0);
            return (
              <div className="g-card" style={{marginTop:16}}>
                <h3 style={{fontSize:13,fontWeight:600,color:'#374151',marginBottom:10,
                  textTransform:'uppercase',letterSpacing:'.05em'}}>
                  🧮 Capacité vétérinaire — {MOIS[month]} {year}
                </h3>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(230px,1fr))',gap:8}}>
                  {rows.map(({v,js,planned,target,delta})=>(
                    <div key={v.id} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',
                      background:'#f8fafc',border:'1px solid #e2e8f0',borderRadius:10,fontSize:12}}>
                      <div style={{width:9,height:9,borderRadius:'50%',background:v.color,flexShrink:0}}/>
                      <span style={{fontWeight:600,color:'#1f2937',flex:1}}>{v.name}</span>
                      {target!=null ? (
                        <span style={{color:'#6b7280'}}>
                          {fmtJ(planned)}j / cible {fmtJ(target)}j&nbsp;
                          <strong style={{color: delta>0.5 ? '#0d9488' : delta<-0.5 ? '#dc2626' : '#059669'}}>
                            {delta>0.5 ? `↗ +${fmtJ(delta)}j dispo` : delta<-0.5 ? `⚠ ${fmtJ(-delta)}j au-delà` : '✓'}
                          </strong>
                        </span>
                      ):(
                        <span style={{color:'#9ca3af'}}>{fmtJ(planned)}j — contrat non renseigné</span>
                      )}
                    </div>
                  ))}
                </div>
                <p style={{fontSize:12,marginTop:10,marginBottom:0,fontWeight:600,
                  color: totalRest>0.5 ? '#0d9488' : '#059669'}}>
                  {totalRest>0.5
                    ? `↗ Après astreintes et couvertures minimales, il reste ≈ ${fmtJ(totalRest)} jour(s) véto à consommer ce mois-ci.`
                    : '✓ La capacité vétérinaire du mois est entièrement consommée par le planning actuel.'}
                </p>
              </div>
            );
          })()}

          {/* Alertes */}
          {totalAlerts>0&&(
            <div className="alert-panel">
              <h3 style={{fontSize:13,fontWeight:600,color:'#dc2626',marginBottom:10}}>⚠ {totalAlerts} problème(s) à résoudre</h3>
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))',gap:'5px 20px'}}>
                {Object.entries(allAlerts).flatMap(([key,alerts])=>
                  alerts.map((a,i)=>{
                    const p=key.split('-'), d=parseInt(p[2]);
                    const dow=new Date(+p[0],+p[1]-1,+p[2]).getDay();
                    return(
                      <div key={key+i} style={{display:'flex',gap:8,fontSize:12,alignItems:'flex-start'}}>
                        <span style={{color:'#9ca3af',minWidth:75,flexShrink:0,fontSize:11}}>
                          {JS_FULL[dow].slice(0,3)} {d} {MOIS[month].slice(0,3)}.
                        </span>
                        <span style={{color:a.level==='error'?'#dc2626':'#d97706'}}>{a.msg}</span>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mini affichage d'un slot dans la cellule

    function AstrMini({astrDay,vets,dow,isHoliday}){
      if(!astrDay||(!astrDay.midi&&!astrDay.soir)) return null;
      const we=isWE(dow)||isHoliday;
      const mV=vets.find(v=>v.id===astrDay.midi);
      const sV=vets.find(v=>v.id===astrDay.soir);
      return(
        <div style={{marginTop:3,display:'flex',flexDirection:'column',gap:1}}>
          {astrDay.midi&&mV&&(
            <span className={'astr-badge '+(we?'astr-we':'astr-midi')}>
              ☀️ {mV.name.replace('Dr. ','')}
            </span>
          )}
          {astrDay.soir&&sV&&(
            <span className={'astr-badge '+(we?'astr-we':'astr-soir')}>
              🌙 {sV.name.replace('Dr. ','')}
            </span>
          )}
        </div>
      );
    }

    function SlotMini({slot,slotData,vets,unavail}){
      const slotArr = toSlotArr(slotData);
      const isMatin=slot==='matin';
      const bg=isMatin?'#fef9ec':'#f0f0ff';
      const col=isMatin?'#92400e':'#4c1d95';
      const hasAnyVet = slotArr.some(s=>s.vets&&s.vets.length>0);
      if(!hasAnyVet && slotArr.length===0) return null;
      return(
        <div style={{display:'flex',flexDirection:'column',gap:2}}>
          {slotArr.map((subSlot,idx)=>{
            const h=HORAIRES[subSlot.horaire];
            if(!h) return null;
            if(subSlot.vets.length===0) return null;
            return(
              <div key={idx} style={{background:bg,borderRadius:4,padding:'2px 4px'}}>
                <div style={{fontSize:8,fontWeight:700,color:col,letterSpacing:'.04em',textTransform:'uppercase',marginBottom:1}}>
                  {isMatin?'🌅':'🌇'} {h.short}
                </div>
                {subSlot.vets.map(vid=>{
                  const v=vets.find(x=>x.id===vid);
                  const warn=unavail.includes(vid);
                  return v?(
                    <div key={vid} className="vet-chip-sm" style={{color:v.color}}>
                      <span className="vet-dot-sm" style={{background:v.color}}/>
                      {v.name.replace('Dr. ','')}
                      {warn&&<span style={{color:'#ef4444',fontWeight:900}}>!</span>}
                    </div>
                  ):null;
                })}
              </div>
            );
          })}
          {!hasAnyVet&&(
            <div style={{background:bg,borderRadius:4,padding:'2px 4px'}}>
              <div style={{fontSize:9,color:'#ef4444',fontWeight:700}}>Non couvert</div>
            </div>
          )}
        </div>
      );
    }

    // ─── Modal édition ─────────────────────────────────────────
    function EditModal({datekey,vets,planning,unavail,allAlerts,updateSubSlot,resolveHoraire,year,month,isoWeek,weekParity,openDays,astreintes,setAstreintes,onClose,holidays}){
      const p=datekey.split('-');
      const day=parseInt(p[2]), m=parseInt(p[1])-1, y=+p[0];
      const dow=new Date(y,m,day).getDay();
      const isHoliday=holidays&&holidays.has(datekey);
      const holidayName=isHoliday?getHolidayName(datekey,holidays):null;
      const isClosed = isHoliday || (openDays ? !openDays[dow] : false);
      const [activeSlot, setActiveSlot] = useState(isClosed ? 'astreinte' : 'matin');
      const dp=planning[datekey]||emptyDay();
      const dayU=unavail[datekey]||{matin:[],aprem:[]};
      const alerts=allAlerts[datekey]||[];
      const wn=isoWeek(y,m,day);
      const wp=weekParity(y,m,day);

      const slotAlerts=alerts.filter(a=>a.slot===activeSlot);
      const slotU=dayU[activeSlot]||[];

      // Récupère les sous-créneaux pour le slot actif (matin ou aprem)
      const getSubSlots = (slot) => {
        const allHoraires = slot==='matin' ? ['matin_A','matin_B'] : ['aprem_A','aprem_B'];
        const raw = toSlotArr(dp[slot]);
        return allHoraires.map(hid => raw.find(s=>s.horaire===hid) || emptySlot(hid));
      };

      const toggleVetInSubSlot = (slot, horaireId, vid) => {
        updateSubSlot(datekey, slot, horaireId, s=>({
          ...s, vets: s.vets.includes(vid) ? s.vets.filter(x=>x!==vid) : [...s.vets, vid]
        }));
      };

      return(
        <div className="modal-overlay active" onClick={onClose}>
          <div className="modal-box" onClick={e=>e.stopPropagation()}>
            <div className="modal-head">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div>
                  <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,color:'#1f2937'}}>
                    {JS_FULL[dow]} {day} {MOIS[m]}
                    {isHoliday&&<span style={{marginLeft:8,fontSize:12,fontWeight:600,color:'#b45309',background:'#fef3c7',border:'1px solid #fcd34d',borderRadius:6,padding:'2px 8px'}}>🎌 {holidayName}</span>}
                    {!isHoliday&&isClosed&&<span style={{marginLeft:8,fontSize:12,fontWeight:500,color:'#9ca3af',background:'#f3f4f6',borderRadius:6,padding:'2px 8px'}}>Fermé</span>}
                  </h3>
                  <div style={{display:'flex',gap:6,marginTop:4}}>
                    <span style={{fontSize:11,color:'#6b7280'}}>Semaine {wn}</span>
                    <span className={'parity-badge '+(wp==='even'?'parity-even':'parity-odd')}>
                      {wp==='even'?'Paire':'Impaire'}
                    </span>
                  </div>
                </div>
                <button onClick={onClose}
                  style={{background:'none',border:'none',fontSize:22,cursor:'pointer',color:'#9ca3af',lineHeight:1,padding:0}}>×</button>
              </div>
            </div>

            <div className="modal-body">
              {/* Tabs matin/aprem/astreinte */}
              <div className="slot-tabs">
                {[
                  ...(!isClosed ? [['matin','🌅 Matin'],['aprem','🌇 Après-midi']] : []),
                  ['astreinte','🌙 Astreinte']
                ].map(([s,l])=>(
                  <button key={s} onClick={()=>setActiveSlot(s)}
                    className={'slot-tab'+(activeSlot===s?' active':'')}>
                    {l} {alerts.filter(a=>a.slot===s).length>0&&(
                      <span style={{color:'#ef4444',marginLeft:4}}>⚠</span>
                    )}
                  </button>
                ))}
              </div>

              {/* Sections planning (matin / aprem uniquement) */}
              {activeSlot !== 'astreinte' && (
                <>
                  {/* Alertes du slot */}
                  {slotAlerts.length>0&&(
                    <div style={{background:'#fef2f2',border:'1px solid #fecaca',borderRadius:10,padding:10,marginBottom:14}}>
                      {slotAlerts.map((a,i)=>(
                        <div key={i} style={{fontSize:12,color:a.level==='error'?'#dc2626':'#d97706',
                          display:'flex',gap:6,marginBottom:i<slotAlerts.length-1?5:0}}>
                          {a.level==='error'?'✕':'⚠'} {a.msg}
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Un panneau par horaire */}
                  {getSubSlots(activeSlot).map(subSlot=>{
                    const h = HORAIRES[subSlot.horaire];
                    if(!h) return null;
                    const isMatinSlot = activeSlot==='matin';
                    const accentBg  = isMatinSlot ? '#fef9ec' : '#f5f3ff';
                    const accentCol = isMatinSlot ? '#92400e' : '#4c1d95';
                    const accentBorder = isMatinSlot ? '#fde68a' : '#c4b5fd';
                    return(
                      <div key={subSlot.horaire} style={{
                        background:accentBg,border:`1.5px solid ${accentBorder}`,
                        borderRadius:12,padding:'12px 14px',marginBottom:12}}>
                        {/* Titre horaire */}
                        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                          <span style={{fontSize:13,fontWeight:700,color:accentCol}}>
                            {isMatinSlot?'🌅':'🌇'} {h.label}
                          </span>
                          {subSlot.vets.length>0&&(
                            <span style={{fontSize:11,color:'#059669',fontWeight:600,
                              background:'#f0fdf4',border:'1px solid #bbf7d0',
                              borderRadius:20,padding:'1px 8px'}}>
                              {subSlot.vets.length} véto{subSlot.vets.length>1?'s':''}
                            </span>
                          )}
                        </div>
                        {/* Boutons vétos */}
                        <div style={{display:'flex',flexDirection:'column',gap:6}}>
                          {vets.map(v=>{
                            const on=subSlot.vets.includes(v.id);
                            const inU=slotU.includes(v.id);
                            return(
                              <button key={v.id}
                                onClick={()=>toggleVetInSubSlot(activeSlot, subSlot.horaire, v.id)}
                                className={'vet-toggle'+(on?' on':'')}
                                style={on?{'--vc':v.color+'14','--vb':v.color}:{}}>
                                <div style={{width:11,height:11,borderRadius:'50%',background:v.color,flexShrink:0}}/>
                                <span style={{flex:1,fontWeight:on?600:400,color:'#1f2937'}}>{v.name}</span>
                                {inU&&<span style={{fontSize:10,color:'#d97706',fontWeight:700,
                                  background:'#fffbeb',padding:'2px 7px',borderRadius:4,border:'1px solid #fde68a'}}>INDISPO</span>}
                                {on&&<span style={{color:v.color,fontSize:16}}>✓</span>}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </>
              )}

              {/* ── Panneau Astreinte ── */}
              {activeSlot==='astreinte'&&(
                <AstreintePanel datekey={datekey} vets={vets} astreintes={astreintes}
                  setAstreintes={setAstreintes} dow={dow} wp={wp} holidays={holidays}/>
              )}
              <p style={{fontSize:11,color:'#9ca3af',marginTop:14,textAlign:'center'}}>Modifications sauvegardées automatiquement</p>
            </div>
          </div>
        </div>
      );
    }


    // ─── Panneau Astreinte (dans la modal) ────────────────────
    function AstreintePanel({datekey,vets,astreintes,setAstreintes,dow,wp,holidays}){
      const dayA = astreintes[datekey]||{midi:null,soir:null};
      const we   = isWE(dow);
      const isHol = holidays&&holidays.has(datekey);
      const [y,m,d]=datekey.split('-').map(Number);
      const nextDate=new Date(y,m-1,d+1);
      const nextKey=`${nextDate.getFullYear()}-${String(nextDate.getMonth()+1).padStart(2,'0')}-${String(nextDate.getDate()).padStart(2,'0')}`;
      const nextDow=nextDate.getDay();
      const nextIsHol=holidays&&holidays.has(nextKey);
      const isEveOfBloc=!we&&!isHol&&(isWE(nextDow)||nextIsHol);
      const isWEorJF = we || isHol;
      // Sur semaine standard : midi suit soir par défaut, sauf si override manuel
      const midiOverride = !isWEorJF && !isEveOfBloc && dayA.midi !== dayA.soir && (dayA.midi !== null || dayA.soir === null);
      const [showMidiOverride, setShowMidiOverride] = useState(midiOverride);

      const setSoir = (vid) => {
        setAstreintes(prev=>{
          const cur = prev[datekey]||{midi:null,soir:null};
          // si pas d'override midi, midi suit soir
          const newMidi = showMidiOverride ? cur.midi : (vid||null);
          return {...prev,[datekey]:{...cur, soir:vid||null, midi:newMidi}};
        });
      };
      const setMidi = (vid) => setAstreintes(prev=>({
        ...prev,
        [datekey]:{...(prev[datekey]||{midi:null,soir:null}), midi:vid||null}
      }));
      const setSlot = (slot,vid) => slot==='soir' ? setSoir(vid) : setMidi(vid);

      // WE, JF ou veille d'un bloc JF : affichage unifié en bloc
      if(isWEorJF || isEveOfBloc){
        const cur=dayA.midi||null;
        const blocLabel = isHol
          ? '🎌🌙 Bloc jour férié'
          : isEveOfBloc
            ? '🌆🌙 Bloc veille + jour férié'
            : '☀️🌙 Bloc week-end';
        const blocDesc = isHol
          ? 'Jour férié → réouverture'
          : isEveOfBloc
            ? 'Veille fermeture → réouverture après le férié'
            : 'Samedi midi → lundi réouverture';
        return(
          <div>
            <div className="astr-section">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                <div>
                  <span style={{fontSize:13,fontWeight:600,color:'#374151'}}>{blocLabel}</span>
                  <div style={{fontSize:11,color:'#9ca3af'}}>{blocDesc}</div>
                </div>
                {cur&&<button onClick={()=>setAstreintes(prev=>({...prev,[datekey]:{midi:null,soir:null}}))}
                  style={{background:'none',border:'none',cursor:'pointer',fontSize:11,color:'#9ca3af'}}>Effacer</button>}
              </div>
              <VetSelector vets={vets} value={cur} onChange={v=>{
                setAstreintes(prev=>({...prev,[datekey]:{midi:v,soir:v}}));
              }}/>
            </div>
            <AstrInfoBox/>
          </div>
        );
      }

      // Semaine : soir + midi lié
      const soirCur = dayA.soir||null;
      const midiCur = dayA.midi||null;
      return(
        <div>
          {/* SOIR */}
          <div className="astr-section" style={{marginBottom:10}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <div>
                <span style={{fontSize:13,fontWeight:600,color:'#374151'}}>🌙 Soir / nuit</span>
                <div style={{fontSize:11,color:'#9ca3af'}}>Fermeture → réouverture</div>
              </div>
              {soirCur&&<button onClick={()=>setSoir(null)}
                style={{background:'none',border:'none',cursor:'pointer',fontSize:11,color:'#9ca3af'}}>Effacer</button>}
            </div>
            <VetSelector vets={vets} value={soirCur} onChange={setSoir}/>
          </div>

          {/* MIDI — lié au soir par défaut */}
          <div className="astr-section">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
              <div>
                <span style={{fontSize:13,fontWeight:600,color:'#374151'}}>☀️ Pause midi</span>
                <div style={{fontSize:11,color:'#9ca3af'}}>Fin matin → début après-midi</div>
              </div>
              <button onClick={()=>{
                if(showMidiOverride){
                  // Relinker : remettre midi = soir
                  setShowMidiOverride(false);
                  setAstreintes(prev=>({...prev,[datekey]:{...(prev[datekey]||{}),midi:dayA.soir}}));
                } else {
                  setShowMidiOverride(true);
                }
              }} style={{
                background:showMidiOverride?'#fef3c7':'#f0fdfa',
                border:'1px solid '+(showMidiOverride?'#fde68a':'#99f6e4'),
                color:showMidiOverride?'#92400e':'#0d9488',
                borderRadius:6,padding:'3px 9px',fontSize:11,fontWeight:600,cursor:'pointer',
                fontFamily:"'Inter',sans-serif"
              }}>
                {showMidiOverride?'🔗 Relier au soir':'✏️ Modifier'}
              </button>
            </div>
            {showMidiOverride ? (
              <VetSelector vets={vets} value={midiCur} onChange={setMidi}/>
            ) : (
              <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 12px',
                background:'#f8fafc',borderRadius:8,border:'1px dashed #e2e8f0'}}>
                {soirCur ? (()=>{
                  const v=vets.find(x=>x.id===soirCur);
                  return v ? (
                    <>
                      <div style={{width:9,height:9,borderRadius:'50%',background:v.color}}/>
                      <span style={{fontSize:13,color:'#374151',fontWeight:500}}>{v.name}</span>
                      <span style={{fontSize:11,color:'#9ca3af',marginLeft:2}}>(= soir)</span>
                    </>
                  ) : null;
                })() : <span style={{fontSize:12,color:'#9ca3af',fontStyle:'italic'}}>Aucun véto soir sélectionné</span>}
              </div>
            )}
          </div>

          <AstrInfoBox/>
        </div>
      );
    }

    function VetSelector({vets,value,onChange}){
      return(
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          {vets.map(v=>{
            const on=value===v.id;
            return(
              <button key={v.id} onClick={()=>onChange(on?null:v.id)} style={{
                display:'flex',alignItems:'center',gap:10,padding:'9px 13px',borderRadius:10,
                background:on?v.color+'14':'#f9fafb',
                border:'2px solid '+(on?v.color:'#e2e8f0'),
                cursor:'pointer',transition:'all .15s',textAlign:'left',
                fontFamily:"'Inter',sans-serif",fontSize:13,color:'#1f2937',width:'100%'
              }}>
                <div style={{width:10,height:10,borderRadius:'50%',background:v.color,flexShrink:0}}/>
                <span style={{flex:1,fontWeight:on?600:400}}>{v.name}</span>
                {v.phone&&<span style={{fontSize:11,color:'#6b7280'}}>📞 {v.phone}</span>}
                {on&&<span style={{color:v.color,fontSize:16}}>✓</span>}
              </button>
            );
          })}
        </div>
      );
    }

    function AstrInfoBox(){
      return(
        <div style={{marginTop:12,background:'#f0f9ff',border:'1px solid #bae6fd',
          borderRadius:8,padding:'8px 12px',fontSize:11,color:'#0369a1',lineHeight:1.6}}>
          💡 <strong>Génération :</strong> l'astreinte midi suit automatiquement le soir. 
          Utilisez "Modifier" pour définir un véto différent sur la pause midi.
        </div>
      );
    }

    // ─── Onglet Planning ASV ────────────────────────────────────
    // Helpers partagés
    const segH = segs => segs.reduce((s,g)=>s+(g.end-g.start),0);
    const GANTT_S=7.5, GANTT_E=20.5, GANTT_R=GANTT_E-GANTT_S;
    const TYPE_OPACITY={full:1,'full_over':1,renfort_matin:0.55,renfort_jour:0.75,renfort_partiel:0.65};

    function ASVTab({year,month,numDays,startCol,vets,planning,openDays,
      asvs,setAsvs,asvRules,setAsvRules,
      asvPlanning,setAsvPlanning,
      asvUnavailRanges,setAsvUnavailRanges,
      asvPersonalRules,setAsvPersonalRules,
      holidays,onGenerate,onExportASVICS,onExportASVXLSX,
      isoWeek,weekParity}){

      const [section,setSection]=useState('planning');
      const [editKey,setEditKey]=useState(null); // dateKey du jour édité

      const monthPfx=`${year}-${String(month+1).padStart(2,'0')}-`;

      // ── Stats hebdomadaires ─────────────────────────────────
      const weeklyStats=useMemo(()=>{
        const st={};
        Object.entries(asvPlanning).filter(([k])=>k.startsWith(monthPfx))
          .forEach(([key,dd])=>{
            if(!dd||Array.isArray(dd)) return; // skip old/invalid format
            const [y,m,d]=key.split('-').map(Number);
            const wn=isoWeek(y,m-1,d);
            if(!st[wn]) st[wn]={};
            Object.entries(dd).forEach(([aid,ad])=>{
              if(!ad||!Array.isArray(ad.segments)) return; // defensive
              st[wn][aid]=(st[wn][aid]||0)+segH(ad.segments);
            });
          });
        return st;
      },[asvPlanning,monthPfx,isoWeek]);

      const hasPlanning=Object.keys(asvPlanning).some(k=>{
        const v=asvPlanning[k];
        return k.startsWith(monthPfx)&&v&&!Array.isArray(v)&&Object.keys(v).length>0;
      });
      const hasVetPlanning=Object.keys(planning).some(k=>k.startsWith(monthPfx));

      const weeks=useMemo(()=>{
        const cells=Array(startCol).fill(null);
        for(let d=1;d<=numDays;d++) cells.push(d);
        while(cells.length%7!==0) cells.push(null);
        const w=[];
        for(let i=0;i<cells.length;i+=7) w.push(cells.slice(i,i+7));
        return w;
      },[startCol,numDays]);

      const sortedWeeks=Object.keys(weeklyStats).sort((a,b)=>+a-+b);

      return(
        <div style={{fontFamily:"'Inter',sans-serif"}}>
          <div style={{marginBottom:20}}>
            <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:22,fontWeight:700,color:'#1f2937',marginBottom:4}}>
              Planning ASV
            </h2>
            <p style={{color:'#6b7280',fontSize:13}}>
              Génération automatique · pauses déjeuner décalées · click sur un jour pour éditer manuellement
            </p>
          </div>

          {/* Sous-nav */}
          <div style={{display:'flex',gap:4,background:'#fff',border:'1px solid #e2e8f0',borderRadius:12,
            padding:4,marginBottom:20,width:'fit-content'}}>
            {[['planning','📅 Calendrier'],['equipe','👩‍⚕️ Équipe ASV'],['regles','⚙️ Règles']].map(([s,l])=>(
              <button key={s} onClick={()=>setSection(s)}
                style={{padding:'7px 16px',borderRadius:8,border:'none',cursor:'pointer',
                  fontFamily:"'Inter',sans-serif",fontSize:13,fontWeight:section===s?600:400,
                  background:section===s?'#0d9488':'transparent',
                  color:section===s?'#fff':'#6b7280',transition:'all .15s'}}>
                {l}
              </button>
            ))}
          </div>

          {section==='regles'&&<ASVRegles asvRules={asvRules} setAsvRules={setAsvRules}
            asvs={asvs} setAsvs={setAsvs} asvPersonalRules={asvPersonalRules} setAsvPersonalRules={setAsvPersonalRules}/>}
          {section==='equipe'&&<ASVEquipe asvs={asvs} setAsvs={setAsvs}/>}

          {section==='planning'&&(<>
            {/* Actions */}
            <div style={{display:'flex',gap:10,alignItems:'flex-start',marginBottom:16,flexWrap:'wrap'}}>
              {!hasVetPlanning&&(
                <div style={{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:10,
                  padding:'10px 16px',fontSize:13,color:'#92400e',width:'100%'}}>
                  ⚠️ Aucun planning vétérinaire pour ce mois — générez d'abord depuis l'onglet 📅 Planning.
                </div>
              )}
              {hasVetPlanning&&(
                <button onClick={onGenerate} className="btn-teal">⚡ Générer planning ASV</button>
              )}
              {hasPlanning&&(<>
                <button onClick={onExportASVICS}
                  title="Export .ics — compatible Google Calendar, Outlook, Apple Calendar"
                  className="btn-outline"
                  style={{borderColor:'#0d9488',color:'#0d9488',display:'flex',alignItems:'center',gap:6,fontSize:13}}>
                  📅 Export&nbsp;<strong>.ics</strong>
                </button>
                <button onClick={onExportASVXLSX}
                  title="Export Excel — une feuille par semaine, horaires lisibles"
                  className="btn-outline"
                  style={{borderColor:'#16a34a',color:'#16a34a',display:'flex',alignItems:'center',gap:6,fontSize:13}}>
                  📊 Export&nbsp;<strong>Excel</strong>
                </button>
                <div style={{fontSize:12,color:'#6b7280',alignSelf:'center'}}>
                  💡 Cliquez sur un jour pour éditer manuellement les horaires
                </div>
              </>)}
            </div>

            {/* Indisponibilités */}
            <ASVIndispoPanel asvs={asvs} year={year} month={month} numDays={numDays}
              asvUnavailRanges={asvUnavailRanges} setAsvUnavailRanges={setAsvUnavailRanges}/>

            {/* Stats hebdo */}
            {hasPlanning&&(
              <div className="g-card" style={{marginBottom:16}}>
                <h3 style={{fontSize:13,fontWeight:600,color:'#374151',marginBottom:12,
                  textTransform:'uppercase',letterSpacing:'.05em'}}>
                  Heures par semaine — objectif : contrat de chaque ASV
                </h3>
                <div style={{overflowX:'auto'}}>
                  <table style={{borderCollapse:'collapse',fontSize:12,minWidth:'100%'}}>
                    <thead>
                      <tr style={{background:'#f8fafc'}}>
                        <th style={{padding:'8px 12px',textAlign:'left',fontWeight:600,color:'#6b7280',
                          borderBottom:'1px solid #e2e8f0',minWidth:90}}>ASV</th>
                        {sortedWeeks.map(wn=>(
                          <th key={wn} style={{padding:'8px 12px',textAlign:'center',fontWeight:600,
                            color:'#6b7280',borderBottom:'1px solid #e2e8f0',minWidth:80}}>S{wn}</th>
                        ))}
                        <th style={{padding:'8px 12px',textAlign:'center',fontWeight:600,
                          color:'#6b7280',borderBottom:'1px solid #e2e8f0'}}>Total</th>
                      </tr>
                    </thead>
                    <tbody>
                      {asvs.map(a=>{
                        const tot=Object.values(weeklyStats).reduce((s,m)=>s+(m[a.id]||0),0);
                        const targetH=a.contractH??asvRules.hoursPerWeek;
                        return(
                          <tr key={a.id} style={{borderBottom:'1px solid #f1f5f9'}}>
                            <td style={{padding:'8px 12px'}}>
                              <div style={{display:'flex',alignItems:'center',gap:7}}>
                                <div style={{width:9,height:9,borderRadius:'50%',background:a.color,flexShrink:0}}/>
                                <span style={{fontWeight:500,color:'#1f2937'}}>{a.name}</span>
                                <span style={{fontSize:10,color:'#9ca3af',fontWeight:600}}>({targetH}h)</span>
                              </div>
                            </td>
                            {sortedWeeks.map(wn=>{
                              const h=(weeklyStats[wn]||{})[a.id]||0;
                              const pct=Math.min(100,h/targetH*100);
                              const over=h>targetH+0.25;
                              const ok=!over&&h>=targetH-0.25;
                              const under=!over&&!ok&&h>0;
                              const col=over?'#dc2626':ok?'#059669':under?'#d97706':'#9ca3af';
                              return(
                                <td key={wn} style={{padding:'6px 12px',textAlign:'center'}}>
                                  {h>0?(
                                    <>
                                      <div style={{fontSize:12,fontWeight:600,color:col}}>
                                        {h.toFixed(2).replace(/\.?0+$/,'')}h
                                        {over?' ⚠️':ok?' ✓':under?' ↗':''}
                                      </div>
                                      <div style={{height:3,borderRadius:2,background:'#f1f5f9',
                                        width:56,margin:'3px auto 0'}}>
                                        <div style={{height:3,borderRadius:2,width:pct+'%',
                                          background:over?'#ef4444':ok?'#10b981':'#f59e0b'}}/>
                                      </div>
                                    </>
                                  ):<span style={{color:'#d1d5db'}}>—</span>}
                                </td>
                              );
                            })}
                            <td style={{padding:'8px 12px',textAlign:'center',fontWeight:700,
                              color:tot>0?'#0d9488':'#9ca3af'}}>
                              {tot>0?tot.toFixed(1)+'h':'—'}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                <p style={{fontSize:11,color:'#9ca3af',marginTop:8}}>
                  ✓ = contrat exact (±15min) · ↗ = sous contrat · ⚠️ = dépassement · Pauses décalées → couverture non-stop
                </p>
              </div>
            )}

            {/* Calendrier Gantt */}
            <div className="cal-grid">
              <div className="cal-header-row">
                {JOURS.map((j,i)=>(
                  <div key={j} className={'cal-header-cell'+(i>=5?' we':'')}>{j}</div>
                ))}
              </div>
              {weeks.map((week,wi)=>(
                <div key={wi} className="cal-week">
                  {week.map((day,di)=>{
                    if(!day) return <div key={di} className="cal-cell empty"/>;
                    const key=dk(year,month,day);
                    const dow=dowJS(year,month,day);
                    const isHoliday=holidays&&holidays.has(key);
                    const closed=!openDays[dow]||isHoliday;
                    const today=new Date().toDateString()===new Date(year,month,day).toDateString();
                    const we=isWE(dow);
                    const rawDD=asvPlanning[key];
                    const dayData=(rawDD&&!Array.isArray(rawDD))?rawDD:{};
                    const assignedIds=Object.keys(dayData);
                    const wn=isoWeek(year,month,day);
                    const wp=weekParity(year,month,day);
                    const hasDayData=assignedIds.some(id=>dayData[id]?.segments?.length>0);
                    const indispos=asvUnavailRanges.filter(r=>r.fromDate<=key&&r.toDate>=key);

                    return(
                      <div key={di}
                        onClick={()=>!closed&&setEditKey(key)}
                        className={'cal-cell'+(isHoliday?' holiday':closed?' closed':we?' we-day':'')
                          +(hasDayData&&!closed?' asv-has-data':'')}>
                        {/* En-tête jour */}
                        <div style={{display:'flex',justifyContent:'space-between',
                          alignItems:'center',marginBottom:3}}>
                          <div className={'cal-day-num'+(today?' today':closed?' closed-n':we?' closed-n':'')}>
                            {day}
                          </div>
                          {!closed&&di===0&&(
                            <span style={{fontSize:8,fontWeight:700,
                              color:wp==='even'?'#1d4ed8':'#be185d',
                              background:wp==='even'?'#dbeafe':'#fce7f3',
                              borderRadius:4,padding:'1px 4px'}}>
                              S{wn}
                            </span>
                          )}
                        </div>

                        {closed?(
                          <div style={{fontSize:9,color:isHoliday?'#b45309':'#d1d5db',
                            textTransform:'uppercase',letterSpacing:'.05em',
                            fontWeight:isHoliday?600:400}}>
                            {isHoliday?'Férié':'Fermé'}
                          </div>
                        ):hasDayData?(
                          <div>
                            {/* Mini Gantt — une ligne par ASV */}
                            {asvs.map(a=>{
                              const ad=dayData[a.id];
                              if(!ad||!Array.isArray(ad.segments)||!ad.segments.length) return null;
                              const h=segH(ad.segments);
                              return(
                                <div key={a.id} style={{marginBottom:2}}>
                                  <div className="asv-gantt-row">
                                    {ad.segments.map((seg,si)=>{
                                      const left=Math.max(0,(seg.start-GANTT_S)/GANTT_R*100);
                                      const w=Math.max(0.5,(seg.end-seg.start)/GANTT_R*100);
                                      return(
                                        <div key={si} className="asv-gantt-seg" style={{
                                          left:left+'%',width:w+'%',
                                          background:a.color,
                                          opacity:TYPE_OPACITY[ad.type]||0.9}}/>
                                      );
                                    })}
                                  </div>
                                  <div style={{fontSize:7,color:a.color,fontWeight:700,
                                    lineHeight:1,marginBottom:1}}>
                                    {a.name.slice(0,3)} {h.toFixed(2).replace(/\.?0+$/,'')}h
                                    {ad.type==='renfort_matin'&&<span style={{opacity:.7}}> ☀</span>}
                                    {(ad.type==='renfort_jour'||ad.type==='renfort_matin')&&
                                      <span style={{opacity:.6}}> +</span>}
                                    {ad.type==='full_over'&&<span style={{color:'#dc2626'}}> !</span>}
                                  </div>
                                </div>
                              );
                            })}
                            {/* Indispos */}
                            {indispos.map(r=>{
                              const a=asvs.find(x=>x.id===r.asvId); if(!a) return null;
                              return(
                                <div key={r.id} style={{fontSize:7,color:'#9ca3af',
                                  background:'#f1f5f9',borderRadius:3,padding:'1px 4px',
                                  display:'flex',gap:2,alignItems:'center',marginBottom:1}}>
                                  <span>🚫</span>
                                  <span style={{color:a.color,fontWeight:600}}>{a.name.slice(0,3)}</span>
                                </div>
                              );
                            })}
                            <div style={{fontSize:7,color:'#9ca3af',textAlign:'right',
                              marginTop:2}}>✏️ éditer</div>
                          </div>
                        ):hasVetPlanning&&!we&&planning[key]?(
                          <div style={{fontSize:9,color:'#9ca3af',fontStyle:'italic'}}>Non généré</div>
                        ):null}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>

            {/* Légende */}
            <div className="legend" style={{marginTop:12}}>
              {asvs.map(a=>(
                <div key={a.id} className="legend-item">
                  <div className="legend-dot" style={{background:a.color}}/>
                  {a.name}
                </div>
              ))}
              <div style={{display:'flex',gap:8,marginLeft:'auto',flexWrap:'wrap',alignItems:'center'}}>
                <span style={{fontSize:10,color:'#6b7280'}}>Opacité : pleine = base · réduite = renfort</span>
              </div>
            </div>
          </>)}

          {/* Modal éditeur de jour — portal pour éviter les problèmes d'opacité/z-index */}
          {editKey&&ReactDOM.createPortal(
            <ASVDayModal
              dateKey={editKey}
              asvs={asvs}
              asvPlanning={asvPlanning}
              setAsvPlanning={setAsvPlanning}
              asvRules={asvRules}
              year={year} month={month}
              onClose={()=>setEditKey(null)}/>,
            document.body
          )}
        </div>
      );
    }

    // ─── Modal éditeur de jour (grille 15min) ──────────────────
    function ASVDayModal({dateKey,asvs,asvPlanning,setAsvPlanning,asvRules,year,month,onClose}){
      const SLOT_H = 0.25; // 15 min
      const DISP_S = 7.0, DISP_E = 21.0;
      const slots = [];
      for(let h=DISP_S; h<DISP_E; h=Math.round((h+SLOT_H)*100)/100) slots.push(h);
      const nSlots = slots.length;

      // Convertit segments → Set d'indices de slots actifs
      const segsToSet = (segs) => {
        const s = new Set();
        segs.forEach(seg=>{
          slots.forEach((h,i)=>{ if(h>=seg.start&&h<seg.end) s.add(i); });
        });
        return s;
      };
      // Convertit Set → segments
      const setToSegs = (set) => {
        const sorted=[...set].sort((a,b)=>a-b);
        if(!sorted.length) return [];
        const segs=[]; let sS=slots[sorted[0]], sE=sS+SLOT_H;
        for(let k=1;k<sorted.length;k++){
          if(sorted[k]===sorted[k-1]+1) sE=slots[sorted[k]]+SLOT_H;
          else{ segs.push({start:sS,end:Math.round(sE*100)/100}); sS=slots[sorted[k]]; sE=sS+SLOT_H; }
        }
        segs.push({start:sS,end:Math.round(sE*100)/100});
        return segs;
      };

      const fmtH = h => {
        const hh=Math.floor(h), mm=Math.round((h-hh)*60);
        return `${hh}h${String(mm).padStart(2,'0')}`;
      };

      // Initialiser la matrice depuis le planning existant
      const initMatrix = () => {
        const m={};
        asvs.forEach(a=>{
          const dayRaw=(asvPlanning[dateKey]||{});
          const ad=(!Array.isArray(dayRaw)&&dayRaw[a.id]?.segments)?dayRaw[a.id]:null;
          m[a.id] = ad ? segsToSet(ad.segments) : new Set();
        });
        return m;
      };

      const [matrix,setMatrix]=useState(initMatrix);
      const [drag,setDrag]=useState(null); // {asvId, targetOn}

      // Listener mouseup global pour arrêter le drag
      useEffect(()=>{
        const up=()=>setDrag(null);
        window.addEventListener('mouseup',up);
        return ()=>window.removeEventListener('mouseup',up);
      },[]);

      const setCells=(asvId,slotIdx,on)=>{
        setMatrix(prev=>{
          const next={...prev,[asvId]:new Set(prev[asvId])};
          if(on) next[asvId].add(slotIdx);
          else   next[asvId].delete(slotIdx);
          return next;
        });
      };

      // Heures par ASV depuis la matrice courante
      const hoursMap = {};
      asvs.forEach(a=>{ hoursMap[a.id]=matrix[a.id].size*SLOT_H; });

      // Couverture par slot
      const coverage = slots.map((_,i)=>asvs.filter(a=>matrix[a.id].has(i)).length);
      const minCov = Math.min(...coverage.filter((_,i)=>{
        // Ignorer les slots en dehors de la plage de travail réelle
        const h=slots[i];
        return asvs.some(a=>{
          const ad=(asvPlanning[dateKey]||{})[a.id];
          return ad && ad.segments.some(s=>h>=s.start-0.5&&h<s.end+0.5);
        });
      }), Infinity);

      const save=()=>{
        const newDD={...((asvPlanning[dateKey])||{})};
        asvs.forEach(a=>{
          const segs=setToSegs(matrix[a.id]);
          if(segs.length>0){
            newDD[a.id]={segments:segs, type:(asvPlanning[dateKey]||{})[a.id]?.type||'full'};
          } else {
            delete newDD[a.id];
          }
        });
        setAsvPlanning(prev=>({...prev,[dateKey]:newDD}));
        onClose();
      };

      const [d2,mo2]=dateKey.split('-').map(Number);
      const dayLabel=`${JOURS[(new Date(d2,mo2-1,+dateKey.slice(8)).getDay()+6)%7]} ${+dateKey.slice(8)} ${MOIS[mo2-1]} ${d2}`;

      // Slot d'affichage partiel — afficher le label seulement aux heures et demies
      const rowClass=(h)=>{
        const hh=Math.floor(h), m=Math.round((h-hh)*60);
        if(m===0) return 'hr';
        if(m===30) return 'hh';
        return '';
      };
      const timeLabel=(h)=>{
        const hh=Math.floor(h), m=Math.round((h-hh)*60);
        if(m===0) return fmtH(h);
        if(m===30) return '·';
        return '';
      };

      return(
        <div className="modal-overlay active" onClick={e=>e.target===e.currentTarget&&onClose()}
          onMouseUp={()=>setDrag(null)} style={{opacity:1,visibility:'visible'}}>
          <div className="asv-modal-box">
            {/* Header */}
            <div className="modal-head" style={{display:'flex',justifyContent:'space-between',
              alignItems:'center',gap:12}}>
              <div>
                <h3 style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,
                  color:'#1f2937',margin:0}}>
                  Horaires ASV — {dayLabel}
                </h3>
                <p style={{fontSize:12,color:'#6b7280',margin:'4px 0 0'}}>
                  Click pour activer/désactiver · Drag pour remplir en continu · 1 case = 15 min
                </p>
              </div>
              <div style={{display:'flex',gap:8,alignItems:'center',flexShrink:0}}>
                <button onClick={save} className="btn-teal" style={{fontSize:13}}>
                  ✓ Enregistrer
                </button>
                <button onClick={onClose} className="btn-ghost" style={{fontSize:20,padding:'2px 8px'}}>
                  ✕
                </button>
              </div>
            </div>

            {/* Totaux ASV */}
            <div style={{display:'flex',gap:8,padding:'10px 24px',borderBottom:'1px solid #f1f5f9',
              flexWrap:'wrap'}}>
              {asvs.map(a=>{
                const h=hoursMap[a.id];
                const targetH=a.contractH??asvRules.hoursPerWeek;
                const ok=h>=targetH-0.25&&h<=targetH+0.25;
                const over=h>targetH+0.25;
                return(
                  <div key={a.id} style={{display:'flex',alignItems:'center',gap:6,
                    padding:'4px 10px',borderRadius:20,
                    background:a.color+'15',border:'1.5px solid '+a.color+'44'}}>
                    <div style={{width:8,height:8,borderRadius:'50%',background:a.color}}/>
                    <span style={{fontSize:12,fontWeight:700,color:a.color}}>{a.name}</span>
                    <span style={{fontSize:12,fontWeight:600,
                      color:over?'#dc2626':ok?'#059669':'#6b7280'}}>
                      {h.toFixed(2).replace(/\.?0+$/,'')}h
                      {over?' ⚠️':ok?' ✓':''}
                    </span>
                  </div>
                );
              })}
              {minCov===0&&(
                <div style={{fontSize:12,color:'#dc2626',fontWeight:600,
                  background:'#fef2f2',borderRadius:20,padding:'4px 12px',
                  border:'1px solid #fecaca'}}>
                  ⚠ Créneau(x) sans couverture
                </div>
              )}
            </div>

            {/* Grille */}
            <div className="asv-grid-wrap">
              <table className="asv-grid-tbl">
                <thead>
                  <tr>
                    <th className="asv-th-time">Heure</th>
                    {asvs.map(a=>(
                      <th key={a.id} style={{
                        background:a.color+'18',
                        color:a.color,
                        borderLeft:'2px solid '+a.color+'44',
                        minWidth:70}}>
                        {a.name}
                        <div style={{fontSize:9,fontWeight:400,color:a.color+'cc',marginTop:1}}>
                          {hoursMap[a.id].toFixed(2).replace(/\.?0+$/,'')}h
                        </div>
                      </th>
                    ))}
                    <th className="asv-th-cov" title="Couverture">👥</th>
                  </tr>
                </thead>
                <tbody>
                  {slots.map((h,i)=>{
                    const rc=rowClass(h);
                    const cov=coverage[i];
                    return(
                      <tr key={i} className={`asv-grid-row${rc?' '+rc:''}`}>
                        <td className={`asv-time-lbl${rc?' '+rc:''}`}>{timeLabel(h)}</td>
                        {asvs.map(a=>{
                          const on=matrix[a.id].has(i);
                          return(
                            <td key={a.id}
                              className="asv-grid-cell"
                              style={{
                                background:on?a.color:'transparent',
                                borderLeft:'1px solid #f1f5f9',
                                opacity:on?0.88:1,
                              }}
                              onMouseDown={e=>{
                                e.preventDefault();
                                const target=!on;
                                setDrag({asvId:a.id,targetOn:target});
                                setCells(a.id,i,target);
                              }}
                              onMouseEnter={()=>{
                                if(drag&&drag.asvId===a.id) setCells(a.id,i,drag.targetOn);
                              }}
                            />
                          );
                        })}
                        <td className="asv-cov-cell" style={{
                          background:cov===0?'#fef2f2':cov>=2?'#f0fdf4':'transparent',
                          color:cov===0?'#ef4444':cov>=2?'#059669':'#9ca3af',
                          fontWeight:600}}>
                          {cov||'—'}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            {/* Footer */}
            <div style={{padding:'12px 24px',borderTop:'1px solid #f1f5f9',display:'flex',
              justifyContent:'space-between',alignItems:'center',gap:12}}>
              <div style={{fontSize:11,color:'#9ca3af'}}>
                Colonne 👥 : nbre d'ASV présentes par quart d'heure · rouge = trou de couverture
              </div>
              <div style={{display:'flex',gap:8}}>
                <button onClick={()=>setMatrix(initMatrix())} className="btn-ghost"
                  style={{fontSize:12,padding:'6px 12px'}}>
                  ↺ Réinitialiser
                </button>
                <button onClick={onClose} className="btn-ghost">Annuler</button>
                <button onClick={save} className="btn-teal">✓ Enregistrer</button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── Panel indisponibilités ASV ────────────────────────────
    function ASVIndispoPanel({asvs,year,month,numDays,asvUnavailRanges,setAsvUnavailRanges}){
      const [open, setOpen]=useState(false);
      const [asvId,setAsvId]=useState('');
      const [fromDate,setFromDate]=useState('');
      const [toDate,setToDate]=useState('');
      const [fromTime,setFromTime]=useState(0);
      const [toTime,setToTime]=useState(24);

      // Options 15min de 0h à 24h
      const timeOpts=[];
      for(let h=0;h<=24;h+=0.25) timeOpts.push(h);
      const fmtT = h=>{
        const hh=Math.floor(h), mm=Math.round((h-hh)*60);
        return `${String(hh).padStart(2,'0')}h${String(mm).padStart(2,'0')}`;
      };

      const monthStr=`${year}-${String(month+1).padStart(2,'0')}`;
      // Pad day number to YYYY-MM-DD
      const dayKey=(d)=>`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

      const doAdd=()=>{
        if(!asvId||!fromDate||!toDate) return;
        if(fromDate>toDate) return;
        if(fromDate===toDate&&fromTime>=toTime) return;
        setAsvUnavailRanges(prev=>[...prev,{
          id:uid(), asvId, fromDate, toDate,
          fromTime: +fromTime, toTime: +toTime
        }]);
        setFromDate(''); setToDate(''); setFromTime(0); setToTime(24);
      };
      const doRemove=(id)=>setAsvUnavailRanges(prev=>prev.filter(r=>r.id!==id));

      // Indispos dans ce mois ou chevauchant
      const visible=asvUnavailRanges.filter(r=>{
        const mStart=dayKey(1), mEnd=dayKey(numDays);
        return r.fromDate<=mEnd && r.toDate>=mStart;
      });

      return(
        <div className="g-card" style={{marginBottom:16}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:open?14:0}}>
            <h3 style={{fontSize:13,fontWeight:600,color:'#374151'}}>
              🚫 Indisponibilités ASV
              {visible.length>0&&<span style={{marginLeft:7,background:'#fef2f2',color:'#ef4444',
                border:'1px solid #fecaca',borderRadius:10,padding:'1px 7px',fontSize:11,fontWeight:700}}>
                {visible.length}
              </span>}
            </h3>
            <button onClick={()=>setOpen(v=>!v)} className="btn-ghost" style={{fontSize:12,padding:'5px 12px'}}>
              {open?'▲ Masquer':'▼ Afficher / Ajouter'}
            </button>
          </div>

          {open&&(
            <>
              {/* Formulaire ajout */}
              <div style={{background:'#f8fafc',borderRadius:10,padding:14,marginBottom:14,border:'1px solid #e2e8f0'}}>
                <p style={{fontSize:12,fontWeight:600,color:'#6b7280',marginBottom:10,textTransform:'uppercase',letterSpacing:'.05em'}}>
                  Ajouter une indisponibilité
                </p>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end'}}>
                  <div>
                    <span className="g-label">ASV</span>
                    <select value={asvId} onChange={e=>setAsvId(e.target.value)} className="g-input" style={{minWidth:130}}>
                      <option value=''>Choisir…</option>
                      {asvs.map(a=><option key={a.id} value={a.id}>{a.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <span className="g-label">Date début</span>
                    <input type="date" value={fromDate} onChange={e=>setFromDate(e.target.value)}
                      className="g-input" style={{width:145}}
                      min={`${year}-01-01`} max={`${year+1}-12-31`}/>
                  </div>
                  <div>
                    <span className="g-label">Heure début (15min)</span>
                    <select value={fromTime} onChange={e=>setFromTime(+e.target.value)} className="g-input">
                      {timeOpts.filter(h=>h<24).map(h=><option key={h} value={h}>{fmtT(h)}</option>)}
                    </select>
                  </div>
                  <div>
                    <span className="g-label">Date fin</span>
                    <input type="date" value={toDate} onChange={e=>setToDate(e.target.value)}
                      className="g-input" style={{width:145}}
                      min={fromDate||`${year}-01-01`} max={`${year+1}-12-31`}/>
                  </div>
                  <div>
                    <span className="g-label">Heure fin (15min)</span>
                    <select value={toTime} onChange={e=>setToTime(+e.target.value)} className="g-input">
                      {timeOpts.filter(h=>h>0).map(h=><option key={h} value={h}>{fmtT(h)}</option>)}
                    </select>
                  </div>
                  <button onClick={doAdd} className="btn-teal"
                    disabled={!asvId||!fromDate||!toDate||fromDate>toDate||(fromDate===toDate&&+fromTime>=+toTime)}>
                    Ajouter
                  </button>
                </div>
                <p style={{fontSize:11,color:'#9ca3af',marginTop:8}}>
                  💡 Granularité 15 min · Peut s'étendre sur plusieurs jours · L'ASV est automatiquement exclue lors de la génération
                </p>
              </div>

              {/* Liste indispos */}
              {visible.length===0?(
                <p style={{fontSize:13,color:'#9ca3af',fontStyle:'italic'}}>Aucune indisponibilité pour ce mois.</p>
              ):(
                <div style={{display:'flex',flexDirection:'column',gap:6}}>
                  {visible.map(r=>{
                    const a=asvs.find(x=>x.id===r.asvId);
                    const singleDay=r.fromDate===r.toDate;
                    return(
                      <div key={r.id} style={{display:'flex',alignItems:'center',gap:10,
                        padding:'8px 14px',background:'#fff',border:'1.5px solid #e2e8f0',
                        borderRadius:10,borderLeft:'4px solid '+(a?.color||'#e2e8f0')}}>
                        <div style={{width:10,height:10,borderRadius:'50%',background:a?.color||'#ccc',flexShrink:0}}/>
                        <span style={{fontWeight:600,color:'#1f2937',fontSize:13,minWidth:70}}>{a?.name||'?'}</span>
                        <span style={{fontSize:12,color:'#6b7280',flex:1}}>
                          {singleDay?(
                            <>{r.fromDate} · {fmtT(r.fromTime)} → {fmtT(r.toTime)}</>
                          ):(
                            <>{r.fromDate} {fmtT(r.fromTime)} → {r.toDate} {fmtT(r.toTime)}</>
                          )}
                        </span>
                        <button onClick={()=>doRemove(r.id)} className="btn-danger-soft">✕</button>
                      </div>
                    );
                  })}
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    // ─── Règles ASV ────────────────────────────────────────────
    function ASVRegles({asvRules,setAsvRules,asvs,setAsvs,asvPersonalRules,setAsvPersonalRules}){

                  <span style={{fontSize:18,fontWeight:700,color:'#0d9488',minWidth:48,textAlign:'center'}}>

                  <button onClick={()=>setAsvRules(r=>({...r,lunchBreak:Math.min(2,+(r.lunchBreak+0.25).toFixed(2))}))}
                    style={{width:28,height:28,borderRadius:'50%',border:'1.5px solid #e2e8f0',background:'#f8fafc',
                      cursor:'pointer',fontSize:16,fontWeight:600,color:'#6b7280',display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>

                    style={{width:28,height:28,borderRadius:'50%',border:'1.5px solid #e2e8f0',background:'#f8fafc',
                      cursor:'pointer',fontSize:16,fontWeight:600,color:'#6b7280',display:'flex',alignItems:'center',justifyContent:'center'}}>−</button>
                  <span style={{fontSize:18,fontWeight:700,color:'#0d9488',minWidth:48,textAlign:'center'}}>
                    {(asvRules.minShiftH??3.5)}h
                  </span>

            </h4>

              <p style={{fontSize:13,color:'#9ca3af',fontStyle:'italic'}}>Aucune ASV enregistrée.</p>

    // ─── Éditeur de contraintes personnelles par ASV ────────────
    function ASVPersonalRuleEditor({asv,asvPersonalRules,setAsvPersonalRules}){
      const [open,   setOpen]    = useState(false);
      const [rType,  setRType]   = useState('day_off');
      const [dow,    setDow]     = useState(1);
      const [endH,   setEndH]    = useState(17);
      const [startH, setStartH]  = useState(9);

      const rules = asvPersonalRules[asv.id] || [];

      const JOURS_LONG = ['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];

      // Options d'heure de début tardif (8h30 → 14h00 par demi-heure)
      const startOpts = [];
      for(let h=8.5; h<=14; h+=0.5) startOpts.push(h);

      // Options d'heure de fin anticipée (11h00 → 19h00 par demi-heure)
      const endOpts = [];
      for(let h=11; h<=19; h+=0.5) endOpts.push(h);

      const fmtT = h => { const hh=Math.floor(h), mm=Math.round((h-hh)*60); return `${hh}h${String(mm).padStart(2,'0')}`; };

      const addRule = () => {
        if(rules.some(r => r.dow === +dow && r.type === rType)) return;
        const extra = rType==='early_end'  ? {endTime:   +endH}
                    : rType==='late_start' ? {startTime: +startH}
                    : {};
        const newRule = {id: uid(), type: rType, dow: +dow, ...extra};
        setAsvPersonalRules(prev => ({...prev, [asv.id]: [...(prev[asv.id]||[]), newRule]}));
      };
      const removeRule = id => setAsvPersonalRules(prev => ({...prev, [asv.id]: (prev[asv.id]||[]).filter(r=>r.id!==id)}));

      const totalRules = rules.length;

      return(
        <div style={{border:'1.5px solid #e2e8f0',borderRadius:12,overflow:'hidden',
          borderLeft:'4px solid '+asv.color}}>
          {/* En-tête ASV */}
          <div onClick={()=>setOpen(v=>!v)} style={{display:'flex',alignItems:'center',gap:10,
            padding:'10px 14px',cursor:'pointer',background:open?asv.color+'0d':'#fff',
            transition:'background .15s',userSelect:'none'}}>
            <div style={{width:11,height:11,borderRadius:'50%',background:asv.color,flexShrink:0}}/>
            <span style={{flex:1,fontWeight:600,fontSize:14,color:'#1f2937'}}>{asv.name}</span>
            {totalRules>0&&(
              <span style={{background:asv.color+'22',color:asv.color,border:'1px solid '+asv.color+'44',
                borderRadius:10,padding:'1px 8px',fontSize:11,fontWeight:700}}>
                {totalRules} contrainte{totalRules>1?'s':''}
              </span>
            )}
            {totalRules===0&&<span style={{fontSize:11,color:'#9ca3af',fontStyle:'italic'}}>Aucune contrainte</span>}
            <span style={{fontSize:11,color:'#9ca3af',marginLeft:4}}>{open?'▲':'▼'}</span>
          </div>

          {open&&(
            <div style={{padding:'0 14px 14px',background:'#fafafa',borderTop:'1px solid #f1f5f9'}}>
              {/* Liste des règles existantes */}
              {rules.length===0&&(
                <p style={{fontSize:12,color:'#9ca3af',fontStyle:'italic',marginTop:12,marginBottom:8}}>
                  Aucune contrainte personnelle pour {asv.name}.
                </p>
              )}
              {rules.length>0&&(
                <div style={{display:'flex',flexDirection:'column',gap:6,marginTop:12,marginBottom:12}}>
                  {rules.map(r=>(
                    <div key={r.id} style={{display:'flex',alignItems:'center',gap:8,
                      padding:'8px 12px',background:'#fff',borderRadius:8,
                      border:'1px solid #e2e8f0',fontSize:13}}>
                      {r.type==='day_off'&&(
                        <span style={{flex:1}}>
                          🚫 <strong>Repos fixe</strong> — <span style={{color:asv.color,fontWeight:600}}>{JOURS_LONG[r.dow]}</span>
                          <span style={{marginLeft:8,fontSize:11,color:'#9ca3af'}}>ne travaille pas ce jour</span>
                        </span>
                      )}
                      {r.type==='late_start'&&(
                        <span style={{flex:1}}>
                          🌅 <strong>Début à {fmtT(r.startTime)}</strong> — <span style={{color:asv.color,fontWeight:600}}>{JOURS_LONG[r.dow]}</span>
                          <span style={{marginLeft:8,fontSize:11,color:'#9ca3af'}}>prise de service décalée</span>
                        </span>
                      )}
                      {r.type==='early_end'&&(
                        <span style={{flex:1}}>
                          ⏰ <strong>Fin à {fmtT(r.endTime)}</strong> — <span style={{color:asv.color,fontWeight:600}}>{JOURS_LONG[r.dow]}</span>
                          <span style={{marginLeft:8,fontSize:11,color:'#9ca3af'}}>fin de service anticipée</span>
                        </span>
                      )}
                      <button onClick={()=>removeRule(r.id)} className="btn-danger-soft"
                        style={{padding:'3px 10px',fontSize:11}}>✕</button>
                    </div>
                  ))}
                </div>
              )}

              {/* Formulaire d'ajout */}
              <div style={{background:'#f0fdfa',border:'1px solid #99f6e4',borderRadius:10,
                padding:'10px 12px',display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end'}}>
                <div>
                  <span className="g-label">Type de règle</span>
                  <select value={rType} onChange={e=>setRType(e.target.value)} className="g-input">
                    <option value="day_off">🚫 Jour off fixe</option>
                    <option value="late_start">🌅 Début tardif</option>
                    <option value="early_end">⏰ Fin anticipée</option>
                  </select>
                </div>
                <div>
                  <span className="g-label">Jour de la semaine</span>
                  <select value={dow} onChange={e=>setDow(+e.target.value)} className="g-input">
                    {[1,2,3,4,5,6,0].map(d=>(
                      <option key={d} value={d}>{JOURS_LONG[d]}</option>
                    ))}
                  </select>
                </div>
                {rType==='late_start'&&(
                  <div>
                    <span className="g-label">Commence à</span>
                    <select value={startH} onChange={e=>setStartH(+e.target.value)} className="g-input">
                      {startOpts.map(h=><option key={h} value={h}>{fmtT(h)}</option>)}
                    </select>
                  </div>
                )}
                {rType==='early_end'&&(
                  <div>
                    <span className="g-label">Finit à</span>
                    <select value={endH} onChange={e=>setEndH(+e.target.value)} className="g-input">
                      {endOpts.map(h=><option key={h} value={h}>{fmtT(h)}</option>)}
                    </select>
                  </div>
                )}
                <button onClick={addRule} className="btn-teal"
                  style={{fontSize:13,padding:'8px 16px'}}
                  disabled={rules.some(r=>r.dow===+dow&&r.type===rType)}>
                  + Ajouter
                </button>
              </div>
              {rules.some(r=>r.dow===+dow&&r.type===rType)&&(
                <p style={{fontSize:11,color:'#d97706',marginTop:6}}>
                  ⚠ Une règle de ce type existe déjà pour {JOURS_LONG[+dow]}.
                </p>
              )}
              <p style={{fontSize:11,color:'#9ca3af',marginTop:6,lineHeight:1.5}}>
                💡 Régénérez le planning ASV après modification pour appliquer les contraintes.
              </p>
            </div>
          )}
        </div>
      );
    }
